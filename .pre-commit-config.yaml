---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        args: ["-S", "warning"]
        language: system
        types: [shell]

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: biome
        args: [check, --no-errors-on-unmatched]
        language: system
        files: '^(device/autojs6/.*\.js|control/static/.*\.css)$'

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt
        args: ["-d", "-i", "2", "-ci"]
        language: system
        types: [shell]

  - repo: local
    hooks:
      - id: just-fmt
        name: justfile format
        entry: bash
        args: ["-c", "just --fmt --check"]
        language: system
        files: '^(justfile|just/.*\.just)$'

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier
        args: ["--check"]
        language: system
        types_or: [markdown, html, css]

  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: markdownlint
        args: ["--config", ".markdownlint.json"]
        language: system
        types: [markdown]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: local
    hooks:
      - id: ansible-lint-project
        name: ansible-lint
        entry: >-
          bash -c 'ansible-galaxy collection install -r ansible/requirements.yml
          -p .ansible/collections >/dev/null 2>&1 || true; cd ansible &&
          ansible-lint playbooks/ ../ansible_collections/stayturgid/'
        language: python
        additional_dependencies: [ansible-lint]
        pass_filenames: false
