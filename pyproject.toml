[project]
name = "stayturgid"
version = "0.1.0"
description = "Keeps wireless ADB, Shizuku, and SSH alive on unrooted Android phones"
requires-python = ">=3.12"
dependencies = [
  # Keep this bound in step with tests/python/requirements.txt, which carries
  # the reasoning: 2.22.0b1+ require Python >=3.13 while CI runs 3.12. Without
  # it here, `uv sync` silently bypasses the pin that `uv pip install -r
  # tests/python/requirements.txt` honours.
  "ansible-core>=2.16,<2.22",
  "pytest>=7",
  "pytest-mock>=3",
  "pytest-ansible>=2",
  "entangled-cli>=2.4.0,<2.4.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
exclude = ['^\.venv-test/', '^\.ansible/', '^device/autojs6/']
