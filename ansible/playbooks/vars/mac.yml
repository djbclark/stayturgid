---
# Shared variables for Mac workstation playbooks (localhost).
stayturgid_repo_root: "{{ playbook_dir }}/../.."
stayturgid_gui_audit_enabled: false
# Set true (or pass -e) for VLM model download + launchd agent install tasks.
stayturgid_vlm_enabled: false

conf_dir: "{{ lookup('env', 'HOME') }}/.config/stayturgid"
agents_dir: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents"
stayturgid_ssh_keys_dir: "{{ lookup('env', 'HOME') }}/.ssh"
ssh_config_dir: "{{ lookup('env', 'HOME') }}/.ssh"
ssh_config_fragment: "{{ lookup('env', 'HOME') }}/.ssh/config.d/stayturgid"

# Homebrew install path (Apple Silicon default; Intel uses /usr/local).
stayturgid_homebrew_prefix: >-
  {{
    '/opt/homebrew'
    if ansible_facts.get('architecture', 'arm64') in ['arm64', 'aarch64']
    else '/usr/local'
  }}

# Project Homebrew formulae.
stayturgid_mac_brew_packages_base:
  - android-platform-tools
  - python
  - pipx
  - git
  - ansible
  - scrcpy

stayturgid_mac_brew_packages_app_stores:
  - fdroidcl
  - apkeep

stayturgid_mac_brew_packages_vlm:
  - llama.cpp

stayturgid_mac_pipx_packages:
  - uiautomator2

# UI-TARS vendor-neutral paths (see mac/ui-tars/ui_tars_env.sh).
ui_tars_hf_base: https://huggingface.co/adriabama06/UI-TARS-1.5-7B-GGUF/resolve/main
ui_tars_model_dir: "{{ lookup('env', 'HOME') }}/.local/share/ui-tars/models/1.5-7b"
ui_tars_port: "{{ lookup('env', 'UI_TARS_PORT') | default(lookup('env', 'STAYTURGID_VLM_PORT') | default(8081, true), true) }}"
ui_tars_log_file: "{{ lookup('env', 'HOME') }}/Library/Logs/ui-tars/server.log"
ui_tars_working_dir: "{{ lookup('env', 'HOME') }}/.local/share/ui-tars/server"
ui_tars_pid_file: "{{ lookup('env', 'HOME') }}/.local/share/ui-tars/server/server.pid"
ui_tars_run_script: "{{ stayturgid_repo_root | realpath }}/mac/ui-tars/ui_tars_server_run.sh"
ui_tars_service_label: homebrew.mxcl.ui-tars
ui_tars_service_plist: "{{ agents_dir }}/{{ ui_tars_service_label }}.plist"
ui_tars_legacy_service_label: homebrew.mxcl.qss-ui-tars
ui_tars_legacy_service_plist: "{{ agents_dir }}/{{ ui_tars_legacy_service_label }}.plist"
ui_tars_models:
  - ByteDance-Seed_UI-TARS-1.5-7B-Q4_K_M.gguf
  - mmproj-ByteDance-Seed_UI-TARS-1.5-7B.gguf
