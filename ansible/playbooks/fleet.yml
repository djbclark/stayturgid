---
# Full fleet deploy: Termux userland + AutoJs6 watchdog, all over SSH.
# Boot-loop restart happens via handler only when boot scripts change.
#
# Usage (from repo root, or via ./mac/deploy-fleet.sh):
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook \
#     ansible/playbooks/fleet.yml [--limit s24]
#
# Per-host failures don't stop other hosts (Ansible default behavior).
- name: stayturgid fleet deploy
  hosts: stayturgid
  gather_facts: false
  roles:
    - role: termux_userland
    - role: autojs6_watchdog
    - role: obtainium_apps
    # fdroid_repos side project (F-Droid / Neo Store support)
    # - role: fdroid_repos
    #   vars:
    #     target_device: "{{ inventory_hostname }}"
    #   # Defaults ensure IzzyOnDroid, Guardian etc. + Neo Store client setup with Shizuku.
    #   # Run after obtainium_apps. fdroidcl on control.
    # play_store side project (Aurora Store for Play)
    # - role: play_store
    #   vars:
    #     target_device: "{{ inventory_hostname }}"
    #   # Ensures Aurora Store client with Shizuku (Aurora added to Obtainium catalog).
    #   # gplaycli for download if set up (pip installed, may need auth).
