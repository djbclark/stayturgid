---
# Ensure launchd jobs in mac_launchd_ensure_services are loaded; heal unknown state
# and optional HTTP health_url failures (keepalive long-runners like UI-TARS).
#
# Vars:
#   mac_launchd_ensure_services — list of {name, plist, health_url?}
#   mac_launchd_reload_labels   — labels needing reloaded after plist template change
- name: Stat launchd plist for {{ item.name }}
  ansible.builtin.stat:
    path: "{{ item.plist }}"
  loop: "{{ mac_launchd_ensure_services }}"
  register: _mac_launchd_plist_stats
  loop_control:
    label: "{{ item.name }}"

- name: Build installed launchd ensure targets
  ansible.builtin.set_fact:
    _mac_launchd_installed: >-
      {{
        _mac_launchd_plist_stats.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
      }}

- name: Ensure launchd agent {{ item.name }} is loaded
  community.general.launchd:
    name: "{{ item.name }}"
    state: >-
      {{
        'reloaded'
        if item.name in (mac_launchd_reload_labels | default([]))
        else 'started'
      }}
    enabled: true
  loop: "{{ _mac_launchd_installed }}"
  register: _mac_launchd_ensure_results
  loop_control:
    label: "{{ item.name }}"

- name: Heal launchd agent {{ item.item.name }} after unknown exit state
  community.general.launchd:
    name: "{{ item.item.name }}"
    state: restarted
    enabled: true
  loop: "{{ _mac_launchd_ensure_results.results }}"
  when: item.status.current_state | default('') == 'unknown'
  loop_control:
    label: "{{ item.item.name }}"

- name: Probe HTTP health for {{ item.name }}
  ansible.builtin.uri:
    url: "{{ item.health_url }}"
    status_code: 200
  loop: "{{ _mac_launchd_installed | selectattr('health_url', 'defined') | list }}"
  register: _mac_launchd_health_probes
  failed_when: false
  loop_control:
    label: "{{ item.name }}"

- name: Restart keepalive launchd agent when HTTP health fails
  community.general.launchd:
    name: "{{ item.item.name }}"
    state: restarted
    enabled: true
  loop: "{{ _mac_launchd_health_probes.results }}"
  when:
    - item.item.health_url is defined
    - item.status is not defined or item.status != 200
  loop_control:
    label: "{{ item.item.name }}"

- name: Wait for HTTP health on {{ item.name }}
  ansible.builtin.uri:
    url: "{{ item.health_url }}"
    status_code: 200
  loop: "{{ _mac_launchd_installed | selectattr('health_url', 'defined') | list }}"
  register: _mac_launchd_health_wait
  until: _mac_launchd_health_wait.status == 200
  retries: 120
  delay: 2
  loop_control:
    label: "{{ item.name }}"
