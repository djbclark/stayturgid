---
# Mac-side setup from the same site file: renders the device conf consumed by
# mac/ and shared/ scripts, plus launchd agents for ADB keepalive + outage
# alerting. Prefer mac-site.yml (also run at end of site.yml / deploy_fleet.py):
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/mac-site.yml
- name: stayturgid Mac workstation
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/mac.yml
  tags: [mac, agents, always]
  tasks:
    - name: Ensure config + LaunchAgents directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ conf_dir }}"
        - "{{ conf_dir }}/logs"
        - "{{ conf_dir }}/state"
        - "{{ conf_dir }}/artifacts"
        - "{{ agents_dir }}"

    - name: Render devices.conf from inventory (alias usb_serial tailscale_ip lan_ip)
      ansible.builtin.template:
        src: devices.conf.j2
        dest: "{{ conf_dir }}/devices.conf"
        mode: "0644"

    - name: Resolve Mac SSH identity files from control-node keyring
      ansible.builtin.set_fact:
        stayturgid_ssh_identity_files: >-
          {{
            (
              query('fileglob', stayturgid_ssh_keys_dir ~ '/id_*')
              | reject('search', '\\.pub$')
              | list
              + query('fileglob', stayturgid_ssh_keys_dir ~ '/termux_key')
              | list
            ) | unique | sort
          }}

    - name: Ensure ssh config.d directory exists
      ansible.builtin.file:
        path: "{{ ssh_config_dir }}/config.d"
        state: directory
        mode: "0700"

    - name: Render fleet SSH config fragment (all identities, all hosts)
      ansible.builtin.template:
        src: ssh_config_stayturgid.j2
        dest: "{{ ssh_config_fragment }}"
        mode: "0600"

    - name: Ensure main ssh config includes stayturgid fragment
      ansible.builtin.lineinfile:
        path: "{{ ssh_config_dir }}/config"
        create: true
        mode: "0600"
        line: "Include ~/.ssh/config.d/stayturgid"
        insertbefore: BOF
        regexp: '^Include ~/.ssh/config\.d/stayturgid\s*$'

    - name: Scan fleet SSH host keys from Mac
      ansible.builtin.command:
        cmd: >-
          ssh-keyscan -p {{ hostvars[item].ansible_port | default(8022) }}
          -t ed25519 {{ hostvars[item].ansible_host }}
      loop: "{{ groups['stayturgid'] }}"
      register: _fleet_host_keyscan
      changed_when: false
      failed_when: false

    - name: Trust fleet SSH host keys on Mac (ansible.builtin.known_hosts)
      ansible.builtin.known_hosts:
        path: "{{ ssh_config_dir }}/known_hosts"
        name: "[{{ hostvars[item.item].ansible_host }}]:{{ hostvars[item.item].ansible_port | default(8022) }}"
        key: "{{ item.stdout | trim }}"
        state: present
      loop: "{{ _fleet_host_keyscan.results }}"
      when: item.stdout | trim | length > 0

    - name: Render adb-reconnect launchd agent per device
      ansible.builtin.template:
        src: adb-reconnect.plist.j2
        dest: "{{ agents_dir }}/com.stayturgid.adb-reconnect-{{ item }}.plist"
        mode: "0644"
      loop: "{{ groups['stayturgid'] }}"
      register: reconnect_plists

    - name: Render access-monitor launchd agent
      ansible.builtin.template:
        src: access-monitor.plist.j2
        dest: "{{ agents_dir }}/com.stayturgid.access-monitor.plist"
        mode: "0644"
      register: monitor_plist

    - name: Render fleet-health launchd agent
      ansible.builtin.template:
        src: fleet-health.plist.j2
        dest: "{{ agents_dir }}/com.stayturgid.fleet-health.plist"
        mode: "0644"
      register: health_plist

    - name: Render fire-help launchd agent
      ansible.builtin.template:
        src: fire-help.plist.j2
        dest: "{{ agents_dir }}/com.stayturgid.fire-help.plist"
        mode: "0644"
      register: fire_help_plist

    - name: Render gui-audit launchd agent (Neo/Aurora — parked; optional)
      ansible.builtin.template:
        src: gui-audit.plist.j2
        dest: "{{ agents_dir }}/com.stayturgid.gui-audit.plist"
        mode: "0644"
      when: stayturgid_gui_audit_enabled | bool
      register: gui_audit_plist

    - name: Remove gui-audit launchd agent when parked
      ansible.builtin.file:
        path: "{{ agents_dir }}/com.stayturgid.gui-audit.plist"
        state: absent
      when: not (stayturgid_gui_audit_enabled | bool)
      register: gui_audit_removed

    - name: Unload gui-audit launchd agent when parked
      community.general.launchd:
        name: com.stayturgid.gui-audit
        state: unloaded
      when: gui_audit_removed.changed
      failed_when: false

    - name: Fetch peer-help pubkeys from Fire hosts (for Mac ForceCommand)
      ansible.builtin.command:
        cmd: >-
          ssh -o BatchMode=yes -o ConnectTimeout=8 {{ item }}
          cat /data/data/com.termux/files/home/.ssh/id_ed25519_peerhelp.pub
      loop: "{{ groups['stayturgid'] }}"
      register: _mac_peerhelp_pubs
      changed_when: false
      failed_when: false
      when: hostvars[item].stayturgid_no_local_adb | default(false) | bool

    - name: Install Fire peer-help keys on Mac with ForceCommand
      ansible.posix.authorized_key:
        user: "{{ lookup('env', 'USER') }}"
        path: "{{ lookup('env', 'HOME') }}/.ssh/authorized_keys"
        manage_dir: false
        key: "{{ item.stdout | trim }}"
        key_options: >-
          command="/usr/bin/env python3 {{ stayturgid_repo_root | realpath }}/mac/fire_peer_help.py",no-port-forwarding,no-X11-forwarding,no-agent-forwarding
        state: present
        exclusive: false
      loop: "{{ _mac_peerhelp_pubs.results | default([]) }}"
      when:
        - item.stdout is defined
        - (item.stdout | trim | length) > 0
        - not (item.failed | default(false))

    - name: Record launchd labels needing reload after plist template changes
      ansible.builtin.set_fact:
        _mac_launchd_reload_labels: >-
          {{
            (reconnect_plists.results
             | selectattr('changed')
             | map(attribute='item')
             | map('regex_replace', '^(.*)$', 'com.stayturgid.adb-reconnect-\\1')
             | list)
            + (['com.stayturgid.access-monitor'] if monitor_plist.changed else [])
            + (['com.stayturgid.fleet-health'] if health_plist.changed else [])
            + (['com.stayturgid.fire-help'] if fire_help_plist.changed else [])
            + (['com.stayturgid.gui-audit']
               if (gui_audit_plist is defined and gui_audit_plist.changed) else [])
          }}
