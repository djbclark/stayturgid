---
# Aurora Store / Play — subset of fleet.yml (play tag).
# Prefer: ./mac/deploy_fleet.py or ./mac/deploy_fleet.py --scope play
#
# Prerequisite: Aurora Store installed on device (Obtainium catalog + import,
# or stayturgid_install_aurora_store: true in group_vars).
#
# Usage (from repo root):
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/play_store.yml
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/play_store.yml --limit s24
- name: stayturgid play store (Aurora Store + Shizuku grant)
  hosts: stayturgid
  gather_facts: false
  roles:
    - role: stayturgid.play.play_store
      vars:
        target_device: "{{ inventory_hostname }}"
