---
# @heals: NORMAL-DEPLOY-SINGLE-PASS
# Full stayturgid convergence — artifact bootstrap, fleet state, post-UI, validate.
#
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/site.yml
#   ansible-playbook ansible/playbooks/site.yml --limit oneui-device
#   CHECK=1 ansible-playbook ansible/playbooks/site.yml --check --diff
# Ensure intentionally precedes verify: a factory-reset device has no APKs to
# verify until the normal deploy installs the immutable locks.
- name: Import bootstrap APK ensure
  import_playbook: fleet/ensure-bootstrap-apks.yml
  tags: [bootstrap-apks]

- name: Import bootstrap APK verify
  import_playbook: fleet/verify-bootstrap-apks.yml
  tags: [bootstrap-apks, verify-bootstrap-apks]

- name: Import Shizuku start
  import_playbook: fleet/ensure-shizuku.yml
  tags: [bootstrap-apks]

- name: Import SSH preflight play
  import_playbook: fleet/preflight.yml

- name: Import bootstrap play
  import_playbook: fleet/bootstrap.yml
  tags: [bootstrap]

- name: Import fleet deploy play
  import_playbook: fleet/fleet.yml

# #311: FIRERPA was reachable only via `just firerpa-deploy`, so a plain
# `just deploy` left a returning device (hd8, 21d offline) on its old pinned
# version while still printing a green recap (#184). The playbook is safe to
# run fleet-wide: it is opt-in per host via `firerpa_enabled`, so hosts that
# do not set it no-op. Placed after fleet.yml because the role needs the
# Termux userland and adb reachability that preflight/fleet establish.
- name: Import FIRERPA deploy
  import_playbook: fleet/firerpa.yml
  tags: [firerpa]

- name: Import post-UI automation play
  import_playbook: fleet/post-ui.yml

- name: Import validate play
  import_playbook: fleet/validate.yml

- name: Import control-node workstation setup
  import_playbook: control_node/site.yml
  tags: [mac, always]
