---
# Control-node setup: devices.conf, SSH fragment, launchd agents for ADB keepalive + alerting.
#   ansible-playbook ansible/playbooks/control_node/agents.yml
- name: stayturgid control-node agents
  hosts: localhost
  connection: local
  gather_facts: true
  # Only platform/distribution/env facts are read (os_family, architecture,
  # ansible_env.HOME); the hardware/network/virtual collectors cost several
  # seconds on a loaded Mac for nothing (#166).
  gather_subset: [min]
  tags: [mac, agents, always]
  tasks:
    - name: Skip control-node agent setup on non-macOS
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Configure control-node agents
      ansible.builtin.import_role:
        name: control_node
        tasks_from: agents
