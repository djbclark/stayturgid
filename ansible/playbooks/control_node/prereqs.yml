---
# Control-node prerequisites: Homebrew bootstrap, formulae, pipx, Galaxy collections.
#   ansible-playbook ansible/playbooks/control_node/prereqs.yml
- name: stayturgid control-node prerequisites
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [mac, prereqs, always]
  tasks:
    - name: Skip control-node prerequisites on non-macOS
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Install control-node prerequisites
      ansible.builtin.import_role:
        name: control_node
        tasks_from: prereqs
