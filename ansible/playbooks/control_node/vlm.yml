---
# UI-TARS VLM sidecar: llama.cpp, model weights, launchd plist install.
#   ansible-playbook ansible/playbooks/control_node/vlm.yml -e stayturgid_vlm_enabled=true
- name: stayturgid control-node UI-TARS VLM install
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [mac, vlm]
  tasks:
    - name: Skip VLM install on non-macOS
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Skip VLM install when disabled
      ansible.builtin.meta: end_host
      when: not (stayturgid_vlm_enabled | bool)

    - name: Install control-node VLM sidecar
      ansible.builtin.import_role:
        name: control_node
        tasks_from: vlm
