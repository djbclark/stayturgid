---
# Intentional one-time system configuration. This is separate from ordinary
# deploys so it is the only command path that can request sudo.
- name: Configure system Homebrew PATH
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - ../../roles/control_node/defaults/main.yml
  tasks:
    - name: Ensure system-wide Homebrew PATH for login and SSH sessions
      become: true
      ansible.builtin.copy:
        dest: /etc/paths.d/homebrew
        content: |
          {{ stayturgid_homebrew_prefix }}/bin
          {{ stayturgid_homebrew_prefix }}/sbin
        owner: root
        group: wheel
        mode: "0644"

    - name: Ensure SSH daemon exposes Homebrew PATH to noninteractive sessions
      become: true
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/50-stayturgid-homebrew-path.conf
        content: |
          # stayturgid: expose Homebrew tools to noninteractive SSH sessions.
          SetEnv PATH={{ stayturgid_homebrew_prefix }}/bin:{{ stayturgid_homebrew_prefix }}/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        owner: root
        group: wheel
        mode: "0644"
