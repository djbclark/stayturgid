---
# Post-deploy validation over SSH (complements make verify / device_tier TAP).
- name: stayturgid fleet validate
  hosts: stayturgid
  gather_facts: false
  tags: [validate]
  vars:
    stayturgid_repo_root: "{{ ansible_config_file | dirname | dirname }}"
  roles:
    - role: stayturgid.fleet.validate
