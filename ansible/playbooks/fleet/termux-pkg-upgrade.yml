---
# Nightly / on-demand Termux package update + full upgrade (all fleet hosts).
#
# Uses the same stayturgid.termux.termux_pkg path as termux_userland deploy:
#   pkg update → apt-get full-upgrade (or pkg upgrade -y) → re-pin mirror.
#
#   ANSIBLE_CONFIG=ansible/ansible.cfg \
#     ansible-playbook ansible/playbooks/fleet/termux-pkg-upgrade.yml
#   just termux-pkg-upgrade [oneui-device]
#   python3 control/bin/termux_pkg_nightly.py
#
# Scheduled via Mac launchd com.stayturgid.termux-pkg-nightly (see control_node).
#
# Telemetry (#310): when termux_pkg_nightly.py passes
# stayturgid_termux_pkg_result_dir, each host that finished the upgrade writes
# <dir>/<host>.json on the control node (changed, packages set up, whether
# `pkg update` failed, start/finish). The wrapper turns those, plus the
# unreachable/failed hosts it parses from the output, into termux_pkg.jsonl
# rows. Unset (plain `just termux-pkg-upgrade`), nothing is written.
- name: stayturgid Termux package update/upgrade
  hosts: stayturgid
  gather_facts: false
  serial: "{{ stayturgid_termux_pkg_upgrade_serial | default(1) }}"
  # Offline phones must not abort the rest of the serial batches (p7a/hd8
  # timed out 2026-09-26 and skipped t2e). Next night retries whoever is up.
  ignore_unreachable: true
  max_fail_percentage: 100
  tasks:
    - name: Skip when nightly Termux pkg upgrade disabled on host
      ansible.builtin.meta: end_host
      when: not (stayturgid_termux_pkg_upgrade_enabled | default(true) | bool)

    - name: Note when this host's upgrade started
      ansible.builtin.set_fact:
        _st_pkg_started: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Resolve Termux package mirror URL
      ansible.builtin.set_fact:
        _st_termux_mirror: >-
          {{ stayturgid_termux_mirror
             | default('https://packages-cf.termux.dev/apt/termux-main') }}

    - name: Pin Termux main mirror before pkg operations
      ansible.builtin.copy:
        dest: "{{ termux_prefix }}/etc/apt/sources.list"
        content: "deb {{ _st_termux_mirror }} stable main\n"
        mode: "0644"

    - name: Update package indexes and full-upgrade Termux packages
      stayturgid.termux.termux_pkg:
        name: []
        state: present
        update_cache: true
        upgrade: true
        force_confold: true
        _termux_prefix: "{{ termux_prefix }}"
      register: stayturgid_termux_pkg_nightly

    - name: Re-pin Termux main mirror after pkg operations
      ansible.builtin.copy:
        dest: "{{ termux_prefix }}/etc/apt/sources.list"
        content: "deb {{ _st_termux_mirror }} stable main\n"
        mode: "0644"

    # A running sshd hands its host keys to the newly installed sshd-session, which
    # rejects them after an openssh upgrade ("parse_hostkeys: unexpected internal
    # error"), so every login drops before the banner (s24/t2e, 2026-10-08). HUP makes
    # the runit-supervised listener re-exec its new binary.
    - name: Reload sshd after an upgrade
      ansible.builtin.command: "{{ termux_prefix }}/bin/sv hup {{ termux_prefix }}/var/service/sshd"
      when: stayturgid_termux_pkg_nightly is changed
      changed_when: true
      failed_when: false

    - name: Report nightly Termux pkg result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: changed={{ stayturgid_termux_pkg_nightly.changed }}
          {{ stayturgid_termux_pkg_nightly.msg | default('') }}

    # Unreachable hosts reach this task too (ignore_unreachable), so skip them:
    # the wrapper records those from the output, and a result file here would
    # make an offline phone look upgraded.
    - name: Record this host's result on the control node for telemetry
      ansible.builtin.copy:
        dest: "{{ stayturgid_termux_pkg_result_dir }}/{{ inventory_hostname }}.json"
        content: >-
          {{ {'host': inventory_hostname,
              'changed': stayturgid_termux_pkg_nightly.changed | default(false) | bool,
              'msg': stayturgid_termux_pkg_nightly.msg | default(''),
              'upgraded_packages': stayturgid_termux_pkg_nightly.upgraded_packages | default([]),
              'index_update_failed': stayturgid_termux_pkg_nightly.index_update_failed | default(false) | bool,
              'started': _st_pkg_started,
              'finished': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')} | to_json }}
        mode: "0600"
      delegate_to: localhost
      # A local temp file, not device state: write it in check mode too so a
      # dry run exercises the same path.
      check_mode: false
      # Telemetry must not fail the upgrade it reports on: a failed write would
      # print `fatal: [host -> localhost]` and count a cleanly upgraded host as
      # failed. Without its file the wrapper records the host as `skipped`.
      register: _st_pkg_record
      failed_when: false
      when:
        - (stayturgid_termux_pkg_result_dir | default('')) | length > 0
        - stayturgid_termux_pkg_nightly is not unreachable

    - name: Warn when this host's telemetry file could not be written
      ansible.builtin.debug:
        msg: "telemetry write failed: {{ _st_pkg_record.msg | default('unknown') }}"
      # failed_when: false clears `failed`, and a failed copy still returns a
      # checksum (ansible-core 2.21), so test for the `dest` that only a
      # successful copy returns. A skipped record task has none either.
      when:
        - _st_pkg_record is not skipped
        - _st_pkg_record.dest is not defined
