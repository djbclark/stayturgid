---
# After termux_userland: Fire hosts have published stayturgid_peerhelp_ssh_pubkey.
# Install ForceCommand-restricted entries on helpers (s24/p7a) and leave Fire alone.
- name: Install peer-help ForceCommand keys on helpers
  hosts: stayturgid
  gather_facts: false
  tasks:
    - name: Resolve Termux account
      ansible.builtin.command: id -un
      register: _termux_ssh_account
      changed_when: false
      when: not (stayturgid_no_local_adb | default(false) | bool)

    - name: Install ForceCommand peer-help keys from Fire askers
      vars:
        _peerhelp_bin: >-
          {{ termux_home | default('/data/data/com.termux/files/home')
          }}/.stayturgid/bin/stayturgid-peer-help-force.sh
      ansible.posix.authorized_key:
        user: "{{ _termux_ssh_account.stdout }}"
        path: "{{ termux_home | default('/data/data/com.termux/files/home') }}/.ssh/authorized_keys"
        manage_dir: false
        key: "{{ hostvars[item].stayturgid_peerhelp_ssh_pubkey }}"
        key_options: >-
          command="{{ _peerhelp_bin }}",no-port-forwarding,no-X11-forwarding,no-agent-forwarding
        state: present
        exclusive: false
      loop: "{{ groups[stayturgid_ssh_mesh_group | default('stayturgid')] }}"
      when:
        - stayturgid_ssh_peerhelp_force_command | default(true) | bool
        - not (stayturgid_no_local_adb | default(false) | bool)
        - hostvars[item].stayturgid_peerhelp_ssh_pubkey is defined
        - hostvars[item].stayturgid_peerhelp_ssh_pubkey | default('') | length > 0
        - hostvars[item].stayturgid_no_local_adb | default(false) | bool
