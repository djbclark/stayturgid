---
# Full fleet deploy: Termux, Tailscale, optional ensure_apps.
# Play roles are gated by stayturgid_app_stores_enabled (default false).
# Boot-loop restart happens via handler only when boot scripts change.
#
# Usage (from repo root, or via ./control/bin/deploy_fleet.py / site.yml):
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook \
#     ansible/playbooks/fleet/fleet.yml [--limit oneui-device]
#
# Tags: app-stores (play), play, app-privileges, ensure_apps
#
# Per-host failures don't stop other hosts (Ansible default behavior).
- name: stayturgid fleet deploy
  hosts: stayturgid
  gather_facts: false
  roles:
    - role: stayturgid.termux.termux_userland
    - role: stayturgid.fleet.shizuku_config
    - role: stayturgid.android_common.tailscale_vpn
    - role: stayturgid.play.play_store
      tags: [app-stores, play]
      when: stayturgid_app_stores_enabled | default(false) | bool
      vars:
        target_device: "{{ inventory_hostname }}"
    # Both installers (play_store, ensure_apps) before app_privileges hardens
    # what they installed (#288).
    - role: stayturgid.android_common.ensure_apps
      tags: [ensure_apps]
      when: stayturgid_ensure_apps | default([]) | length > 0
    # Also under bootstrap-apks, so `just deploy-apks` grants what the APKs it
    # just installed need: an agent installed before a reinstalled Termux never
    # gets com.termux.permission.RUN_COMMAND otherwise (s24/t2e, 2026-10-17).
    - role: stayturgid.android_common.app_privileges
      tags: [app-privileges, full, bootstrap-apks]
      vars:
        target_device: "{{ inventory_hostname }}"
    # Per-model/host adb quirks (rotation lock, vendor memory cleaner, Doze whitelist...)
    # from stayturgid_device_quirks; a no-op where none are defined.
    - role: stayturgid.android_common.device_quirks
      tags: [device-quirks, full]
  # post_tasks run after the roles' handlers are flushed, so a handler that
  # restarts sshd (ca.yml's `reload sshd`) is probed too. sshd answering is not the
  # same as sshd accepting a login: a stale listener resets every connection before
  # the banner (p7a, 2026-11-21), and only a handshake from here shows it.
  post_tasks:
    - name: Probe sshd banner and key exchange from the control node
      stayturgid.termux.termux_ssh_probe:
        # delegate_to: localhost makes ansible_host/ansible_port mean localhost's, so read this host's.
        host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
        port: "{{ hostvars[inventory_hostname].ansible_port | default(8022) }}"
        retries: 5
      delegate_to: localhost

# F5: helpers get ForceCommand keys after Fire published peerhelp pubs.
- name: Import peer-help ForceCommand install
  import_playbook: peerhelp-force.yml
  tags: [always]
