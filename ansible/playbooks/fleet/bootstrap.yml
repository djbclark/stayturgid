---
# Pre-SSH bootstrap: install control-node pubkeys + start sshd over adb.
# No Ansible SSH connection to the device is required.
#
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/fleet/bootstrap.yml
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/fleet/bootstrap.yml --limit oneui-device
#
# Normally invoked automatically from control/bin/deploy_termux.py or control/bin/bootstrap_ssh.py.
- name: stayturgid Termux SSH bootstrap (adb)
  hosts: stayturgid
  gather_facts: false
  tags: [bootstrap]
  vars:
    stayturgid_ssh_keys_dir: "{{ lookup('env', 'HOME') }}/.ssh"
    # STAYTURGID_ROOT is set by the deploy wrappers; this playbook otherwise lives at
    # <repo>/ansible/playbooks/fleet/ (ANSIBLE_CONFIG may name a site overlay).
    stayturgid_repo_root: "{{ lookup('env', 'STAYTURGID_ROOT') | default(playbook_dir | dirname | dirname | dirname, true) }}"
  tasks:
    # A reinstalled Termux has no ~/.android/adbkey and generates a new one, which
    # adbd greets with a fresh "Allow USB debugging?" dialog. adbd never revoked the
    # old key, so put this phone's own stored key back first (only when it has none;
    # the key lives in the secret vault, see control/lib/termux_adbkey.py). The script
    # reads and writes the key itself: no key passes through Ansible variables or
    # output, so there is nothing to no_log. A missing vault or backup only warns.
    - name: Restore Termux's own adb key from the vault when the phone has none
      ansible.builtin.command:
        argv:
          - python3
          - "{{ stayturgid_repo_root }}/control/bin/termux_adbkey.py"
          - restore
          - "{{ inventory_hostname }}"
          - --device
          - "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
      delegate_to: localhost
      register: _termux_adbkey_restore
      changed_when: "'restore: restored' in _termux_adbkey_restore.stdout"
      failed_when: false
      when: not (_ssh_preflight_ok | default(false) | bool)

    - name: Report an adb key restore that could not run
      ansible.builtin.debug:
        msg: "adb key restore skipped on {{ inventory_hostname }}: {{ (_termux_adbkey_restore.stderr | default('', true)) | trim }}"
      when:
        - _termux_adbkey_restore is not skipped
        - _termux_adbkey_restore.rc | default(0) != 0

    - name: Bootstrap Termux authorized_keys and sshd
      stayturgid.termux.termux_ssh_bootstrap:
        device: "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
        keys_dir: "{{ stayturgid_ssh_keys_dir }}"
        public_key_files: "{{ stayturgid_ssh_public_key_files | default([]) }}"
        host: "{{ inventory_hostname }}"
      delegate_to: localhost
      when: not (_ssh_preflight_ok | default(false) | bool)
