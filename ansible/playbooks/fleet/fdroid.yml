---
# F-Droid / Neo Store — subset of fleet.yml (fdroid tag).
# Prefer: ./control/bin/deploy_fleet.py or ./control/bin/deploy_fleet.py --scope fdroid
#
# Prerequisite: Neo Store installed on device (Obtainium catalog + import).
# Control machine: brew install fdroidcl
#
# Usage (from repo root):
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/fleet/fdroid.yml
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/playbooks/fleet/fdroid.yml --limit oneui-device
- name: stayturgid fdroid repos (Neo Store + fdroidcl)
  hosts: stayturgid
  gather_facts: false
  roles:
    - role: stayturgid.fdroid.fdroid_repos
      vars:
        target_device: "{{ inventory_hostname }}"
