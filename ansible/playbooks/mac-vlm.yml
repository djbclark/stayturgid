---
# UI-TARS VLM sidecar: llama.cpp, model weights, launchd agent, health ensure.
#   ansible-playbook ansible/playbooks/mac-vlm.yml -e stayturgid_vlm_enabled=true
#   --tags vlm-models    brew + ~6GB download only
#   --tags vlm-service   install launchd (models must exist; needs stayturgid_vlm_enabled)
#   --tags vlm-ensure    start/restart when plist exists (runs on every mac-site deploy)
- name: stayturgid Mac UI-TARS VLM install
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/mac.yml
  tags: [mac, vlm]
  tasks:
    - name: Skip VLM install on non-macOS
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Skip VLM install when disabled
      ansible.builtin.meta: end_host
      when: not (stayturgid_vlm_enabled | bool)

    - name: Install llama.cpp via Homebrew
      community.general.homebrew:
        name: "{{ stayturgid_mac_brew_packages_vlm }}"
        state: present
      tags: [vlm, vlm-models]

    - name: Ensure UI-TARS model and server directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ ui_tars_model_dir }}"
        - "{{ ui_tars_working_dir }}"
        - "{{ ui_tars_log_file | dirname }}"
      tags: [vlm, vlm-models]

    - name: Download UI-TARS model weights (~5.9 GB total)
      ansible.builtin.get_url:
        url: "{{ ui_tars_hf_base }}/{{ item }}"
        dest: "{{ ui_tars_model_dir }}/{{ item }}"
        mode: "0644"
        force: false
      loop: "{{ ui_tars_models }}"
      tags: [vlm, vlm-models]

    - name: Migrate legacy UI-TARS paths under ~/.config/stayturgid
      ansible.builtin.command:
        cmd: bash "{{ stayturgid_repo_root | realpath }}/mac/ui-tars/vlm_migrate_paths.sh"
      register: _vlm_migrate
      changed_when: "'moved' in (_vlm_migrate.stdout | default(''))"
      tags: [vlm, vlm-service]

    - name: Ensure UI-TARS server run script is executable
      ansible.builtin.file:
        path: "{{ ui_tars_run_script }}"
        mode: "0755"
      tags: [vlm, vlm-service]

    - name: Stat UI-TARS model weights before service install
      ansible.builtin.stat:
        path: "{{ ui_tars_model_dir }}/{{ item }}"
      loop: "{{ ui_tars_models }}"
      register: _ui_tars_model_stats
      tags: [vlm, vlm-service]

    - name: Require UI-TARS model weights before service install
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: >-
          UI-TARS models missing in {{ ui_tars_model_dir }} —
          run: make vlm-install (ansible --tags vlm-models)
      loop: "{{ _ui_tars_model_stats.results }}"
      loop_control:
        label: "{{ item.stat.path | default('model') }}"
      tags: [vlm, vlm-service]

    - name: Resolve Homebrew prefix for launchd PATH
      ansible.builtin.command: brew --prefix
      register: _brew_prefix
      changed_when: false
      tags: [vlm, vlm-service]

    - name: Resolve llama.cpp Homebrew prefix
      ansible.builtin.command: brew --prefix llama.cpp
      register: _llama_prefix
      changed_when: false
      failed_when: false
      tags: [vlm, vlm-service]

    - name: Remove manual UI-TARS server pid file when present
      ansible.builtin.file:
        path: "{{ ui_tars_pid_file }}"
        state: absent
      tags: [vlm, vlm-service]

    - name: Unload legacy UI-TARS LaunchAgent
      community.general.launchd:
        name: "{{ ui_tars_legacy_service_label }}"
        state: unloaded
      failed_when: false
      tags: [vlm, vlm-service]

    - name: Remove legacy UI-TARS LaunchAgent plist
      ansible.builtin.file:
        path: "{{ ui_tars_legacy_service_plist }}"
        state: absent
      tags: [vlm, vlm-service]

    - name: Render UI-TARS launchd agent
      ansible.builtin.template:
        src: ui-tars.plist.j2
        dest: "{{ ui_tars_service_plist }}"
        mode: "0644"
      vars:
        brew_prefix: "{{ _brew_prefix.stdout | trim }}"
        llama_prefix: "{{ (_llama_prefix.stdout | default(_brew_prefix.stdout)) | trim }}"
      register: _ui_tars_plist
      tags: [vlm, vlm-service]

    - name: Load and start UI-TARS launchd agent
      community.general.launchd:
        name: "{{ ui_tars_service_label }}"
        state: "{{ 'reloaded' if _ui_tars_plist.changed else 'started' }}"
        enabled: true
      tags: [vlm, vlm-service]

    - name: Wait for UI-TARS /health after install
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ui_tars_port }}/health"
        status_code: 200
      register: _ui_tars_health_install
      until: _ui_tars_health_install.status == 200
      retries: 240
      delay: 1
      tags: [vlm, vlm-service]

- name: stayturgid Mac UI-TARS VLM ensure
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/mac.yml
  tags: [mac, vlm-ensure, always]
  tasks:
    - name: Skip VLM ensure on non-macOS
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Stat UI-TARS launchd plist
      ansible.builtin.stat:
        path: "{{ ui_tars_service_plist }}"
      register: _ui_tars_plist_stat

    - name: Skip VLM ensure when service not installed
      ansible.builtin.meta: end_host
      when: not _ui_tars_plist_stat.stat.exists

    - name: Probe UI-TARS /health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ui_tars_port }}/health"
        status_code: 200
      register: _ui_tars_health_probe
      failed_when: false

    - name: Start or restart UI-TARS launchd agent when unhealthy
      community.general.launchd:
        name: "{{ ui_tars_service_label }}"
        state: restarted
        enabled: true
      when: _ui_tars_health_probe.status is not defined or _ui_tars_health_probe.status != 200

    - name: Wait for UI-TARS /health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ui_tars_port }}/health"
        status_code: 200
      register: _ui_tars_health_ensure
      until: _ui_tars_health_ensure.status == 200
      retries: 120
      delay: 2
