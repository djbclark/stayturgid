---
# Mac control-node prerequisites: Homebrew bootstrap, formulae, pipx, Galaxy collections.
#   ansible-playbook ansible/playbooks/mac-prereqs.yml
- name: stayturgid Mac prerequisites
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars/mac.yml
  tags: [mac, prereqs, always]
  tasks:
    - name: Skip Mac prerequisites on non-macOS
      ansible.builtin.meta: end_host
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Check for Homebrew
      ansible.builtin.command: command -v brew
      register: _brew_which
      changed_when: false
      failed_when: false

    - name: Install Homebrew when missing
      ansible.builtin.shell: |
        set -euo pipefail
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      when: _brew_which.rc != 0
      args:
        creates: "{{ stayturgid_homebrew_prefix }}/bin/brew"

    - name: Install base Homebrew formulae for stayturgid
      community.general.homebrew:
        name: "{{ stayturgid_mac_brew_packages_base }}"
        state: present

    - name: Install app-store Homebrew formulae when enabled
      community.general.homebrew:
        name: "{{ stayturgid_mac_brew_packages_app_stores }}"
        state: present
      when: stayturgid_app_stores_enabled | default(false) | bool

    - name: Install pipx Python tools for Mac device debug
      community.general.pipx:
        name: "{{ item }}"
        state: install
      loop: "{{ stayturgid_mac_pipx_packages }}"

    - name: Install Galaxy collections into repo .ansible/collections
      ansible.builtin.command:
        cmd: >-
          ansible-galaxy collection install
          -r {{ stayturgid_repo_root | realpath }}/ansible/requirements.yml
          -p {{ stayturgid_repo_root | realpath }}/.ansible/collections
      register: _galaxy_install
      changed_when: >-
        'Installing' in (_galaxy_install.stdout | default(''))
        or 'upgrade' in (_galaxy_install.stdout | default(''))
