# Unihertz Titan 2 (Titan_2), Android 16 / API 36, arm64, 4K pages.
#
# otelcol stays enabled (the role default). During first onboarding
# (2026-09-20) the official otelcol-contrib binary failed the runtime probe
# with `has unexpected e_type: 2`, and this file disabled it. That was the
# bootstrap's run-as sshd (SELinux runas_app, #306), not the model: once sshd
# ran from the Termux app (untrusted_app) the identical binary ran, and it has
# run here since 2026-09-30.
