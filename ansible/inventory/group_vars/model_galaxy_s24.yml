---
# Galaxy S24 (SM-S921U1), 1080x2340.
# Screen-control automation disabled for now (no UI tapping). Shizuku "Start"
# tap target (default font/DPI), commented out until/unless re-enabled:
# stayturgid_shizuku_start_coords: { x: 227, y: 1977 }
stayturgid_handsets_port: 9013

# otelcol stays enabled (the role default). On 2026-10-03 the role's runtime
# probe failed with `has unexpected e_type: 2` and this file disabled it. That
# was the exec context, not the model (the same mistake as the Titan 2's
# 2026-09-20 disable, 67e5c2b): a child of a Termux `sh` inside the run-as
# SELinux domain (runas_app) gets the message from the 0.162.0 binary, the
# same process under the app's own domain (untrusted_app) runs it. Re-checked
# on this phone 2026-10-17: --version, validate and a run delivering to
# OpenObserve all pass from the app-context sshd. If the probe fails, sshd was
# restarted through run-as: restart it from the Termux app.
