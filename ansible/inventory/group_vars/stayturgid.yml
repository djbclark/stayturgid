---
# Fleet-wide overrides go here. Package and boot-script lists live in ONE
# place — roles/termux_userland/defaults/main.yml — do not duplicate them
# here (group_vars silently wins over role defaults and the copies drift).
#
# Fleet SSH keyring (control-node ~/.ssh by default). Keys are never in git.
# stayturgid_ssh_keys_dir: "{{ lookup('env', 'HOME') }}/.ssh"

# Mac as last peer for Fire Handsets/Shizuku bootstrap (device → Mac SSH).
stayturgid_mac_peer:
  tailscale: "100.113.53.87"
  lan: "192.168.68.69"
  user: "djbclark"
  port: 22
  help_cmd: "python3 /Users/djbclark/stayturgid/mac/fire_peer_help.py"

# Neo Store + Aurora Store are PARKED (2026-07-09): not installed, configured, or
# health-checked by fleet deploy. Apps may remain on devices from earlier deploys.
# Re-enable: set stayturgid_app_stores_enabled: true and see fdroid/README.md +
# play/README.md. Optional Obtainium entries: obtainium/app-stores-optional.json
stayturgid_app_stores_enabled: false
stayturgid_ensure_neo_store: false
stayturgid_ensure_aurora_store: false
stayturgid_install_aurora_store: false
stayturgid_gui_audit_enabled: false

# Optional unified app ensure (stayturgid.android_common.ensure_apps in fleet.yml).
stayturgid_ensure_apps: []
# When app stores are re-enabled, Play downloads need GPLAY_* in play.env — see play/README.md.
# stayturgid_play_download_backend: apkeep
# stayturgid_play_apkeep_source: google-play
