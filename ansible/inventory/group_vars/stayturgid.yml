---
# Fleet-wide overrides go here. Package and boot-script lists live in ONE
# place — roles/termux_userland/defaults/main.yml — do not duplicate them
# here (group_vars silently wins over role defaults and the copies drift).
#
# Fleet SSH keyring (control-node ~/.ssh by default). Keys are never in git.
# stayturgid_ssh_keys_dir: "{{ lookup('env', 'HOME') }}/.ssh"

# Mac as last peer for Fire Handsets/Shizuku bootstrap (device → Mac SSH).
stayturgid_mac_peer:
  tailscale: "100.113.53.87"
  lan: "192.168.68.59"
  user: "djbclark"
  port: 22
  help_cmd: "python3 /Users/djbclark/ops/stayturgid/control/bin/fire_peer_help.py"

# Phone → Mac Eternal Terminal (et). Shared with stayturgid_mac_peer IPs.
# Devices get ~/.ssh/config Host mac … IdentityFile id_ed25519_fleet (passphrase-less).
# Mac authorized_keys STAYTURGID-ET-MAC block: control/bin/ensure_et_mac.py + deploy-mac.
stayturgid_control_et_enabled: true
stayturgid_control_et_port: 2022
stayturgid_control_ssh_user: "djbclark"
stayturgid_control_tailscale_ip: "{{ stayturgid_mac_peer.tailscale }}"
stayturgid_control_lan_ip: "{{ stayturgid_mac_peer.lan }}"
stayturgid_control_ssh_aliases:
  - mac
  - macbook
  - mac.greyhound-sidemirror.ts.net

# Neo Store + Aurora Store are PARKED (2026-07-09): not installed, configured, or
# health-checked by fleet deploy. Apps may remain on devices from earlier deploys.
# Re-enable: set stayturgid_app_stores_enabled: true and see docs/modules/fdroid.md +
# docs/modules/play.md. Optional Obtainium entries: catalogs/obtainium/app-stores-optional.json
stayturgid_app_stores_enabled: false
stayturgid_ensure_neo_store: false
stayturgid_ensure_aurora_store: false
stayturgid_install_aurora_store: false
stayturgid_gui_audit_enabled: false

# Nightly Termux pkg update/upgrade (Mac launchd → Ansible SSH). See docs/modules/termux.md.
# stayturgid_termux_pkg_nightly_enabled: true   # Mac agent (control_node defaults)
# stayturgid_termux_pkg_upgrade_enabled: true   # set false per-host to skip
# stayturgid_termux_pkg_upgrade_serial: 1

# Optional unified app ensure (stayturgid.android_common.ensure_apps in fleet.yml).
stayturgid_ensure_apps: []
# When app stores are re-enabled, Play downloads need GPLAY_* in play.env — see docs/modules/play.md.
# stayturgid_play_download_backend: apkeep
# stayturgid_play_apkeep_source: google-play
