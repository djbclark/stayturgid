---
# Amazon Fire OS. Termux must be the GitHub debug build (shared-uid addons
# matched) so `run-as com.termux` works for adb-side recovery. Sideload may
# need `package_verifier_enable=0` during APK installs.
# Fire OS blocks Termux from /sdcard even with MANAGE_EXTERNAL_STORAGE — keep
# shared state under the private home tree instead.
stayturgid_sd_root: "{{ termux_home }}/.stayturgid/shared"
# No Termux→localhost:5555 loopback — Mac USB/wireless adb is authoritative.
stayturgid_privileged_shell_expected: false
stayturgid_no_local_adb: true
# AutoJs6 still reads scripts from /sdcard (deployed via adb push from Mac).
autojs6_target: /sdcard/stayturgid/autojs6
stayturgid_autojs6_deploy_via_adb: true
