---
galaxy_info:
  author: stayturgid
  description: >-
    Manage F-Droid repos via fdroidcl and push them to an on-device Neo Store
    client (Shizuku grant). Neo Store install comes from the obtainium_apps role.
  license: GPL-3.0
  min_ansible_version: "2.9"
  platforms:
    - name: GenericLinux
      versions:
        - all
# obtainium_apps installs Neo Store; call it before this role in the play
# rather than as a hard dependency (avoids a double run in fleet.yml).
dependencies: []
