---
# Pin the mirror BEFORE any pkg operation so update/upgrade is deterministic.
- name: Pin Termux main mirror (deterministic pkg update)
  ansible.builtin.copy:
    dest: "{{ termux_prefix }}/etc/apt/sources.list"
    content: "deb {{ stayturgid_termux_mirror }} stable main\n"
    mode: "0644"

- name: Update and upgrade all Termux packages
  stayturgid.fleet.termux_pkg:
    name: []
    state: present
    update_cache: true
    upgrade: true
    force_confold: true
    _termux_prefix: "{{ termux_prefix }}"
  register: pkg_upgrade

- name: Ensure Termux packages are installed
  stayturgid.fleet.termux_pkg:
    name: "{{ stayturgid_termux_packages }}"
    state: present
    update_cache: true
    upgrade: false
    force_confold: true
    _termux_prefix: "{{ termux_prefix }}"
  register: pkg_install

- name: Deploy home scripts
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/termux/{{ item }}"
    dest: "{{ termux_home }}/{{ item }}"
    mode: "0755"
  loop: "{{ stayturgid_home_scripts }}"

- name: Ensure battery color assets directory
  ansible.builtin.file:
    path: "{{ termux_home }}/.stayturgid/battery-colors"
    state: directory
    mode: "0755"

- name: Deploy battery color assets
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/termux/assets/battery-colors/{{ item }}"
    dest: "{{ termux_home }}/.stayturgid/battery-colors/{{ item }}"
    mode: "0644"
  loop: "{{ stayturgid_battery_color_assets }}"

- name: Ensure Termux boot directory exists
  ansible.builtin.file:
    path: "{{ termux_home }}/.termux/boot"
    state: directory
    mode: "0755"

- name: Deploy boot scripts
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/termux/boot/{{ item }}"
    dest: "{{ termux_home }}/.termux/boot/{{ item }}"
    mode: "0755"
  loop: "{{ stayturgid_boot_scripts }}"
  notify: restart boot loop

# OpenSSH 9.8+ PerSourcePenalties blocks source IPs after unauthenticated/
# failed connections — monitoring probes + automation bursts got the Mac
# locked out (kex reset) on 2026-07-06. These sshds are key-only and reachable
# solely via Tailscale/LAN, so the penalty system protects nothing here.
# validate guards against older sshd rejecting the (then-unknown) option.
- name: Disable sshd per-source penalties (operator lockout prevention)
  ansible.builtin.lineinfile:
    path: "{{ termux_prefix }}/etc/ssh/sshd_config"
    regexp: '^#?\s*PerSourcePenalties\b'
    line: "PerSourcePenalties no"
    validate: "{{ termux_prefix }}/bin/sshd -t -f %s"
  notify: restart sshd detached

# lineinfile, not a template: templating would clobber unrelated user
# properties (extra-keys etc.) in termux.properties.
- name: Configure allow-external-apps for RUN_COMMAND bridge
  ansible.builtin.lineinfile:
    path: "{{ termux_home }}/.termux/termux.properties"
    create: true
    regexp: '^#?\s*allow-external-apps\s*='
    line: "allow-external-apps={{ 'true' if stayturgid_allow_external_apps else 'false' }}"
    mode: "0644"
  notify: reload termux settings

- name: Write automation mode file when configured
  ansible.builtin.copy:
    dest: /sdcard/stayturgid_automation_mode.txt
    content: "{{ stayturgid_automation_mode }}\n"
    mode: "0644"
  when: stayturgid_automation_mode is defined and stayturgid_automation_mode | length > 0

- name: Verify stayturgid-repair.sh runs
  ansible.builtin.shell: "{{ termux_home }}/stayturgid-repair.sh"
  args:
    executable: /data/data/com.termux/files/usr/bin/bash
  register: repair_check
  changed_when: false
  failed_when: repair_check.rc != 0 and repair_check.rc != 1

# The verify task is skipped in --check mode (shell tasks don't dry-run),
# leaving stdout_lines empty — guard so check mode stays clean.
- name: Show repair STATUS line
  ansible.builtin.debug:
    msg: "{{ repair_check.stdout_lines | last }}"
  when: repair_check.stdout_lines is defined and repair_check.stdout_lines | length > 0
