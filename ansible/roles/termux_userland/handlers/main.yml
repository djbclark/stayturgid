---
# termux.properties changes (allow-external-apps) only take effect after a
# settings reload or app restart.
- name: reload termux settings
  ansible.builtin.command: "{{ termux_prefix }}/bin/termux-reload-settings"
  changed_when: true

# Detached: an inline sshd restart would kill the very SSH session Ansible is
# using. The delay lets the play finish and disconnect first.
- name: restart sshd detached
  ansible.builtin.shell: |
    nohup bash -c 'sleep 5; pkill -x sshd; sleep 1; sshd' >/dev/null 2>&1 &
  args:
    executable: "{{ termux_prefix }}/bin/bash"

# Restart the Termux self-heal loop by PIDFILE, never `pkill -f start-adb.sh`:
# Ansible runs this handler via `bash -c '<script>'`, so the script text (which
# names the path) is in the handler's OWN cmdline — `pkill -f` matched and
# SIGTERM'd the handler itself (rc=-15), and even the [.] regex matched the
# literal path. setsid (not `nohup &`) so the loop survives the SSH close.
- name: restart boot loop
  ansible.builtin.shell: |
    pidf="$HOME/.stayturgid/run/bootloop.pid"
    old="$(cat "$pidf" 2>/dev/null || true)"
    [ -n "$old" ] && kill "$old" 2>/dev/null || true
    sleep 2
    setsid "$HOME/.termux/boot/start-adb.sh" >/dev/null 2>&1 < /dev/null &
    sleep 3
    new="$(cat "$pidf" 2>/dev/null || true)"
    [ -n "$new" ] && [ -d "/proc/$new" ]
  args:
    executable: "{{ termux_prefix }}/bin/bash"
