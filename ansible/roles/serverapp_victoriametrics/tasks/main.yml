---
# Own-mode victoriametrics lifecycle: brew (never upgrade) → dirs → scrape
# config → plist → bootstrap → health. New installs skip legacy cutover.
# Does not delete any legacy product label (retirement is D7).

- name: Check whether victoriametrics formula is installed
  ansible.builtin.command:
    cmd: brew list --formula victoriametrics
  register: _vm_brew_list
  changed_when: false
  failed_when: false

- name: Install victoriametrics via Homebrew when absent (never upgrade)
  community.general.homebrew:
    name: victoriametrics
    state: present
  when: _vm_brew_list.rc != 0

- name: Pin victoriametrics formula in Homebrew to prevent drift
  ansible.builtin.command:
    cmd: brew pin victoriametrics
  register: _vm_pin
  changed_when: "'already pinned' not in (_vm_pin.stderr | default(''))"
  # Degrade gracefully if the formula is somehow absent (e.g. a failed install)
  # instead of aborting the play; only a genuine unexpected error fails.
  failed_when:
    - _vm_pin.rc != 0
    - "'already pinned' not in (_vm_pin.stderr | default(''))"
    - "'not installed' not in (_vm_pin.stderr | default(''))"
    - "'No available formula' not in (_vm_pin.stderr | default(''))"

- name: Resolve victoria-metrics binary after install
  ansible.builtin.command:
    cmd: brew --prefix victoriametrics
  register: _vm_prefix
  changed_when: false
  failed_when: false

- name: Set victoria-metrics binary from brew prefix when available
  ansible.builtin.set_fact:
    serverapp_victoriametrics_bin: "{{ _vm_prefix.stdout.strip() }}/bin/victoria-metrics"
  when:
    - _vm_prefix.rc == 0
    - _vm_prefix.stdout is defined
    - (_vm_prefix.stdout | trim | length) > 0

- name: Ensure victoriametrics config, data, and log directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ serverapp_victoriametrics_config_dir }}"
    - "{{ serverapp_victoriametrics_data_dir }}"
    - "{{ serverapp_victoriametrics_logs_dir }}"
    - "{{ serverapp_victoriametrics_home }}/Library/LaunchAgents"

- name: Load site group_vars for blackbox_exporter targets when present
  ansible.builtin.include_vars:
    file: "{{ site_dir }}/inventory/group_vars/all.yml"
    name: _site_all_vars
  failed_when: false

- name: Apply blackbox_exporter targets from site inventory when defined
  ansible.builtin.set_fact:
    serverapp_victoriametrics_blackbox_targets: >-
      {{
        _site_all_vars.serverapp_victoriametrics_blackbox_targets
        if (_site_all_vars is defined and _site_all_vars.serverapp_victoriametrics_blackbox_targets is defined)
        else serverapp_victoriametrics_blackbox_targets
      }}
  when: _site_all_vars is defined

- name: Render own-mode scrape.yml
  ansible.builtin.template:
    src: scrape.yml.j2
    dest: "{{ serverapp_victoriametrics_scrape_path }}"
    mode: "0644"
  register: _vm_scrape

- name: Render victoriametrics launchd plist under site namespace
  ansible.builtin.template:
    src: victoriametrics.plist.j2
    dest: "{{ serverapp_victoriametrics_plist_path }}"
    mode: "0644"
  register: _vm_plist

- name: Activate victoriametrics launchd service (shared lifecycle)
  ansible.builtin.include_role:
    name: serverapp_launchd
  vars:
    sl_app: victoriametrics
    sl_uid: "{{ serverapp_victoriametrics_uid }}"
    sl_label: "{{ serverapp_victoriametrics_label }}"
    sl_plist_path: "{{ serverapp_victoriametrics_plist_path }}"
    sl_bin: "{{ serverapp_victoriametrics_bin }}"
    sl_home: "{{ serverapp_victoriametrics_home }}"
    sl_health_url: "{{ serverapp_victoriametrics_health_url }}"
    sl_plist_changed: "{{ _vm_plist.changed | default(false) }}"
    sl_config_changed: "{{ _vm_scrape.changed | default(false) }}"
    sl_health_retries: 30
    sl_health_delay: 1
