---
# Deploys the AutoJs6 watchdog project over SSH (Termux writes /sdcard
# directly — no Mac-side adb needed). Replaces autojs6/mac/deploy.sh +
# start-watchdog.sh in the fleet path; those scripts remain for USB/adb-only
# situations.
# Device profile is DATA generated from the inventory taxonomy — the code
# contains no device-specific names or coordinates.
- name: Render device profile from inventory layers
  ansible.builtin.template:
    src: device.json.j2
    dest: /sdcard/stayturgid_device.json
  notify: nudge autojs6 watchdog

- name: Deploy AutoJs6 project files
  ansible.builtin.copy:
    src: "{{ autojs6_repo_root }}/autojs6/{{ item }}"
    dest: "{{ autojs6_target }}/"
  loop:
    - project.json
    - main.js
    - lib
    - scripts
  notify: nudge autojs6 watchdog

# Launch via the localhost:5555 privileged shell (uid 2000): Samsung One UI
# rejects `am start` from the Termux app uid with a SecurityException
# (com.android.shell does not belong to uid=NNNN). Same channel the repair
# scripts use; works on both Pixel and Samsung.
- name: Ensure AutoJs6 watchdog is running (boot-launcher no-ops when alive)
  ansible.builtin.shell: >
    export PATH={{ termux_prefix }}/bin:$PATH TMPDIR={{ termux_prefix }}/tmp;
    adb connect localhost:5555 >/dev/null 2>&1;
    adb -s localhost:5555 shell am start -a android.intent.action.VIEW
    -d 'file://{{ autojs6_target }}/scripts/boot-launcher.js'
    -t 'text/javascript'
    -n 'org.autojs.autojs6/org.autojs.autojs.external.open.RunIntentActivity'
  args:
    executable: "{{ termux_prefix }}/bin/bash"
  changed_when: false
