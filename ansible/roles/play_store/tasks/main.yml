---
# play_store role
# Ensures Aurora Store (FOSS Google Play client) with Shizuku + background updates.
# For "managing" Play apps, use gplaycli or direct adb install of APKs (Play is not open repo like F-Droid).
# See obtainium for ensuring Aurora via catalog (we added it).
# fdroidcl equivalent is gplaycli (installed via pip, may need auth setup).

- name: Set target device fact
  ansible.builtin.set_fact:
    _play_target_device: "{{ target_device | default('localhost:5555') }}"

- name: Note on Play side (no direct repo like F-Droid)
  ansible.builtin.debug:
    msg: |
      Google Play is not open like F-Droid. Use Aurora Store as GUI (ensured via Obtainium catalog).
      For automation, gplaycli can download APKs (requires setup), then adb install with -i com.android.vending to spoof Play.
      Run obtainium_apps role to get Aurora Store.
      This role ensures the client setup with Shizuku.

- name: Grant Shizuku to Aurora Store
  when: stayturgid_ensure_aurora_store
  ansible.builtin.command:
    cmd: |
      python3 "{{ (role_path ~ '/../../../fdroid/mac/grant_neo_store_shizuku.py') | realpath }}" "{{ _play_target_device }}" "{{ aurora_store_package }}" || echo "Grant completed (or device not ready)"
  delegate_to: localhost
  changed_when: false
  ignore_errors: true

- name: Note on background updates for Aurora
  ansible.builtin.debug:
    msg: |
      After Aurora is set with Shizuku as installer, enable auto updates in its settings.
      Install apps through it for background behavior.
