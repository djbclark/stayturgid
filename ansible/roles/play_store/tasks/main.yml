---
# play_store role
# Ensures Aurora Store (FOSS Google Play client) with Shizuku + background updates.
# For "managing" Play apps, use gplaycli or direct adb install of APKs (Play is not open repo like F-Droid).
# See obtainium for ensuring Aurora via catalog (we added it).
# fdroidcl equivalent is gplaycli (installed via pip, may need auth setup).

- name: Resolve fleet alias to adb target (USB serial preferred)
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, sys
        repo = os.path.abspath("{{ role_path }}/../../..")
        sys.path.insert(0, os.path.join(repo, "shared", "mac"))
        import stayturgid_device as dev
        print(dev.resolve_adb(sys.argv[1]))
      - "{{ target_device | default('localhost:5555') }}"
  delegate_to: localhost
  register: _play_adb_resolved
  changed_when: false

- name: Set target device fact
  ansible.builtin.set_fact:
    _play_target_device: "{{ _play_adb_resolved.stdout | trim }}"

- name: Detect Aurora Store on device
  ansible.builtin.shell: |
    set -euo pipefail
    adb connect "{{ _play_target_device }}" >/dev/null 2>&1 || true
    adb -s "{{ _play_target_device }}" shell pm list packages --user 0 \
      | grep -E '^(package:)?{{ aurora_store_package | regex_escape() }}' \
      || true
  args:
    executable: /bin/bash
  delegate_to: localhost
  register: aurora_pkg
  changed_when: false

- name: Warn when Aurora Store is missing but required
  ansible.builtin.debug:
    msg: >-
      Aurora Store ({{ aurora_store_package }}) not installed on {{ _play_target_device }}.
      Run obtainium_apps / sync-to-device.sh and import the catalog before deploy-play.
  when:
    - stayturgid_ensure_aurora_store | bool
    - aurora_store_package not in aurora_pkg.stdout

- name: Note on Play side (no direct repo like F-Droid)
  ansible.builtin.debug:
    msg: |
      Google Play is not open like F-Droid. Use Aurora Store as GUI
      (ensured via the Obtainium catalog; run obtainium_apps first).
      For automation, gplaycli can download APKs (needs auth setup), then
      adb install with -i com.android.vending to spoof Play.
      This role grants Shizuku to the Aurora Store client.

- name: Grant Shizuku to Aurora Store
  when:
    - stayturgid_ensure_aurora_store | bool
    - aurora_store_package in aurora_pkg.stdout
  ansible.builtin.command:
    argv:
      - python3
      - "{{ (role_path ~ '/../../../fdroid/mac/grant_neo_store_shizuku.py') | realpath }}"
      - "{{ _play_target_device }}"
      - "{{ aurora_store_package }}"
  delegate_to: localhost
  register: aurora_grant
  changed_when: "'RESULT: CHANGED' in aurora_grant.stdout"
  failed_when: "'RESULT: FAILED' in aurora_grant.stdout or aurora_grant.rc != 0"

- name: Note on background updates for Aurora
  ansible.builtin.debug:
    msg: |
      After Aurora is set with Shizuku as installer, enable auto updates in its settings.
      Install apps through it for background behavior.

- name: Ensure Play apps (apkeep/gplaycli + adb install)
  when: stayturgid_play_apps | length > 0
  stayturgid.fleet.play_apps:
    apps: "{{ stayturgid_play_apps }}"
    device: "{{ _play_target_device }}"
    download_backend: "{{ stayturgid_play_download_backend }}"
    apkeep_source: "{{ stayturgid_play_apkeep_source }}"
    spoof_play_installer: "{{ stayturgid_play_spoof_installer | bool }}"
  delegate_to: localhost
