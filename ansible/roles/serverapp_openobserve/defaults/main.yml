---
# serverapp_openobserve — own-mode OpenObserve adapter (Site Contract v1 §5 / Phase D).
# Callers pass site_ns and site_dir as extra-vars. Never hard-code site_ns.
# Data dir stays under ~/.local/share/openobserve (unchanged across migrate).
# The binary tracks the latest release: tasks/main.yml resolves it from the
# openobserve/openobserve GitHub releases at converge time, downloads that
# version's enterprise darwin build from downloads.openobserve.ai (no checksum
# is pinned; the CDN publishes none), and reinstalls + restarts when the
# installed binary reports anything else.

# Keep the live data path so parquet is not re-homed (D3 requirement).
serverapp_openobserve_home: "{{ lookup('env', 'HOME') }}"
serverapp_openobserve_data_dir: "{{ lookup('env', 'HOME') }}/.local/share/openobserve/data"
serverapp_openobserve_bin_path: "{{ lookup('env', 'HOME') }}/.local/bin/openobserve"
serverapp_openobserve_logs_dir: "{{ serverapp_openobserve_home }}/.config/{{ site_ns }}/logs"
serverapp_openobserve_label: "com.{{ site_ns }}.openobserve"
# Records the version that installed AND verified cleanly.
# Our namespace, not OpenObserve's data dir, so nothing it scans is polluted.
serverapp_openobserve_stamp_path: "{{ serverapp_openobserve_home }}/.config/{{ site_ns }}/.openobserve-version"
serverapp_openobserve_plist_path: "{{ serverapp_openobserve_home }}/Library/LaunchAgents/{{ serverapp_openobserve_label }}.plist"
serverapp_openobserve_http_port: "5080"
serverapp_openobserve_http_address: "127.0.0.1"
serverapp_openobserve_grpc_address: "127.0.0.1"
# Derived, not hardcoded. ZO_BASE_URI remaps *every* HTTP route under the prefix
# -- UI, API and healthz alike (Choice E / D7-ROUTES-E) -- so a base_uri that the
# health URL does not track yields a 404 health gate that can never pass. This
# previously hardcoded http://127.0.0.1:5080/healthz, duplicating the address and
# port vars below and silently ignoring base_uri.
#
# In a real run control/site_contract/serverapps.py:1982 exports
# OPENOBSERVE_BASE_URI ("/oo" when a Caddy public host exists) before computing
# its own health_url, and passes that in, so these agree. Invoking
# ansible/playbooks/serverapps/openobserve.yml DIRECTLY bypasses that, so export
# OPENOBSERVE_BASE_URI to match the running service or the health check will 404
# against a service serving under a prefix.
serverapp_openobserve_health_url: >-
  http://{{ serverapp_openobserve_http_address }}:{{ serverapp_openobserve_http_port
  }}{{ serverapp_openobserve_base_uri }}/healthz
# Choice E (D7-ROUTES-E): empty = OO owns / (loopback). serverapps.py sets
# /oo + https://<host>/oo when caddy_public_hostname is present.
serverapp_openobserve_base_uri: "{{ lookup('env', 'OPENOBSERVE_BASE_URI') | default('', true) }}"
serverapp_openobserve_web_url: ""
# No default for serverapp_openobserve_uid — always supplied as an extra-var by
# control/site_contract/serverapps.py (os.getuid()); fail closed otherwise.
# Credentials — never commit; env / secretspec / site inventory email only.
serverapp_openobserve_root_email: "{{ lookup('env', 'OPENOBSERVE_ROOT_EMAIL') | default('', true) }}"
serverapp_openobserve_root_password: "{{ lookup('env', 'OPENOBSERVE_ROOT_PASSWORD') | default('', true) }}"
