---
# Own-mode grafana lifecycle: brew (never upgrade) → dirs → grafana.ini →
# plist → bootstrap → health. Provisioning reads product fragments from
# generated/stayturgid/fragments/grafana/ (site-sync is the single writer).
# New installs skip legacy cutover. Does not delete legacy product labels (D7).

- name: Check whether grafana formula is installed
  ansible.builtin.command:
    cmd: brew list --formula grafana
  register: _gf_brew_list
  changed_when: false
  failed_when: false

- name: Install grafana via Homebrew when absent (never upgrade)
  community.general.homebrew:
    name: grafana
    state: present
  when: _gf_brew_list.rc != 0

- name: Resolve grafana binary after install
  ansible.builtin.command:
    cmd: brew --prefix grafana
  register: _gf_prefix
  changed_when: false
  failed_when: false

- name: Set grafana binary and homepath from brew prefix when available
  ansible.builtin.set_fact:
    serverapp_grafana_bin: "{{ _gf_prefix.stdout.strip() }}/bin/grafana"
    serverapp_grafana_homepath: "{{ _gf_prefix.stdout.strip() }}/share/grafana"
  when:
    - _gf_prefix.rc == 0
    - _gf_prefix.stdout is defined
    - (_gf_prefix.stdout | trim | length) > 0

- name: Ensure grafana config, data, plugins, and log directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ serverapp_grafana_config_dir }}"
    - "{{ serverapp_grafana_data_dir }}"
    - "{{ serverapp_grafana_plugins_dir }}"
    - "{{ serverapp_grafana_logs_dir }}"
    - "{{ serverapp_grafana_home }}/Library/LaunchAgents"

- name: Assert product grafana provisioning fragments exist
  ansible.builtin.stat:
    path: "{{ serverapp_grafana_provisioning_dir }}/datasources"
  register: _gf_prov
  failed_when: not (_gf_prov.stat.exists | default(false))
  # Fail closed: site-sync must render fragments before own-mode activate.

- name: Render own-mode grafana.ini
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ serverapp_grafana_ini_path }}"
    mode: "0600"
  register: _gf_ini

- name: Render grafana launchd plist under site namespace
  ansible.builtin.template:
    src: grafana.plist.j2
    dest: "{{ serverapp_grafana_plist_path }}"
    mode: "0644"
  register: _gf_plist

- name: Probe whether site-namespace grafana label is loaded
  ansible.builtin.shell: |
    set -eu
    if launchctl print "gui/{{ serverapp_grafana_uid }}/{{ serverapp_grafana_label }}" >/dev/null 2>&1; then
      echo loaded
    else
      echo unloaded
    fi
  args:
    executable: /bin/bash
  register: _gf_launch_state
  changed_when: false

- name: Probe legacy product-namespace grafana label
  ansible.builtin.shell: |
    set -eu
    if launchctl print "gui/{{ serverapp_grafana_uid }}/com.stayturgid.grafana" >/dev/null 2>&1; then
      echo loaded
    else
      echo unloaded
    fi
  args:
    executable: /bin/bash
  register: _gf_legacy_state
  changed_when: false

- name: Pre-health-check before legacy cutover (old daemon must be healthy)
  ansible.builtin.uri:
    url: "{{ serverapp_grafana_health_url }}"
    status_code: 200
  when:
    - _gf_legacy_state.stdout | trim == 'loaded'
    - _gf_launch_state.stdout | trim == 'unloaded'
  register: _gf_pre_health

- name: Boot out legacy com.stayturgid.grafana (plist retained on disk)
  ansible.builtin.command:
    cmd: launchctl bootout gui/{{ serverapp_grafana_uid }}/com.stayturgid.grafana
  when:
    - _gf_legacy_state.stdout | trim == 'loaded'
    - _gf_launch_state.stdout | trim == 'unloaded'
  register: _gf_legacy_bootout

# Rollback (if legacy ever existed):
#   launchctl bootout gui/<uid>/com.<site_ns>.grafana \
#     && launchctl enable gui/<uid>/com.stayturgid.grafana \
#     && launchctl bootstrap gui/<uid> ~/Library/LaunchAgents/com.stayturgid.grafana.plist
- name: Check whether legacy grafana plist remains on disk
  ansible.builtin.stat:
    path: "{{ serverapp_grafana_home }}/Library/LaunchAgents/com.stayturgid.grafana.plist"
  register: _gf_legacy_plist

- name: Probe whether legacy grafana label is persistently disabled
  ansible.builtin.shell: |
    set -eu
    if launchctl print-disabled "gui/{{ serverapp_grafana_uid }}" 2>/dev/null \
      | grep -Eq '"com\.stayturgid\.grafana" => (true|disabled)'; then
      echo disabled
    else
      echo enabled
    fi
  args:
    executable: /bin/bash
  register: _gf_legacy_disabled
  changed_when: false
  when: _gf_legacy_plist.stat.exists

- name: Persistently disable legacy grafana label (survives login; plist retained)
  ansible.builtin.command:
    cmd: launchctl disable gui/{{ serverapp_grafana_uid }}/com.stayturgid.grafana
  when:
    - _gf_legacy_plist.stat.exists
    - (_gf_legacy_disabled.stdout | default('disabled') | trim) == 'enabled'
  register: _gf_legacy_disable

- name: Boot out site-namespace grafana when its launchd plist changed
  ansible.builtin.command:
    cmd: launchctl bootout gui/{{ serverapp_grafana_uid }}/{{ serverapp_grafana_label }}
  when:
    - _gf_launch_state.stdout | trim == 'loaded'
    - _gf_plist.changed | default(false)
  register: _gf_plist_reload_bootout

- name: Bootstrap site-namespace grafana when unloaded or its plist changed
  ansible.builtin.command:
    cmd: >-
      launchctl bootstrap gui/{{ serverapp_grafana_uid }}
      {{ serverapp_grafana_plist_path }}
  when: >-
    (_gf_launch_state.stdout | trim == 'unloaded')
    or (_gf_plist_reload_bootout.changed | default(false))
  register: _gf_bootstrap
  until: _gf_bootstrap.rc == 0
  retries: 5
  delay: 1

- name: Kickstart site-namespace grafana after config-only change
  ansible.builtin.command:
    cmd: >-
      launchctl kickstart -k gui/{{ serverapp_grafana_uid }}/{{ serverapp_grafana_label }}
  when:
    - _gf_launch_state.stdout | trim == 'loaded'
    - _gf_ini.changed | default(false)
    - not (_gf_plist.changed | default(false))
  register: _gf_kickstart

- name: Wait for grafana health endpoint
  ansible.builtin.uri:
    url: "{{ serverapp_grafana_health_url }}"
    status_code: 200
  register: _gf_health
  until: _gf_health.status == 200
  retries: 60
  delay: 2

# Telegram contact point for blackbox_exporter alert rules — applied via the
# Alerting HTTP API, not file provisioning (see rules.yaml.j2 header comment
# for why: confirmed live that Grafana hard-fails startup if a
# file-provisioned contact point's settings are empty). Skips entirely if no
# bot token is configured, same "only act if length > 0" convention as
# Hermes's token handling (ansible/roles/control_node/tasks/hermes.yml).
- name: Load site group_vars for grafana Telegram chat id when present
  ansible.builtin.include_vars:
    file: "{{ site_dir }}/inventory/group_vars/all.yml"
    name: _site_all_vars
  failed_when: false

# stayturgid_hermes_telegram_home_channel lives under hosts.yml's `all: vars:`
# block (real inventory `all:vars:`, not group_vars/all.yml — confirmed by
# actually running this task live and observing the loaded dict didn't have
# it), so it needs a separate include_vars against the inventory file itself.
- name: Load site inventory hosts.yml for grafana Telegram chat id when present
  ansible.builtin.include_vars:
    file: "{{ site_dir }}/inventory/hosts.yml"
    name: _site_hosts_vars
  failed_when: false

- name: Apply grafana Telegram chat id from site inventory when defined
  ansible.builtin.set_fact:
    serverapp_grafana_telegram_chat_id: >-
      {{
        serverapp_grafana_telegram_chat_id
        if (serverapp_grafana_telegram_chat_id | default('', true) | length) > 0
        else (_site_all_vars.stayturgid_hermes_telegram_home_channel
              | default(_site_hosts_vars.all.vars.stayturgid_hermes_telegram_home_channel, true)
              | default('', true))
      }}
  when: _site_all_vars is defined or _site_hosts_vars is defined

- name: Resolve Telegram bot token from environment (optional, never from git)
  ansible.builtin.set_fact:
    _gf_telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
  no_log: true

# Uses the App Platform alerting API (notifications.alerting.grafana.app/v1beta1),
# not the /api/v1/provisioning/* endpoints — those are deprecated on this
# Grafana version (confirmed live: X-Api-Deprecation-Date 2026-04-07, already
# past). The new API is Kubernetes-style: resources have a server-assigned
# metadata.name (base64 of spec.title — confirmed empirically, not derived
# client-side since the exact encoding isn't documented) and updates require
# the current metadata.resourceVersion (optimistic concurrency; a PUT without
# it 409s — confirmed live).
- name: Set App Platform alerting API base URL
  ansible.builtin.set_fact:
    _gf_alerting_api: "http://127.0.0.1:{{ serverapp_grafana_http_port }}/apis/notifications.alerting.grafana.app/v1beta1/namespaces/default"

- name: List existing grafana receivers (App Platform alerting API)
  ansible.builtin.uri:
    url: "{{ _gf_alerting_api }}/receivers"
    url_username: "{{ serverapp_grafana_admin_user }}"
    url_password: "{{ serverapp_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: _gf_receivers
  when:
    - (_gf_telegram_bot_token | default('', true) | length) > 0
    - (serverapp_grafana_telegram_chat_id | default('', true) | length) > 0

- name: Find existing stayturgid-telegram receiver by title
  ansible.builtin.set_fact:
    # _gf_receivers.json.items resolves to the dict's .items() *method*
    # (Ansible/Jinja dot-access pitfall), not the JSON "items" key — bracket
    # notation forces the key lookup (confirmed live: dot form threw
    # "'method' object is not iterable").
    _gf_existing_receiver: >-
      {{
        (_gf_receivers.json['items'] | default([]))
        | selectattr('spec.title', 'equalto', 'stayturgid-telegram')
        | list
        | first
        | default(none)
      }}
  when: _gf_receivers.json is defined

- name: Create stayturgid-telegram receiver when absent
  ansible.builtin.uri:
    url: "{{ _gf_alerting_api }}/receivers"
    method: POST
    url_username: "{{ serverapp_grafana_admin_user }}"
    url_password: "{{ serverapp_grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      kind: Receiver
      apiVersion: notifications.alerting.grafana.app/v1beta1
      metadata:
        namespace: default
      spec:
        title: stayturgid-telegram
        integrations:
          - uid: stayturgid-telegram-receiver
            type: telegram
            disableResolveMessage: false
            settings:
              bottoken: "{{ _gf_telegram_bot_token }}"
              chatid: "{{ serverapp_grafana_telegram_chat_id }}"
    status_code: [201]
  when:
    - (_gf_telegram_bot_token | default('', true) | length) > 0
    - (serverapp_grafana_telegram_chat_id | default('', true) | length) > 0
    - _gf_existing_receiver is defined
    - _gf_existing_receiver is none
  no_log: true

- name: Update stayturgid-telegram receiver when present (token may have rotated)
  ansible.builtin.uri:
    url: "{{ _gf_alerting_api }}/receivers/{{ _gf_existing_receiver.metadata.name }}"
    method: PUT
    url_username: "{{ serverapp_grafana_admin_user }}"
    url_password: "{{ serverapp_grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      kind: Receiver
      apiVersion: notifications.alerting.grafana.app/v1beta1
      metadata:
        name: "{{ _gf_existing_receiver.metadata.name }}"
        namespace: default
        resourceVersion: "{{ _gf_existing_receiver.metadata.resourceVersion }}"
      spec:
        title: stayturgid-telegram
        integrations:
          - uid: stayturgid-telegram-receiver
            type: telegram
            disableResolveMessage: false
            settings:
              bottoken: "{{ _gf_telegram_bot_token }}"
              chatid: "{{ serverapp_grafana_telegram_chat_id }}"
    status_code: [200]
  when:
    - (_gf_telegram_bot_token | default('', true) | length) > 0
    - (serverapp_grafana_telegram_chat_id | default('', true) | length) > 0
    - _gf_existing_receiver is defined
    - _gf_existing_receiver is not none
  no_log: true

# RoutingTree is a singleton resource (fixed name "user-defined"), unlike
# Receiver — always GET-then-PUT with the current resourceVersion.
- name: Get current routing tree
  ansible.builtin.uri:
    url: "{{ _gf_alerting_api }}/routingtrees/user-defined"
    url_username: "{{ serverapp_grafana_admin_user }}"
    url_password: "{{ serverapp_grafana_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: _gf_routing_tree
  when:
    - (_gf_telegram_bot_token | default('', true) | length) > 0
    - (serverapp_grafana_telegram_chat_id | default('', true) | length) > 0

- name: Route default notification policy to stayturgid-telegram
  ansible.builtin.uri:
    url: "{{ _gf_alerting_api }}/routingtrees/user-defined"
    method: PUT
    url_username: "{{ serverapp_grafana_admin_user }}"
    url_password: "{{ serverapp_grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      kind: RoutingTree
      apiVersion: notifications.alerting.grafana.app/v1beta1
      metadata:
        name: user-defined
        namespace: default
        resourceVersion: "{{ _gf_routing_tree.json.metadata.resourceVersion }}"
      spec:
        defaults:
          receiver: stayturgid-telegram
          group_by: ["grafana_folder", "alertname"]
        routes: "{{ _gf_routing_tree.json.spec.routes | default([]) }}"
    status_code: [200]
  when:
    - (_gf_telegram_bot_token | default('', true) | length) > 0
    - (serverapp_grafana_telegram_chat_id | default('', true) | length) > 0
