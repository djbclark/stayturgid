---
- name: Stat UI-TARS launchd plist
  ansible.builtin.stat:
    path: "{{ ui_tars_service_plist }}"
  register: _ui_tars_plist_stat

- name: Stat Hermes gateway launchd plist
  ansible.builtin.stat:
    path: "{{ agents_dir }}/{{ stayturgid_hermes_gateway_label }}.plist"
  register: _hermes_gateway_plist_stat

- name: Stat OpenCode web launchd plist
  ansible.builtin.stat:
    path: "{{ agents_dir }}/{{ stayturgid_opencode_web_label }}.plist"
  register: _opencode_web_plist_stat

- name: Stat FIRERPA health launchd plist
  ansible.builtin.stat:
    path: "{{ agents_dir }}/com.stayturgid.firerpa-health.plist"
  register: _firerpa_health_plist_stat

- name: Stat fleet dashboard launchd plist
  ansible.builtin.stat:
    path: "{{ agents_dir }}/{{ stayturgid_dashboard_label }}.plist"
  register: _dashboard_plist_stat

- name: Stat OpenObserve launchd plist
  ansible.builtin.stat:
    path: "{{ agents_dir }}/{{ openobserve_label }}.plist"
  register: _openobserve_plist_stat

- name: Stat Vector launchd plist
  ansible.builtin.stat:
    path: "{{ agents_dir }}/{{ vector_label }}.plist"
  register: _vector_plist_stat

- name: Build launchd ensure service list
  ansible.builtin.set_fact:
    _mac_launchd_ensure_services: >-
      {{
        _core_launchd_agents
        + _adb_launchd_agents
        + _gui_launchd_agents
        + _termux_pkg_nightly_agents
        + _vlm_upstream_check_agents
        + _ui_tars_launchd_agents
        + _hermes_gateway_agents
        + _opencode_web_agents
        + _dashboard_agents
        + _firerpa_health_agents
        + _observability_agents
      }}
  vars:
    _core_launchd_agents:
      - name: com.stayturgid.access-monitor
        plist: "{{ agents_dir }}/com.stayturgid.access-monitor.plist"
      - name: com.stayturgid.fleet-health
        plist: "{{ agents_dir }}/com.stayturgid.fleet-health.plist"
      - name: com.stayturgid.fire-help
        plist: "{{ agents_dir }}/com.stayturgid.fire-help.plist"
    _hermes_gateway_agents: >-
      {{
        [{
          'name': stayturgid_hermes_gateway_label,
          'plist': agents_dir ~ '/' ~ stayturgid_hermes_gateway_label ~ '.plist'
        }] if (
          (stayturgid_hermes_enabled | default(true) | bool)
          and (stayturgid_hermes_gateway_enabled | default(true) | bool)
          and (_hermes_gateway_plist_stat.stat.exists | default(false))
        ) else []
      }}
    _opencode_web_agents: >-
      {{
        [{
          'name': stayturgid_opencode_web_label,
          'plist': agents_dir ~ '/' ~ stayturgid_opencode_web_label ~ '.plist',
          'health_url': 'http://127.0.0.1:' ~ (stayturgid_opencode_web_port | string) ~ '/'
        }] if (
          (stayturgid_opencode_web_enabled | default(true) | bool)
          and (_opencode_web_plist_stat.stat.exists | default(false))
        ) else []
      }}
    _dashboard_agents: >-
      {{
        [{
          'name': stayturgid_dashboard_label,
          'plist': agents_dir ~ '/' ~ stayturgid_dashboard_label ~ '.plist',
          'health_url': 'http://127.0.0.1:' ~ (stayturgid_dashboard_port | string) ~ '/health'
        }] if (
          (stayturgid_dashboard_enabled | default(true) | bool)
          and (_dashboard_plist_stat.stat.exists | default(false))
        ) else []
      }}
    _firerpa_health_agents: >-
      {{
        [{
          'name': 'com.stayturgid.firerpa-health',
          'plist': agents_dir ~ '/com.stayturgid.firerpa-health.plist'
        }] if (
          (stayturgid_firerpa_health_enabled | default(true) | bool)
        ) else []
      }}
    _termux_pkg_nightly_agents: >-
      {{
        [{
          'name': 'com.stayturgid.termux-pkg-nightly',
          'plist': agents_dir ~ '/com.stayturgid.termux-pkg-nightly.plist'
        }] if (stayturgid_termux_pkg_nightly_enabled | default(true) | bool) else []
      }}
    _vlm_upstream_check_agents: >-
      {{
        [{
          'name': 'com.stayturgid.vlm-upstream-check',
          'plist': agents_dir ~ '/com.stayturgid.vlm-upstream-check.plist'
        }] if (stayturgid_vlm_upstream_check_enabled | default(true) | bool) else []
      }}
    _observability_agents: >-
      {{
        ([
          {
            'name': openobserve_label,
            'plist': agents_dir ~ '/' ~ openobserve_label ~ '.plist',
            'health_url': 'http://127.0.0.1:' ~ (openobserve_port | string) ~ '/healthz'
          },
          {
            'name': vector_label,
            'plist': agents_dir ~ '/' ~ vector_label ~ '.plist'
          }
        ]) if (
          (stayturgid_observability_enabled | default(true) | bool)
          and (_openobserve_plist_stat.stat.exists | default(false))
          and (_vector_plist_stat.stat.exists | default(false))
        ) else []
      }}
    _adb_launchd_agents: >-
      {{
        groups['stayturgid']
        | map('regex_replace', '^(.*)$', '{"name": "com.stayturgid.adb-reconnect-\\1", "plist": "' ~ agents_dir ~ '/com.stayturgid.adb-reconnect-\\1.plist"}')
        | map('from_json')
        | list
      }}
    _gui_launchd_agents: >-
      {{
        [{
          'name': 'com.stayturgid.gui-audit',
          'plist': agents_dir ~ '/com.stayturgid.gui-audit.plist'
        }] if (stayturgid_gui_audit_enabled | bool) else []
      }}

    _ui_tars_launchd_agents: >-
      {{
        [{
          'name': ui_tars_service_label,
          'plist': ui_tars_service_plist,
          'health_url': 'http://127.0.0.1:' ~ (ui_tars_port | string) ~ '/health'
        }] if _ui_tars_plist_stat.stat.exists else []
      }}

- name: Ensure Mac launchd agents are loaded and healthy
  ansible.builtin.include_tasks: launchd_ensure.yml
  vars:
    mac_launchd_ensure_services: "{{ _mac_launchd_ensure_services }}"
    mac_launchd_reload_labels: "{{ _mac_launchd_reload_labels | default([]) }}"
