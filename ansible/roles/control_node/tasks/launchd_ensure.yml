---
# Ensure launchd jobs in mac_launchd_ensure_services are loaded; heal unknown state
# and optional HTTP health_url failures for keepalive long-runners.
#
# Interval agents (StartInterval) are often "stopped" between runs — that is normal.
# We only load when unloaded, reload when plist templates changed this run, and
# restart on abnormal exit or failed HTTP health (keepalive services).
#
# A KeepAlive agent that runs Python out of the product checkout also needs a
# restart when only that code changed (#224): an entry's optional code_paths
# lists the tracked files it executes, hashed against a per-label state file.
#
# Vars:
#   mac_launchd_ensure_services — list of {name, plist, health_url?, code_paths?}
#   mac_launchd_reload_labels   — labels needing reloaded after plist template change
#   mac_launchd_code_repo_root  — checkout the code_paths are relative to
#   mac_launchd_code_state_dir  — where <label>.sha256 records the running code hash
- name: Stat configured launchd plists
  ansible.builtin.stat:
    path: "{{ item.plist }}"
  loop: "{{ mac_launchd_ensure_services }}"
  register: _mac_launchd_plist_stats
  loop_control:
    label: "{{ item.name }}"

- name: Build installed launchd ensure targets
  ansible.builtin.set_fact:
    _mac_launchd_installed: >-
      {{
        _mac_launchd_plist_stats.results
        | selectattr('stat.exists')
        | map(attribute='item')
        | list
      }}

- name: Probe configured launchd job states
  ansible.builtin.shell: |
    set -eu
    label="{{ item.name }}"
    line="$(launchctl list 2>/dev/null | awk -v l="$label" '$3 == l {print; exit}')"
    if [ -z "$line" ]; then
      echo unloaded
      exit 0
    fi
    pid="$(echo "$line" | awk '{print $1}')"
    code="$(echo "$line" | awk '{print $2}')"
    if [ "$pid" != "-" ]; then
      echo started
    elif [ "$code" = "0" ] || [ "$code" = "-2" ] || [ "$code" = "-3" ] || [ "$code" = "-9" ] || [ "$code" = "-15" ]; then
      echo stopped
    else
      echo unknown
    fi
  args:
    executable: /bin/bash
  loop: "{{ _mac_launchd_installed }}"
  register: _mac_launchd_state_probes
  changed_when: false
  loop_control:
    label: "{{ item.name }}"

# #224: a KeepAlive agent started from the checkout keeps running the code it
# started with, so a deploy that changed only that code (no plist diff) left
# the dashboard serving pre-fix code for hours. Hash the tracked files each
# entry's code_paths names and compare with the hash recorded after its last
# restart. Tracked files only (git ls-files), so __pycache__ and other runtime
# junk never look like a code change; plain find when the checkout is not a
# git repository. The probe only reads, so it runs in check mode too and a
# dry run reports the pending restart as changed.
- name: Ensure the launchd code-hash state directory exists
  ansible.builtin.file:
    path: "{{ mac_launchd_code_state_dir }}"
    state: directory
    mode: "0755"
  when: _mac_launchd_installed | selectattr('code_paths', 'defined') | list | length > 0

- name: Hash the checkout code each KeepAlive launchd agent executes
  ansible.builtin.shell:
    cmd: |
      {% raw %}
      set -euo pipefail
      read -r -a code_paths <<< "$CODE_PATHS"
      list_code() {
        if git -C "$REPO_ROOT" rev-parse --git-dir >/dev/null 2>&1; then
          git -C "$REPO_ROOT" ls-files -z -- "${code_paths[@]}"
        else
          (cd "$REPO_ROOT" && find "${code_paths[@]}" -type f ! -path '*/__pycache__/*' ! -name '*.pyc' -print0 | sort -z)
        fi
      }
      # A tracked file deleted in the working tree (an edit in progress in the
      # checkout) would otherwise fail below as an opaque shasum error.
      if git -C "$REPO_ROOT" rev-parse --git-dir >/dev/null 2>&1; then
        deleted=$(git -C "$REPO_ROOT" ls-files --deleted -- "${code_paths[@]}")
        if [ -n "$deleted" ]; then
          echo "$LABEL code hash: tracked file(s) missing from the working tree of $REPO_ROOT" \
            "(checkout mid-edit?); restore or commit the deletion, then redeploy:" $deleted >&2
          exit 1
        fi
      fi
      new=$(list_code \
        | (cd "$REPO_ROOT" && xargs -0 shasum -a 256) \
        | shasum -a 256 | awk '{print $1}')
      old=""
      [ -f "$STATE_FILE" ] && old=$(cat "$STATE_FILE")
      echo "$new"
      if [ "$new" != "$old" ]; then
        echo changed
      else
        echo unchanged
      fi
      {% endraw %}
    executable: /bin/bash
  environment:
    LABEL: "{{ item.name }}"
    REPO_ROOT: "{{ mac_launchd_code_repo_root }}"
    CODE_PATHS: "{{ item.code_paths | join(' ') }}"
    STATE_FILE: "{{ mac_launchd_code_state_dir }}/{{ item.name }}.sha256"
  loop: "{{ _mac_launchd_installed | selectattr('code_paths', 'defined') | list }}"
  register: _mac_launchd_code_probes
  changed_when: _mac_launchd_code_probes.stdout_lines | last == 'changed'
  check_mode: false
  loop_control:
    label: "{{ item.name }}"

- name: Collect launchd agents whose checkout code changed since they started
  ansible.builtin.set_fact:
    _mac_launchd_code_stale: >-
      {{
        _mac_launchd_code_probes.results
        | default([])
        | selectattr('changed')
        | map(attribute='item.name')
        | list
      }}

# The explicit signal #224 asked for: a human reading the recap sees which
# agents were stale and what the manual equivalent is.
- name: Report launchd agents running code older than the checkout
  ansible.builtin.debug:
    msg: >-
      Code changed since start, restarting: {{ _mac_launchd_code_stale | join(', ') }}
      (manual equivalent: launchctl kickstart -k gui/$(id -u)/<label>)
  when: _mac_launchd_code_stale | length > 0

- name: Reload launchd agents after plist template changes
  community.general.launchd:
    name: "{{ item.item.name }}"
    state: reloaded
    enabled: true
  loop: "{{ _mac_launchd_state_probes.results }}"
  when: item.item.name in (mac_launchd_reload_labels | default([]))
  register: _mac_launchd_reload_results
  loop_control:
    label: "{{ item.item.name }}"

- name: Load configured launchd agents when unloaded
  community.general.launchd:
    name: "{{ item.item.name }}"
    state: started
    enabled: true
  loop: "{{ _mac_launchd_state_probes.results }}"
  when:
    - item.stdout | trim == 'unloaded'
    - item.item.name not in (mac_launchd_reload_labels | default([]))
  register: _mac_launchd_load_results
  loop_control:
    label: "{{ item.item.name }}"

- name: Restart configured launchd agents after abnormal exit
  community.general.launchd:
    name: "{{ item.item.name }}"
    state: restarted
    enabled: true
  loop: "{{ _mac_launchd_state_probes.results }}"
  when:
    - item.stdout | trim == 'unknown'
    - item.item.name not in (mac_launchd_reload_labels | default([]))
    - item.item.health_url is not defined
  register: _mac_launchd_unknown_restart_results
  loop_control:
    label: "{{ item.item.name }}"

- name: Probe HTTP health for configured launchd agents
  ansible.builtin.uri:
    url: "{{ item.health_url }}"
    status_code: 200
  loop: "{{ _mac_launchd_installed | selectattr('health_url', 'defined') | list }}"
  register: _mac_launchd_health_probes
  failed_when: false
  loop_control:
    label: "{{ item.name }}"

- name: Restart keepalive launchd agent when not running or HTTP health fails
  community.general.launchd:
    name: "{{ item.name }}"
    state: restarted
    enabled: true
  loop: "{{ _mac_launchd_installed | selectattr('health_url', 'defined') | list }}"
  vars:
    _state_probe: >-
      {{
        (_mac_launchd_state_probes.results
         | selectattr('item.name', 'equalto', item.name)
         | map(attribute='stdout')
         | map('trim')
         | first)
        | default('unloaded')
      }}
    _health_probe: >-
      {{
        (_mac_launchd_health_probes.results
         | selectattr('item.name', 'equalto', item.name)
         | first)
        | default({})
      }}
  when:
    - item.name not in (mac_launchd_reload_labels | default([]))
    - _state_probe in ['stopped', 'unknown', 'unloaded']
      or (_health_probe.status | default(0)) != 200
  register: _mac_launchd_health_restart_results
  loop_control:
    label: "{{ item.name }}"

# A label already restarted or (re)loaded above runs the new code now, so it
# is skipped here; its hash is still recorded below.
- name: Restart launchd agents whose checkout code changed since they started
  community.general.launchd:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop: "{{ _mac_launchd_code_stale }}"
  vars:
    _restarted_this_run: >-
      {{
        (_mac_launchd_load_results.results | default([])
         | selectattr('changed') | map(attribute='item.item.name') | list)
        + (_mac_launchd_unknown_restart_results.results | default([])
           | selectattr('changed') | map(attribute='item.item.name') | list)
        + (_mac_launchd_health_restart_results.results | default([])
           | selectattr('changed') | map(attribute='item.name') | list)
      }}
  when:
    - item not in (mac_launchd_reload_labels | default([]))
    - item not in _restarted_this_run
  register: _mac_launchd_code_restart_results

- name: Wait for HTTP health on keepalive launchd agents
  ansible.builtin.uri:
    url: "{{ item.health_url }}"
    status_code: 200
  loop: "{{ _mac_launchd_installed | selectattr('health_url', 'defined') | list }}"
  vars:
    _health_probe: >-
      {{
        (_mac_launchd_health_probes.results
         | selectattr('item.name', 'equalto', item.name)
         | first)
        | default({})
      }}
    _health_restarted: >-
      {{
        (_mac_launchd_health_restart_results.results
         | default([])
         | selectattr('item.name', 'equalto', item.name)
         | selectattr('changed')
         | list
         | length) > 0
      }}
    _was_reloaded: "{{ item.name in (mac_launchd_reload_labels | default([])) }}"
    _code_restarted: "{{ item.name in (_mac_launchd_code_stale | default([])) }}"
  when:
    - _health_restarted
      or (_health_probe.status | default(0)) != 200
      or _was_reloaded
      or _code_restarted
  register: _mac_launchd_health_wait
  until: _mac_launchd_health_wait.status == 200
  retries: 120
  delay: 2
  loop_control:
    label: "{{ item.name }}"

# Recorded only now, after the restart and the health wait passed, so a failed
# restart is retried on the next deploy instead of being marked current.
- name: Record the checkout code hash each launchd agent now runs
  ansible.builtin.copy:
    content: "{{ item.stdout_lines | first }}\n"
    dest: "{{ mac_launchd_code_state_dir }}/{{ item.item.name }}.sha256"
    mode: "0644"
  loop: "{{ _mac_launchd_code_probes.results | default([]) | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
