---
# Installs and configures Vector and OpenObserve on macOS control node.

- name: Ensure Observability directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ vector_config_dir }}"
    - "{{ vector_data_dir }}"
    - "{{ openobserve_data_dir }}"
    - "{{ openobserve_data_dir }}/cache"
    - "{{ openobserve_bin_path | dirname }}"


- name: Ensure Vector config directory is secure
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    mode: "0700"

- name: Check if OpenObserve is installed
  ansible.builtin.stat:
    path: "{{ openobserve_bin_path }}"
  register: _openobserve_bin_stat

- name: Download and install OpenObserve when missing
  block:
    - name: Set OpenObserve architecture fact
      ansible.builtin.set_fact:
        _openobserve_arch: "{{ 'darwin-arm64' if ansible_facts['architecture'] in ['arm64', 'aarch64'] else 'darwin-amd64' }}"

    - name: Download OpenObserve archive
      vars:
        _base_url: "https://downloads.openobserve.ai/releases/o2-enterprise"
        _archive: "openobserve-ee-v{{ openobserve_version }}-{{ _openobserve_arch }}.tar.gz"
      ansible.builtin.get_url:
        url: "{{ _base_url }}/v{{ openobserve_version }}/{{ _archive }}"
        dest: "/tmp/openobserve.tar.gz"
        mode: "0644"

    - name: Extract OpenObserve binary
      ansible.builtin.command:
        cmd: "tar -xzf /tmp/openobserve.tar.gz -C /tmp"


    - name: Move OpenObserve binary to destination
      ansible.builtin.copy:
        src: "/tmp/openobserve"
        dest: "{{ openobserve_bin_path }}"
        mode: "0755"
        remote_src: true

    - name: Clean up temporary OpenObserve files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/openobserve.tar.gz"
        - "/tmp/openobserve"
  when: not (_openobserve_bin_stat.stat.exists | default(false))

- name: Render OpenObserve launchd agent plist
  ansible.builtin.template:
    src: openobserve.plist.j2
    dest: "{{ agents_dir }}/{{ openobserve_label }}.plist"
    mode: "0644"
  register: _openobserve_plist

- name: Render Vector configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    mode: "0600"
  register: _vector_config

- name: Render Vector launchd agent plist
  ansible.builtin.template:
    src: vector.plist.j2
    dest: "{{ agents_dir }}/{{ vector_label }}.plist"
    mode: "0644"
  register: _vector_plist
