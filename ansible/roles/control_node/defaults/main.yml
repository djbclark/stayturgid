---
# Control-node (Mac workstation) defaults — launchd agents, SSH fragment.
stayturgid_repo_root: "{{ ansible_config_file | dirname | dirname }}"

# Health monitor cycle interval in seconds (default 900 = 15 min).
# Controls fleet-health, access-monitor, fire-help, firerpa-health, and the
# Termux boot-heal loop. ADB reconnect stays at 60s independently.
stayturgid_interval_sec: 900

# Nightly Termux pkg update/upgrade on all fleet hosts (Mac launchd → Ansible SSH).
# Uses stayturgid.termux.termux_pkg (same as deploy). Local time on the Mac.
stayturgid_termux_pkg_nightly_enabled: true
stayturgid_termux_pkg_nightly_hour: 4
stayturgid_termux_pkg_nightly_minute: 15

conf_dir: "{{ lookup('env', 'HOME') }}/.config/stayturgid"
agents_dir: "{{ lookup('env', 'HOME') }}/Library/LaunchAgents"
stayturgid_ssh_keys_dir: "{{ lookup('env', 'HOME') }}/.ssh"
ssh_config_dir: "{{ lookup('env', 'HOME') }}/.ssh"
ssh_config_fragment: "{{ lookup('env', 'HOME') }}/.ssh/config.d/stayturgid"
# The hand-made venv behind com.stayturgid.firerpa-mcp and
# control/bin/firerpa_health_monitor.py. Managed from
# control/requirements-firerpa-venv.txt so a plain deploy can rebuild or repair it;
# set stayturgid_firerpa_venv_managed: false to leave it strictly alone.
# Keep the ~/ops Claude memory path a symlink into the tracked memory tree.
stayturgid_ops_memory_link_managed: true
stayturgid_ops_memory_link: >-
  {{ lookup('env', 'HOME') }}/.claude/projects/-Users-djbclark-ops/memory
stayturgid_ops_memory_target: "{{ lookup('env', 'HOME') }}/ops/site-private/memory"

stayturgid_firerpa_venv_managed: true
stayturgid_firerpa_venv: "{{ lookup('env', 'HOME') }}/.venv-stayturgid-firerpa"
stayturgid_firerpa_venv_python_version: "3.12"
stayturgid_firerpa_venv_requirements: >-
  {{ stayturgid_repo_root | realpath }}/control/requirements-firerpa-venv.txt
# Must track the firerpa role's firerpa_version, so the client and server match.
stayturgid_firerpa_client_version: "10.9"

stayturgid_firerpa_certificate_path: >-
  {{
    lookup('env', 'FIRERPA_CERTIFICATE')
    | default(lookup('env', 'HOME') ~ '/.config/stayturgid/firerpa.pem', true)
  }}

# Phone → Mac Eternal Terminal: fleet keys in ~/.ssh/authorized_keys (marked block).
stayturgid_control_et_enabled: true
stayturgid_control_et_port: 2022
# Optional overrides (empty = ensure_et_mac.py auto-detects Tailscale/LAN).
stayturgid_control_tailscale_ip: ""
stayturgid_control_lan_ip: ""
stayturgid_control_et_user: "{{ lookup('env', 'USER') }}"

# Homebrew install path (Apple Silicon default; Intel uses /usr/local).
stayturgid_homebrew_prefix: >-
  {{
    '/opt/homebrew'
    if ansible_facts.get('architecture', 'arm64') in ['arm64', 'aarch64']
    else '/usr/local'
  }}

# Project Homebrew formulae.
stayturgid_mac_brew_packages_base:
  - android-platform-tools
  - python
  - uv
  - git
  - ansible
  - scrcpy
  - gitleaks
  # Hermes Agent: installed via canonical git+uv method (see tasks/hermes.yml)
  # The brew formula is unsupported by upstream and pins Python 3.14 which breaks
  # DaemonThreadPoolExecutor (upstream requires-python caps at <3.14).
  # GNU rsync (3.x, protocol 32) — macOS ships an ancient 2.6.9/protocol-29
  # build at /usr/bin/rsync. Termux devices run modern rsync too, so both
  # ends of the termux_userland synchronize tasks should speak the same
  # protocol. See stayturgid_local_rsync_path below.
  - rsync

stayturgid_mac_brew_packages_app_stores:
  - fdroidcl
  - apkeep

stayturgid_mac_uv_tools:
  - uiautomator2
  - mypy
  - bandit
  # Builds the device CFEngine policy artifact (cfbs build) during a fleet
  # deploy — the termux_userland role delegates the build to the control node.
  - cfbs

# ── Hermes Agent (control-node messaging gateway) ─────────────────────────
# Desktop/CLI agent with OpenCode Zen API + optional Telegram remote.
# Secrets never in git: TELEGRAM_BOT_TOKEN and API keys live under ~/.hermes/.
stayturgid_hermes_enabled: true
stayturgid_hermes_gateway_enabled: true
stayturgid_hermes_home: "{{ lookup('env', 'HOME') }}/.hermes"
stayturgid_hermes_model: big-pickle
stayturgid_hermes_provider: opencode-zen
stayturgid_hermes_gateway_label: com.stayturgid.hermes-gateway
# Binary path for the gateway. Default: git-install venv wrapper (Python
# version pinned by upstream's requires-python, not the system/homebrew
# default). Override to stayturgid_homebrew_prefix + /bin/hermes if you
# want the brew formula instead.
stayturgid_hermes_bin: "{{ lookup('env', 'HOME') }}/.local/bin/hermes"
# Site-specific Telegram allowlist (numeric user ids, comma-separated).
# Empty = leave existing ~/.hermes/.env values alone (pairing still works).
stayturgid_hermes_telegram_allowed_users: ""
stayturgid_hermes_telegram_home_channel: ""
# Optional one-shot seed from the environment when running the playbook:
#   TELEGRAM_BOT_TOKEN=… ansible-playbook … --tags hermes
# Prefer writing the token once into ~/.hermes/.env by hand.
stayturgid_hermes_telegram_bot_token: ""

# ── OpenCode web (control-node web UI reachable from fleet devices) ─────────
stayturgid_opencode_web_enabled: true
stayturgid_opencode_web_port: 4096
# opencode's own installer/self-update relocated its binary from
# ~/.local/bin/opencode to ~/.opencode/bin/opencode at some point -- this
# default silently pointed at the old, now-missing path, so the
# com.stayturgid.opencode-web LaunchAgent exec'd nothing (EX_CONFIG,
# perpetual restart loop, port 4096 never listening). Confirmed real
# 2026-08-03.
stayturgid_opencode_path: "{{ lookup('env', 'HOME') }}/.opencode/bin/opencode"
stayturgid_opencode_web_label: com.stayturgid.opencode-web

# ── Fleet dashboard (Flask + HTMX web UI, port 4097) ──────────────────────
stayturgid_dashboard_enabled: true
stayturgid_dashboard_port: 4097
stayturgid_dashboard_label: com.stayturgid.dashboard

# ── Code-change restarts for KeepAlive agents (#224) ───────────────────────
# A KeepAlive agent that runs Python straight out of the product checkout keeps
# serving the code it started with: a deploy that changes only that code (no
# plist diff) never restarted it, so the dashboard and landing served pre-fix
# code for hours (2026-08-03). launchd_ensure.yml hashes the tracked files
# listed in a service entry's `code_paths` against a per-label state file under
# this directory and restarts the agent when they differ; the hash is recorded
# only after the restart (and the health wait, when the entry has a
# health_url) passed, so a failed restart is retried on the next deploy.
#
# Each list is the entry script plus every control/ module it imports at run
# time, transitively; tests/python/test_launchd_code_restart.py computes that
# closure from the sources and fails when a new import is missing here.
# StartInterval agents pick up new code on their next run and need no entry.
# Agents that run an external binary (Hermes gateway, OpenCode web) are not
# checkout code and have no entry either.
stayturgid_launchd_code_state_dir: "{{ conf_dir }}/state/launchd-code"
stayturgid_dashboard_code_paths:
  - control/bin/dashboard.py
  - control/bin/check_fleet_health.py
  - control/lib/a11y_services.py
  - control/lib/fleet_health.py
  - control/lib/stats.py
  - control/lib/stayturgid_device.py
  - control/lib/ui_parse.py
stayturgid_firerpa_mcp_code_paths:
  - control/bin/firerpa_mcp.py
  - control/bin/firerpa_heal.py
  - control/lib/ansible_context.py
  - control/lib/firerpa_auth.py
  - control/lib/firerpa_consent.py
  - control/lib/firerpa_fleet.py
  - control/lib/hermes_notify.py
  - control/lib/secretspec_exec.py
  - control/lib/site_discovery.py
  - control/lib/site_logging.py
