[defaults]
# Production inventory belongs in a private site repo. CI copies the generic
# example to this path for validation; deployments use the site's ANSIBLE_CONFIG.
inventory = inventory/hosts.yml
roles_path = roles
# Site roles: control_node (Mac workstation). Device logic lives in ansible_collections/.
# The termux_pkg module and companion roles live in stayturgid.* collections;
# reference them by FQCN. collections_path points at the dir containing
# ansible_collections/ (the repo root, one level up from this file).
collections_path = ../.ansible/collections:..
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
