[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# The termux_pkg module lives in the stayturgid.fleet collection (repo root);
# reference it by FQCN. collections_path points at the dir containing
# ansible_collections/ (the repo root, one level up from this file).
collections_path = ..
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
