[project]
name = "stayturgid"
revision = "1.0"

# Stayturgid secrets — managed by secretspec (https://secretspec.dev).
# All values live outside git (see .gitignore). secretspec provides a
# single source of truth for what secrets exist, where they're stored,
# and what they're used for.
#
# Quick start:
#   secretspec check          # Verify all secrets are set (no-prompt mode)
#   secretspec run -- make vlm-check  # Inject secrets into a command
#
# Migrating existing .env files:
#   For each .env file, import: secretspec init --from dotenv://path/to/.env

[profiles.default]
# ── Hermes / Telegram ──
TELEGRAM_BOT_TOKEN = { description = "Telegram bot token for Hermes agent notifications. Stored in ~/.hermes/.env", required = true }
TELEGRAM_ALLOWED_USERS = { description = "Comma-separated Telegram user IDs allowed to interact with Hermes. Stored in ~/.hermes/.env", required = false }
TELEGRAM_HOME_CHANNEL = { description = "Telegram channel ID for Hermes notifications. Stored in ~/.hermes/.env", required = false }

# ── VLM Cloud API Keys (on-device LLM checks) ──
GEMINI_API_KEY = { description = "Google Gemini API key for VLM cloud checks. Stored in ~/.config/stayturgid/gemini.env", required = false }
ANTHROPIC_API_KEY = { description = "Anthropic Claude API key for VLM cloud checks. Stored in ~/.config/stayturgid/anthropic.env", required = false }

# ── Google Play credentials (parked — for Play Store APK downloads) ──
GPLAY_EMAIL = { description = "Google account email for Play Store APK downloads. Stored in ~/.config/stayturgid/play.env", required = false }
GPLAY_AAS_TOKEN = { description = "Google Play AAS token for apkeep downloads. Stored in ~/.config/stayturgid/play.env", required = false }
GPLAY_AUTH_TOKEN = { description = "Google Play auth token (gplaycli). Stored in ~/.config/stayturgid/play.env", required = false }

# ── FIRERPA / lamda (gRPC backup channel) ──
FIRERPA_API_KEY = { description = "FIRERPA gRPC API key for fleet heal over backup channel. Stored in ~/.config/stayturgid/firerpa.env", required = false }

# ── GitHub (for gh CLI) ──
GITHUB_TOKEN = { description = "GitHub personal access token for gh CLI auth. Configured via `gh auth login`", required = false }
ANSIBLE_GALAXY_TOKEN = { description = "Ansible Galaxy API token for publishing collections (non‑essential). See human/HANDOFF-HUMAN.md", required = false }

# ── OpenCode / LLM Providers (configured via /connect in TUI) ──
OPENCODE_ZEN_API_KEY = { description = "OpenCode Zen API key for the Hermes LLM provider. Configured via `hermes auth add opencode-zen`", required = false }

# ── Paths to key files (used by ansible/control scripts) ──
SSH_TERMUX_KEY = { description = "Path to Termux SSH private key (~/.ssh/termux_key)", required = false, default = "~/.ssh/termux_key" }
SSH_CA_KEY = { description = "Path to SSH CA private key (~/.ssh/stayturgid_ca)", required = false, default = "~/.ssh/stayturgid_ca" }
FLEET_ADBKEY = { description = "Path to fleet ADB private key (~/.config/stayturgid/adbkey)", required = false, default = "~/.config/stayturgid/adbkey" }
DEBUG_KEYSTORE = { description = "Path to Android debug keystore (~/.android/debug.keystore)", required = false, default = "~/.android/debug.keystore" }
DEBUG_KEYSTORE_PASS = { description = "Android debug keystore password (default: android)", required = false, default = "android" }
HANDSETS_JAR = { description = "Path to Handsets jar (~/.handsets/hs.jar)", required = false, default = "~/.handsets/hs.jar" }
