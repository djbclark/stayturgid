---
- name: stayturgid fleet
  hosts: stayturgid
  gather_facts: false
  vars:
    stayturgid_repo_root: "{{ playbook_dir }}/../.."
  roles:
    - role: stayturgid.termux.termux_userland
    - role: stayturgid.fleet.autojs6_watchdog
    - role: stayturgid.obtainium.obtainium_apps
    - role: stayturgid.android_common.tailscale_vpn
    - role: stayturgid.android_common.ensure_apps
      when: stayturgid_ensure_apps | default([]) | length > 0
