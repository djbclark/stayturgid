---
# Consumer entry — delegates to the canonical stayturgid site playbook.
# Requires a full repo checkout (scripts, device/autojs6/, device/termux/ live under stayturgid_repo_root).
#
#   export ANSIBLE_CONFIG=ansible.cfg
#   ansible-playbook playbook.yml [--limit oneui-device]
- name: Import site playbook
  import_playbook: "{{ stayturgid_repo_root | default(playbook_dir ~ '/../..') }}/ansible/playbooks/site.yml"
