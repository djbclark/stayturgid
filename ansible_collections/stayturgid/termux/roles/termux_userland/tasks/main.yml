---
# Pin the mirror BEFORE any pkg operation so update/upgrade is deterministic.
- name: Pin Termux main mirror (deterministic pkg update)
  ansible.builtin.copy:
    dest: "{{ termux_prefix }}/etc/apt/sources.list"
    content: "deb {{ stayturgid_termux_mirror }} stable main\n"
    mode: "0644"

- name: Update and upgrade all Termux packages
  stayturgid.termux.termux_pkg:
    name: []
    state: present
    update_cache: true
    upgrade: true
    force_confold: true
    _termux_prefix: "{{ termux_prefix }}"
  register: pkg_upgrade

- name: Ensure Termux packages are installed
  stayturgid.termux.termux_pkg:
    name: "{{ stayturgid_termux_packages }}"
    state: present
    update_cache: false
    upgrade: false
    force_confold: true
    _termux_prefix: "{{ termux_prefix }}"
  register: pkg_install

# pkg update selects a random mirror and rewrites sources.list — re-pin after
# every update/upgrade so verify and later pkg runs stay deterministic.
- name: Re-pin Termux main mirror after pkg operations
  ansible.builtin.copy:
    dest: "{{ termux_prefix }}/etc/apt/sources.list"
    content: "deb {{ stayturgid_termux_mirror }} stable main\n"
    mode: "0644"

- name: Detect Termux account owning termux_home
  ansible.builtin.stat:
    path: "{{ termux_home }}"
  register: _termux_home_stat

- name: Configure fleet SSH keys and sshd
  ansible.builtin.include_tasks: ssh_keys.yml
  when: _termux_home_stat.stat.exists

# Single-root layout: all stayturgid files live under ~/.stayturgid (private)
# and /sdcard/stayturgid (shared). Create the tree up front; every runtime
# writer also mkdir -p's on demand so a user-deleted dir self-heals.
- name: Ensure stayturgid home directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ termux_home }}/.stayturgid/bin"
    - "{{ termux_home }}/.stayturgid/logs"
    - "{{ termux_home }}/.stayturgid/run"
    - "{{ termux_home }}/.stayturgid/state"
    - "{{ termux_home }}/.stayturgid/battery-colors"

# Fire OS / some Termux builds: the file module cannot mkdir under /sdcard
# (symlink + permission quirks). mkdir -p via shell matches runtime self-heal.
- name: Ensure shared-storage stayturgid directory tree  # noqa: command-instead-of-shell
  ansible.builtin.shell: >-
    mkdir -p {{ stayturgid_sd_root }}/state {{ stayturgid_sd_root }}/logs
    {{ stayturgid_sd_root }}/run {{ stayturgid_sd_root }}/tmp {{ stayturgid_sd_root }}/autojs6
  changed_when: false

- name: Build Termux overlay appops grant list
  ansible.builtin.set_fact:
    _termux_appops_grants: "{{ _termux_appops_base + _termux_appops_overlay }}"
  vars:
    _termux_appops_base:
      - package: com.termux.api
        op: WRITE_SETTINGS
        mode: allow
    _termux_appops_overlay: >-
      {{
        stayturgid_termux_overlay_packages
        | map('regex_replace', '^(.*)$', '{"package":"\1","op":"SYSTEM_ALERT_WINDOW","mode":"allow"}')
        | map('from_json')
        | list
      }}

# Termux:API WRITE_SETTINGS, overlay ops, and POST_NOTIFICATIONS require the
# privileged adb shell (uid 2000) on localhost:5555 — Termux cannot self-grant.
- name: Grant Termux permissions via privileged shell
  stayturgid.android_common.android_appops:
    device: localhost:5555
    connect: true
    appops: "{{ _termux_appops_grants }}"
    permissions:
      - package: com.termux
        permission: android.permission.POST_NOTIFICATIONS
      - package: com.termux.api
        permission: android.permission.POST_NOTIFICATIONS
  register: termux_perm_grant

- name: Render stayturgid environment (STAYTURGID_SD for boot/repair scripts)
  ansible.builtin.copy:
    dest: "{{ termux_home }}/.stayturgid/env"
    mode: "0644"
    content: |
      # Generated by Ansible — do not hand-edit.
      export STAYTURGID_SD="{{ stayturgid_sd_root }}"
      {% if stayturgid_no_local_adb | default(false) | bool -%}
      export STAYTURGID_NO_LOCAL_ADB=1
      {% endif %}
      export STAYTURGID_HANDSETS_PORT="{{ stayturgid_handsets_port | default(9012) }}"

- name: Render fleet peers list for peer Handsets/Shizuku bootstrap
  ansible.builtin.template:
    src: peers.json.j2
    dest: "{{ termux_home }}/.stayturgid/peers"
    mode: "0644"
  when: _termux_home_stat.stat.exists

- name: Deploy shared fleet ADB key
  ansible.builtin.include_tasks: fleet_adbkey.yml
  when:
    - stayturgid_deploy_fleet_adbkey | default(true) | bool
    - _termux_home_stat.stat.exists

- name: Deploy shell scripts / shims to ~/.stayturgid/bin
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/device/termux/{{ item }}"
    dest: "{{ termux_home }}/.stayturgid/bin/{{ item }}"
    mode: "0755"
  loop: "{{ stayturgid_home_scripts }}"

- name: Deploy Python runtime scripts to ~/.stayturgid/bin
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/device/termux/py/{{ item }}"
    dest: "{{ termux_home }}/.stayturgid/bin/{{ item }}"
    mode: "0755"
  loop: "{{ stayturgid_py_scripts | default([]) }}"

- name: Deploy peer-help ForceCommand wrapper
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/device/termux/bin/{{ stayturgid_peer_help_force_script }}"
    dest: "{{ termux_home }}/.stayturgid/bin/{{ stayturgid_peer_help_force_script }}"
    mode: "0755"
  when:
    - _termux_home_stat.stat.exists
    - stayturgid_ssh_peerhelp_force_command | default(true) | bool
    - not (stayturgid_no_local_adb | default(false) | bool)

- name: Ensure on-device lib directory exists
  ansible.builtin.file:
    path: "{{ termux_home }}/.stayturgid/lib"
    state: directory
    mode: "0755"

- name: Ensure on-device catalog directory exists
  ansible.builtin.file:
    path: "{{ termux_home }}/.stayturgid/catalog"
    state: directory
    mode: "0755"

- name: Deploy shared libs to ~/.stayturgid/lib
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/{{ item.src }}"
    dest: "{{ termux_home }}/.stayturgid/lib/{{ item.dest }}"
    mode: "0644"
  loop: "{{ stayturgid_lib_files | default([]) }}"

- name: Deploy Handsets hs.jar for on-device wire client
  ansible.builtin.copy:
    src: "{{ stayturgid_handsets_jar_src }}"
    dest: "{{ termux_home }}/.stayturgid/lib/hs.jar"
    mode: "0644"
  when:
    - stayturgid_handsets_jar_src is defined
    - stayturgid_handsets_jar_src | length > 0
    - (query('fileglob', stayturgid_handsets_jar_src) | length) > 0

- name: Install rish into Termux
  ansible.builtin.include_tasks: rish.yml
  when: stayturgid_install_rish | default(true) | bool

- name: Deploy on-device UI data files
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/{{ item.src }}"
    dest: "{{ termux_home }}/.stayturgid/{{ item.dest }}"
    mode: "0644"
  loop: "{{ stayturgid_ui_data_files | default([]) }}"

- name: Remove retired scripts from the old home-root location
  ansible.builtin.file:
    path: "{{ termux_home }}/{{ item }}"
    state: absent
  loop: "{{ stayturgid_retired_scripts | default([]) }}"

- name: Deploy battery color assets
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/device/termux/assets/battery-colors/{{ item }}"
    dest: "{{ termux_home }}/.stayturgid/battery-colors/{{ item }}"
    mode: "0644"
  loop: "{{ stayturgid_battery_color_assets }}"

- name: Ensure Termux boot directory exists
  ansible.builtin.file:
    path: "{{ termux_home }}/.termux/boot"
    state: directory
    mode: "0755"

- name: Deploy boot scripts
  ansible.builtin.copy:
    src: "{{ stayturgid_repo_root }}/device/termux/boot/{{ item }}"
    dest: "{{ termux_home }}/.termux/boot/{{ item }}"
    mode: "0755"
  loop: "{{ stayturgid_boot_scripts }}"
  notify: restart boot loop

# lineinfile, not a template: templating would clobber unrelated user
# properties (extra-keys etc.) in termux.properties.
- name: Configure allow-external-apps for RUN_COMMAND bridge
  ansible.builtin.lineinfile:
    path: "{{ termux_home }}/.termux/termux.properties"
    create: true
    regexp: '^#?\s*allow-external-apps\s*='
    line: "allow-external-apps={{ 'true' if stayturgid_allow_external_apps else 'false' }}"
    mode: "0644"
  notify: reload termux settings

- name: Write automation mode file when configured
  ansible.builtin.copy:
    dest: "{{ stayturgid_sd_root }}/state/automation_mode.txt"
    content: "{{ stayturgid_automation_mode }}\n"
    mode: "0644"
  when: stayturgid_automation_mode is defined and stayturgid_automation_mode | length > 0

- name: Verify the repair script runs
  stayturgid.termux.stayturgid_repair_check:
    repair_script: "{{ termux_home }}/.stayturgid/bin/stayturgid-repair.sh"
    termux_prefix: "{{ termux_prefix }}"
  register: repair_check

- name: Show repair STATUS line
  ansible.builtin.debug:
    msg: "{{ repair_check.status_line }}"
  when: repair_check.status_line is defined and repair_check.status_line | length > 0
