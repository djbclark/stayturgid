---
# Install Shizuku rish into ~/.stayturgid (default on every fleet device).
- name: Install rish from Shizuku APK into Termux
  ansible.builtin.command:
    cmd: "{{ termux_prefix }}/bin/python {{ termux_home }}/.stayturgid/bin/stayturgid_rish.py install"
  register: _rish_install
  changed_when: "'installed' in (_rish_install.stdout | default(''))"
  failed_when: false
  when: stayturgid_install_rish | default(true) | bool

- name: Show rish install result
  ansible.builtin.debug:
    msg: "{{ _rish_install.stdout | default(_rish_install.stderr) | default('skipped') }}"
  when:
    - stayturgid_install_rish | default(true) | bool
    - _rish_install is defined
