---
# Fleet SSH mesh: public keys via ansible.posix.authorized_key, private keys
# copied from the control-node keyring (never stored in git). Per-device fleet
# identities and ansible.builtin.known_hosts complete the device-to-device mesh.
- name: Resolve fleet SSH public key paths
  ansible.builtin.set_fact:
    _stayturgid_ssh_public_key_paths: >-
      {{
        stayturgid_ssh_public_key_files
        if (stayturgid_ssh_public_key_files | default([]) | length) > 0
        else (query('fileglob', stayturgid_ssh_keys_dir ~ '/*.pub') | sort | list)
      }}

- name: Resolve fleet SSH private key paths
  ansible.builtin.set_fact:
    _stayturgid_ssh_private_key_paths: >-
      {{
        (
          query('fileglob', stayturgid_ssh_keys_dir ~ '/id_*')
          | reject('search', '\\.pub$')
          | list
          + query('fileglob', stayturgid_ssh_keys_dir ~ '/termux_key')
          | list
        ) | unique | sort
      }}
  when: stayturgid_ssh_distribute_private_keys | bool

- name: Warn when no SSH public keys were found on the control node
  ansible.builtin.debug:
    msg: >-
      No public keys in {{ stayturgid_ssh_keys_dir }} (*.pub).
      Bootstrap still needs ./mac/bootstrap_ssh.py or ssh-copy-id once; add keys on the Mac and re-run deploy.
  when: _stayturgid_ssh_public_key_paths | length == 0

- name: Resolve Termux account for authorized_keys
  ansible.builtin.command: id -un
  register: _termux_ssh_account
  changed_when: false
  when: _termux_home_stat.stat.exists

- name: Ensure Termux .ssh directory exists
  ansible.builtin.file:
    path: "{{ termux_home }}/.ssh"
    state: directory
    mode: "0700"
  when: _termux_home_stat.stat.exists

- name: Ensure sshd host keys exist
  ansible.builtin.command:
    cmd: "{{ termux_prefix }}/bin/ssh-keygen -A"
  environment:
    PREFIX: "{{ termux_prefix }}"
  changed_when: false
  when: _termux_home_stat.stat.exists

- name: Generate per-device fleet SSH identity (ed25519)
  ansible.builtin.command:
    cmd: >-
      {{ termux_prefix }}/bin/ssh-keygen -t ed25519
      -f {{ termux_home }}/.ssh/{{ stayturgid_ssh_device_identity_key }}
      -N '' -C {{ inventory_hostname }}-fleet
    creates: "{{ termux_home }}/.ssh/{{ stayturgid_ssh_device_identity_key }}"
  when:
    - _termux_home_stat.stat.exists
    - stayturgid_ssh_mesh_device_identity | bool

- name: Ensure fleet identity private key permissions
  ansible.builtin.file:
    path: "{{ termux_home }}/.ssh/{{ stayturgid_ssh_device_identity_key }}"
    mode: "0600"
  when:
    - _termux_home_stat.stat.exists
    - stayturgid_ssh_mesh_device_identity | bool

- name: Slurp per-device fleet SSH public key
  ansible.builtin.slurp:
    src: "{{ termux_home }}/.ssh/{{ stayturgid_ssh_device_identity_key }}.pub"
  register: _stayturgid_device_pubkey_slurp
  when:
    - _termux_home_stat.stat.exists
    - stayturgid_ssh_mesh_device_identity | bool

- name: Slurp sshd host public key
  ansible.builtin.slurp:
    src: "{{ termux_prefix }}/etc/ssh/ssh_host_ed25519_key.pub"
  register: _stayturgid_sshd_host_pubkey_slurp
  when: _termux_home_stat.stat.exists

- name: Publish fleet SSH facts for mesh (hostvars)
  ansible.builtin.set_fact:
    stayturgid_device_ssh_pubkey: "{{ _stayturgid_device_pubkey_slurp.content | b64decode | trim }}"
    stayturgid_sshd_host_pubkey: "{{ _stayturgid_sshd_host_pubkey_slurp.content | b64decode | trim }}"
  when:
    - _termux_home_stat.stat.exists
    - stayturgid_ssh_mesh_device_identity | bool
    - not (_stayturgid_device_pubkey_slurp.skipped | default(false))
    - not (_stayturgid_sshd_host_pubkey_slurp.skipped | default(false))

- name: Publish sshd host pubkey when fleet device identity is disabled
  ansible.builtin.set_fact:
    stayturgid_sshd_host_pubkey: "{{ _stayturgid_sshd_host_pubkey_slurp.content | b64decode | trim }}"
  when:
    - _termux_home_stat.stat.exists
    - not (stayturgid_ssh_mesh_device_identity | bool)
    - not (_stayturgid_sshd_host_pubkey_slurp.skipped | default(false))

- name: Build known_hosts aliases for this device
  ansible.builtin.set_fact:
    stayturgid_ssh_known_host_aliases: >-
      {{
        [inventory_hostname, ansible_host]
        + ([device_lan_ip] if device_lan_ip is defined and device_lan_ip | length > 0 else [])
        | unique
        | list
      }}
  when: _termux_home_stat.stat.exists

- name: Build SSH known_hosts mesh entries for this device
  ansible.builtin.set_fact:
    _stayturgid_known_hosts_mesh_entries: "{{ lookup('template', 'known_hosts_mesh.j2') | from_json }}"
  when:
    - _termux_home_stat.stat.exists
    - stayturgid_ssh_mesh_known_hosts | bool

- name: Install fleet SSH public keys from control node (ansible.posix.authorized_key)
  ansible.posix.authorized_key:
    user: "{{ _termux_ssh_account.stdout }}"
    path: "{{ termux_home }}/.ssh/authorized_keys"
    manage_dir: false
    key: "{{ lookup('file', item) }}"
    state: present
    exclusive: false
  loop: "{{ _stayturgid_ssh_public_key_paths }}"
  when:
    - _termux_home_stat.stat.exists
    - _stayturgid_ssh_public_key_paths | length > 0

- name: Install fleet device SSH public keys (mesh authorized_keys)
  ansible.posix.authorized_key:
    user: "{{ _termux_ssh_account.stdout }}"
    path: "{{ termux_home }}/.ssh/authorized_keys"
    manage_dir: false
    key: "{{ hostvars[item].stayturgid_device_ssh_pubkey }}"
    state: present
    exclusive: false
  loop: "{{ groups[stayturgid_ssh_mesh_group] }}"
  when:
    - _termux_home_stat.stat.exists
    - stayturgid_ssh_mesh_device_identity | bool
    - hostvars[item].stayturgid_device_ssh_pubkey is defined
    - hostvars[item].stayturgid_device_ssh_pubkey | length > 0

- name: Install fleet SSH private keys on device
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ termux_home }}/.ssh/{{ item | basename }}"
    mode: "0600"
  loop: "{{ _stayturgid_ssh_private_key_paths | default([]) }}"
  no_log: true
  when:
    - _termux_home_stat.stat.exists
    - stayturgid_ssh_distribute_private_keys | bool
    - (_stayturgid_ssh_private_key_paths | default([]) | length) > 0

- name: Install fleet SSH known_hosts mesh entries
  ansible.builtin.known_hosts:
    path: "{{ termux_home }}/.ssh/known_hosts"
    name: "{{ item.name }}"
    key: "{{ item.key }}"
    state: present
  loop: "{{ _stayturgid_known_hosts_mesh_entries | default([]) }}"
  when:
    - _termux_home_stat.stat.exists
    - stayturgid_ssh_mesh_known_hosts | bool
    - (_stayturgid_known_hosts_mesh_entries | default([]) | length) > 0

- name: Apply Termux sshd lockout-prevention config and detached restart
  stayturgid.termux.termux_sshd:
    config:
      PerSourcePenalties: "no"
    termux_prefix: "{{ termux_prefix }}"
  when: _termux_home_stat.stat.exists
