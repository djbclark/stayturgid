---
# @heals: ET-CONFIG
# Phone → Mac Eternal Terminal: SSH config + package + self-heal share copy.
# Requires inventory stayturgid_control_tailscale_ip or stayturgid_mac_peer.tailscale.
- name: Resolve control-node Tailscale IP for ET SSH config
  ansible.builtin.set_fact:
    _control_et_ts_ip: >-
      {{
        stayturgid_control_tailscale_ip
        | default(stayturgid_mac_peer.tailscale | default(''), true)
      }}
    _control_et_enabled: >-
      {{
        stayturgid_control_et_enabled | default(true) | bool
      }}

- name: Skip control-ET when no Tailscale IP configured
  ansible.builtin.debug:
    msg: >-
      stayturgid_control_et skipped: set stayturgid_control_tailscale_ip
      or stayturgid_mac_peer.tailscale in inventory/group_vars.
  when:
    - _control_et_enabled | bool
    - not (_control_et_ts_ip | length > 0)

- name: Ensure Eternal Terminal client package (et)
  stayturgid.termux.termux_pkg:
    name: [et]
    state: present
    update_cache: false
    upgrade: false
    force_confold: true
    _termux_prefix: "{{ termux_prefix }}"
  when:
    - _termux_home_stat.stat.exists
    - _control_et_enabled | bool
    - _control_et_ts_ip | length > 0
    - stayturgid_control_et_install_pkg | default(true) | bool

- name: Ensure stayturgid share directory for ET self-heal
  ansible.builtin.file:
    path: "{{ termux_home }}/.stayturgid/share"
    state: directory
    mode: "0755"
  when:
    - _termux_home_stat.stat.exists
    - _control_et_enabled | bool
    - _control_et_ts_ip | length > 0

- name: Render control-ET SSH config fragment to share (self-heal source)
  ansible.builtin.template:
    src: ssh_config_control_et.j2
    dest: "{{ termux_home }}/.stayturgid/share/ssh-config-control-et"
    mode: "0644"
  when:
    - _termux_home_stat.stat.exists
    - _control_et_enabled | bool
    - _control_et_ts_ip | length > 0

- name: Stat device ~/.ssh/config (fresh devices have none yet)
  ansible.builtin.stat:
    path: "{{ termux_home }}/.ssh/config"
  register: _control_et_ssh_config_stat
  when:
    - _termux_home_stat.stat.exists
    - _control_et_enabled | bool
    - _control_et_ts_ip | length > 0

- name: Remove legacy unmarked Mac SSH config block
  ansible.builtin.replace:
    path: "{{ termux_home }}/.ssh/config"
    regexp: '(?ms)^# MacBook Air via Tailscale.*?^    IdentitiesOnly yes[ \t]*\n?'
    replace: ''
  when:
    - _termux_home_stat.stat.exists
    - _control_et_enabled | bool
    - _control_et_ts_ip | length > 0
    - _control_et_ssh_config_stat.stat.exists | default(false)

- name: Install control-ET SSH config marked block into ~/.ssh/config
  ansible.builtin.blockinfile:
    path: "{{ termux_home }}/.ssh/config"
    create: true
    mode: "0600"
    marker: "# {mark} STAYTURGID-CONTROL-ET"
    block: "{{ lookup('template', 'ssh_config_control_et.j2') }}"
  when:
    - _termux_home_stat.stat.exists
    - _control_et_enabled | bool
    - _control_et_ts_ip | length > 0

# The Mac's host key under the alias `mac` in the phone's known_hosts. Both the
# `mac-lan` block above (HostKeyAlias mac, StrictHostKeyChecking yes) and the
# peer-help ssh (stayturgid_peer_bootstrap.py: HostKeyAlias <peer name>,
# StrictHostKeyChecking=yes) look the key up under the BARE alias (OpenSSH never
# adds the port to an alias), so a DHCP LAN address that now answers for another
# device fails the check instead of being trusted. The key is the one the control
# node's own sshd serves on its Tailscale address, scanned on localhost for each
# phone (cheap; a run_once scan would take its `when` from the first host only).
# known_hosts state=present replaces a changed key in place (never an empty alias)
# and reports ok when nothing changed.
- name: Scan the control node's ssh host key over Tailscale
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - -p
      - "{{ stayturgid_mac_peer.port | default(22) }}"
      - -t
      - ed25519
      - "{{ _control_et_ts_ip }}"
  delegate_to: localhost
  register: _control_et_hostkeyscan
  changed_when: false
  failed_when: false
  when:
    - _control_et_enabled | bool
    - _control_et_ts_ip | length > 0

- name: Warn when the control node's host key could not be scanned
  ansible.builtin.debug:
    msg: >-
      No ssh host key from {{ _control_et_ts_ip }}; the alias mac is not pinned,
      so mac-lan and the Mac peer-help ssh fail closed until a deploy can scan it.
  when:
    - _control_et_enabled | bool
    - _control_et_ts_ip | length > 0
    - _control_et_hostkeyscan.stdout_lines | default([]) | reject('match', '^#') | select | list | length == 0

- name: Pin the control node's host key under the alias mac in the phone's known_hosts
  vars:
    _control_et_key_fields: >-
      {{
        (_control_et_hostkeyscan.stdout_lines | default([])
         | reject('match', '^#') | select | first | default('')).split()
      }}
  ansible.builtin.known_hosts:
    path: "{{ termux_home }}/.ssh/known_hosts"
    name: mac
    key: "mac {{ _control_et_key_fields[-2] }} {{ _control_et_key_fields[-1] }}"
    state: present
  when:
    - _termux_home_stat.stat.exists
    - _control_et_enabled | bool
    - _control_et_ts_ip | length > 0
    - _control_et_hostkeyscan.stdout_lines | default([]) | reject('match', '^#') | select | list | length > 0
