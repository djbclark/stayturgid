---
stayturgid_repo_root: "{{ playbook_dir }}/../.."

stayturgid_termux_packages:
  - openssh
  - android-tools
  - abseil-cpp
  - libprotobuf
  - protobuf
  - wget
  - git
  - python
  - curl
  - termux-api
  - runit

stayturgid_boot_scripts:
  - start-adb.sh
  - start-repair-bridge.sh
  - start-autojs6-watchdog.sh

# Override examples (Termux-only, no AutoJs6):
# stayturgid_boot_scripts: [start-adb.sh]
# stayturgid_home_scripts: [stayturgid-repair.sh, claude-presence.sh]  # drop repair-bridge if unused

stayturgid_home_scripts:
  - stayturgid-repair.sh
  - repair-bridge.sh
  - agent-presence.sh
  - claude-presence.sh   # compat shim -> agent-presence.sh

# Python runtime scripts (twins that have finished their parity soak and now
# ship as the deployed implementation). Copied flat from termux/py/ to ~/.
# As each shell script is retired, it moves out of stayturgid_home_scripts and
# its .py joins this list; the old ~/<name>.sh is removed via retired below.
stayturgid_py_scripts:
  - stayturgid_check_repo_version.py
  - stayturgid_screen_awake_guard.py
  - stayturgid_agent_presence.py
  - stayturgid_battery_alarm.py
  - stayturgid_repair.py
  - stayturgid_autojs6_guard.py
  - stayturgid_shell.py
  - stayturgid_screen_control.py
  - stayturgid_grant_shizuku.py
  - stayturgid_import_catalog.py
  - stayturgid_configure_aurora.py
  - stayturgid_enable_autojs6.py
  - stayturgid_handsets.py
  - stayturgid_rish.py
  - stayturgid_peer_help.py
  - stayturgid_peer_bootstrap.py

# Shared libs copied to ~/.stayturgid/lib/ (imported by on-device UI scripts).
stayturgid_lib_files:
  - src: shared/ui_parse.py
    dest: ui_parse.py
  - src: shared/ui_clearance.py
    dest: ui_clearance.py
  - src: shared/a11y_services.py
    dest: a11y_services.py

# Handsets daemon jar (Mac ~/.handsets/hs.jar → on-device lib; shell loads via
# adb push to /data/local/tmp). Skip when missing on the control node.
stayturgid_handsets_jar_src: "{{ lookup('env', 'HOME') }}/.handsets/hs.jar"
# Default Handsets wire port for this host (peers.json + Fire peer bootstrap).
stayturgid_handsets_port: 9012

# Install Shizuku rish into Termux on every deploy (default).
stayturgid_install_rish: true

# Shared fleet ADB key (control node). One "Always allow" on a target covers
# every helper that receives this keypair.
stayturgid_fleet_adbkey_src: "{{ lookup('env', 'HOME') }}/.config/stayturgid/adbkey"
stayturgid_deploy_fleet_adbkey: true

# Data files for on-device post-UI automation.
stayturgid_ui_data_files:
  - src: obtainium/stayturgid-apps.json
    dest: catalog/stayturgid-apps.json
  - src: obtainium/autojs6-only.json
    dest: catalog/autojs6-only.json
  - src: shared/autojs6_drawer_defaults.json
    dest: autojs6_drawer_defaults.json
  - src: shared/a11y_profiles.json
    dest: a11y_profiles.json

# Deployed shell scripts to remove from devices (migrated to Python).
stayturgid_retired_scripts:
  - check-repo-version.sh
  - screen-awake-guard.sh
  - stayturgid-battery-alarm.sh

stayturgid_battery_color_assets:
  - purple.png
  - blue.png
  - green.png
  - yellow.png
  - orange.png
  - red.png
  - black.png

stayturgid_allow_external_apps: true

# Fleet SSH keyring on the Ansible control node (never commit keys to git).
# By default every *.pub under this directory is installed on every device via
# ansible.posix.authorized_key; matching private keys (id_* without .pub,
# termux_key) are copied to each device's ~/.ssh/ for device-to-device SSH.
stayturgid_ssh_keys_dir: "{{ lookup('env', 'HOME') }}/.ssh"
# Non-empty list overrides auto-discovery (paths on the control node).
stayturgid_ssh_public_key_files: []
stayturgid_ssh_distribute_private_keys: true

# Fleet SSH mesh: per-device ed25519 identity + full known_hosts across the
# stayturgid inventory group (authorized_key via ansible.posix; known_hosts
# via ansible.builtin — there is no ansible.posix.known_hosts module).
stayturgid_ssh_mesh_group: stayturgid
stayturgid_ssh_mesh_device_identity: true
stayturgid_ssh_device_identity_key: id_ed25519_fleet
stayturgid_ssh_mesh_known_hosts: true

# Pin a single reliable mirror instead of Termux's random per-run rotation:
# deterministic + avoids the intermittent "Mirror sync in progress" failures.
# packages-cf.termux.dev is the official Cloudflare CDN (highest default weight).
stayturgid_termux_mirror: https://packages-cf.termux.dev/apt/termux-main

# SYSTEM_ALERT_WINDOW for termux-toast/dialog and Termux:Float (com.termux.window).
stayturgid_termux_overlay_packages:
  - com.termux
  - com.termux.api
  - com.termux.window
