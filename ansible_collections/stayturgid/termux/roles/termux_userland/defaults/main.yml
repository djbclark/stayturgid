---
stayturgid_repo_root: "{{ playbook_dir }}/../.."

stayturgid_termux_packages:
  - openssh
  - android-tools
  - abseil-cpp
  - libprotobuf
  - protobuf
  - wget
  - git
  - python
  - curl
  - termux-api
  - runit

stayturgid_boot_scripts:
  - start-adb.sh
  - start-repair-bridge.sh
  - start-autojs6-watchdog.sh

# Override examples (Termux-only, no AutoJs6):
# stayturgid_boot_scripts: [start-adb.sh]
# stayturgid_home_scripts: [stayturgid-repair.sh, claude-presence.sh]  # drop repair-bridge if unused

stayturgid_home_scripts:
  - stayturgid-repair.sh
  - repair-bridge.sh
  - agent-presence.sh
  - claude-presence.sh   # compat shim -> agent-presence.sh

# Python runtime scripts (twins that have finished their parity soak and now
# ship as the deployed implementation). Copied flat from termux/py/ to ~/.
# As each shell script is retired, it moves out of stayturgid_home_scripts and
# its .py joins this list; the old ~/<name>.sh is removed via retired below.
stayturgid_py_scripts:
  - stayturgid_check_repo_version.py
  - stayturgid_screen_awake_guard.py
  - stayturgid_agent_presence.py
  - stayturgid_battery_alarm.py
  - stayturgid_repair.py
  - stayturgid_autojs6_guard.py

# Deployed shell scripts to remove from devices (migrated to Python).
stayturgid_retired_scripts:
  - check-repo-version.sh
  - screen-awake-guard.sh
  - stayturgid-battery-alarm.sh

stayturgid_battery_color_assets:
  - purple.png
  - blue.png
  - green.png
  - yellow.png
  - orange.png
  - red.png
  - black.png

stayturgid_allow_external_apps: true

# Fleet SSH keyring on the Ansible control node (never commit keys to git).
# By default every *.pub under this directory is installed on every device via
# ansible.posix.authorized_key; matching private keys (id_* without .pub,
# termux_key) are copied to each device's ~/.ssh/ for device-to-device SSH.
stayturgid_ssh_keys_dir: "{{ lookup('env', 'HOME') }}/.ssh"
# Non-empty list overrides auto-discovery (paths on the control node).
stayturgid_ssh_public_key_files: []
stayturgid_ssh_distribute_private_keys: true

# Pin a single reliable mirror instead of Termux's random per-run rotation:
# deterministic + avoids the intermittent "Mirror sync in progress" failures.
# packages-cf.termux.dev is the official Cloudflare CDN (highest default weight).
stayturgid_termux_mirror: https://packages-cf.termux.dev/apt/termux-main

# SYSTEM_ALERT_WINDOW for termux-toast/dialog and Termux:Float (com.termux.window).
stayturgid_termux_overlay_packages:
  - com.termux
  - com.termux.api
  - com.termux.window
