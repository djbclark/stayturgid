---
- name: Stop FIRERPA server via adb
  ansible.builtin.shell: |
    adb -s {{ _firerpa_adb_target }} shell "pkill -9 lamda 2>/dev/null; rm -f /data/local/tmp/usr/lamda.pid 2>/dev/null; echo stopped"
  args:
    executable: /bin/bash
  delegate_to: localhost
  changed_when: false

- name: Remove FIRERPA install directory via adb
  ansible.builtin.shell: |
    adb -s {{ _firerpa_adb_target }} shell "rm -rf {{ firerpa_install_dir }} /data/local/tmp/usr 2>/dev/null; echo removed"
  args:
    executable: /bin/bash
  delegate_to: localhost
