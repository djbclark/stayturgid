---
# FIRERPA service: start/stop via adb from Mac control node.

- name: Start FIRERPA server via adb
  ansible.builtin.shell: |
    adb -s {{ _firerpa_adb_target }} shell "
      cd {{ firerpa_install_dir }}/server && nohup sh bin/launch.sh --port={{ firerpa_port }} > {{ firerpa_install_dir }}/server.log 2>&1 &
    "
    sleep 8
    curl -sf --connect-timeout 5 http://{{ ansible_host }}:{{ firerpa_port }}/ > /dev/null && \
      echo "FIRERPA responding" || echo "WARNING: FIRERPA may not be listening"
  args:
    executable: /bin/bash
  delegate_to: localhost
  register: _firerpa_start
