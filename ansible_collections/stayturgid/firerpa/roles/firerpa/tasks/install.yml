---
# FIRERPA install: all operations delegate to localhost (Mac → adb).

- name: Check adb reachable for FIRERPA deploy
  ansible.builtin.command: "adb -s {{ _firerpa_adb_target }} shell echo ok"
  delegate_to: localhost
  changed_when: false
  register: _firerpa_adb_check
  failed_when: false

- name: Fall back to USB serial if Tailscale ADB unreachable
  ansible.builtin.set_fact:
    _firerpa_adb_target: "{{ device_usb_serial }}"
  when:
    - device_usb_serial is defined
    - _firerpa_adb_check.rc | default(0) != 0

# A plain `just deploy` now reaches this role on every opted-in host (#311), and
# the install below unconditionally re-downloaded and re-pushed ~204 MiB each
# time. Probe first so a converged device is a genuine no-op. The probe is
# deliberately strict AND fails open: anything other than an exact match -- a
# missing or stale stamp, a missing interpreter, a missing override -- yields
# STALE and does the full install, so this can never silently under-converge.
#
# Two halves, answering different questions (2026-10-03):
#   disk_ok       -- is the pinned build on disk and intact? (stamp + checksum)
#   running_stale -- is anything still EXECUTING the build we replaced?
# The second half exists because a disk-only gate reports false success: the
# verify reads the new file while the service holds the old one open. See
# site-private memory/reference_disk_only_version_gate_reports_false_success.md.
- name: Detect whether the device already has the pinned FIRERPA build
  ansible.builtin.shell: |
    adb -s {{ _firerpa_adb_target }} shell '
      D={{ firerpa_install_dir }}
      stamp=$(cat $D/.stayturgid-firerpa-version 2>/dev/null)

      # The disk half: is the pinned build laid down and intact?
      disk_ok=0
      if [ "$stamp" = "{{ firerpa_version_stamp }}" ] \
        && [ -x $D/server/bin/python3.12 ] \
        && [ -f $D/overrides/aab.zip.signed ] \
        && [ -f $D/overrides/aab.zip.patched ]; then
        disk_ok=1
      fi

      # The running half: is anything still executing the build we replaced?
      # Unix keeps a replaced file alive for whoever holds it open, so a failed
      # kill followed by rm -rf + re-extract leaves a process on the OLD driver
      # while the disk looks perfect. Those mappings read back as "(deleted)".
      #
      # Scoped to $D deliberately. An unscoped "(deleted)" test is a false
      # positive: a healthy device had 4 lamda processes with deleted mappings
      # (/dev/ashmem/bitmap, /memfd:jit-cache), which would force a 204 MiB
      # reinstall on every single deploy.
      running_stale=0
      for pid in $(pidof lamda 2>/dev/null); do
        n=$(grep -F "$D" /proc/$pid/maps 2>/dev/null | grep -c "(deleted)")
        [ "${n:-0}" -gt 0 ] && running_stale=$((running_stale+1))
        exe=$(readlink /proc/$pid/exe 2>/dev/null)
        case "$exe" in "$D"*"(deleted)") running_stale=$((running_stale+1));; esac
      done

      if [ "$disk_ok" = "1" ] && [ "$running_stale" = "0" ]; then
        echo CONVERGED
      else
        echo "STALE disk_ok=$disk_ok running_stale=$running_stale"
      fi
    '
  args:
    executable: /bin/bash
  delegate_to: localhost
  changed_when: false
  # Run in check mode too, so a dry run reports what a real run would actually do.
  check_mode: false
  register: _firerpa_installed_probe

- name: Record whether the pinned FIRERPA build needs installing
  ansible.builtin.set_fact:
    _firerpa_install_required: "{{ 'CONVERGED' not in (_firerpa_installed_probe.stdout | default('')) }}"

# Canonical Ansible equivalent of Python's tempfile.mkdtemp / shell mktemp -d
# (unpredictable name under the system temp dir, not fixed /tmp paths) — see
# tmpfile security audit, 2026-07-21. Nothing previously cleaned these up on
# the Mac side (only the on-device /data/local/tmp copy was ever removed, in
# uninstall.yml) — cleanup task added at the end of this file.
- name: Create temporary directory for FIRERPA archive download/patch
  ansible.builtin.tempfile:
    state: directory
    prefix: firerpa-
  register: _firerpa_tmp
  # Run in check mode too, so downstream `.path` resolves during a dry-run.
  check_mode: false
  delegate_to: localhost
  when: _firerpa_install_required | bool

- name: Download FIRERPA server archive on Mac
  ansible.builtin.get_url:
    url: "{{ firerpa_server_archive_url_arm64 }}"
    dest: "{{ _firerpa_tmp.path }}/{{ firerpa_server_archive_arm64 }}"
    mode: "0644"
    checksum: "sha256:{{ firerpa_server_archive_sha256_arm64 }}"
  delegate_to: localhost
  register: _firerpa_dl
  when: _firerpa_install_required | bool

- name: Patch FIRERPA driver for accessibility service coexistence
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/firerpa_service_patch.py"
      - --archive
      - "{{ _firerpa_tmp.path }}/{{ firerpa_server_archive_arm64 }}"
      - --output
      - "{{ _firerpa_tmp.path }}/firerpa-driver-patched.zip"
  delegate_to: localhost
  changed_when: "'patched FIRERPA' in _firerpa_driver_patch.stdout"
  register: _firerpa_driver_patch
  when: _firerpa_install_required | bool

- name: Push server archive to device via adb
  ansible.builtin.command:
    cmd: >-
      adb -s {{ _firerpa_adb_target }}
      push {{ _firerpa_tmp.path }}/{{ firerpa_server_archive_arm64 }} /data/local/tmp/firerpa-server.tar.gz
  delegate_to: localhost
  when: _firerpa_install_required | bool

- name: Stop existing FIRERPA process tree before replacing files
  ansible.builtin.shell: |
    adb -s {{ _firerpa_adb_target }} shell '
      pkill -9 -x lamda 2>/dev/null || true
      for proc in /proc/[0-9]*; do
        exe=$(readlink "$proc/exe" 2>/dev/null) || continue
        case "$exe" in
          {{ firerpa_install_dir }}/server/*)
            kill -9 "${proc##*/}" 2>/dev/null || true
            ;;
        esac
      done
    '
  args:
    executable: /bin/bash
  delegate_to: localhost
  changed_when: true
  when: _firerpa_install_required | bool

- name: Extract server via adb shell
  ansible.builtin.shell: |
    adb -s {{ _firerpa_adb_target }} shell "
      rm -rf {{ firerpa_install_dir }}/server /data/local/tmp/usr 2>/dev/null
      mkdir -p {{ firerpa_install_dir }}
      cd /data/local/tmp && tar xzf firerpa-server.tar.gz -C {{ firerpa_install_dir }}/
      echo EXTRACT_OK
    "
  args:
    executable: /bin/bash
  delegate_to: localhost
  register: _firerpa_extract
  when: _firerpa_install_required | bool

# The rm is a migration, and this task is the only place the pre-v10.9 artifact
# name is allowed to appear in this role -- tests/python/test_firerpa_version_lock.py
# pins that exception to exactly this task. A device upgraded from v10.0 otherwise
# keeps the old signed/patched override pair next to the aab.zip pair forever: read
# by nothing, but a genuine trap for anyone hashing "the driver" to see which is live.
- name: Prepare FIRERPA driver override directory
  ansible.builtin.command:
    cmd: >-
      adb -s {{ _firerpa_adb_target }} shell
      mkdir -p {{ firerpa_install_dir }}/overrides '&&'
      rm -f {{ firerpa_install_dir }}/overrides/service.jar.signed
      {{ firerpa_install_dir }}/overrides/service.jar.patched
  delegate_to: localhost
  changed_when: true
  when: _firerpa_install_required | bool

- name: Preserve signed FIRERPA driver for integrity validation
  ansible.builtin.command:
    cmd: >-
      adb -s {{ _firerpa_adb_target }} shell cp
      {{ firerpa_install_dir }}/server/lib/python3.12/site-packages/lamda/aab.zip
      {{ firerpa_install_dir }}/overrides/aab.zip.signed
  delegate_to: localhost
  changed_when: true
  when: _firerpa_install_required | bool

- name: Install accessibility-compatible FIRERPA driver override
  ansible.builtin.command:
    cmd: >-
      adb -s {{ _firerpa_adb_target }} push
      {{ _firerpa_tmp.path }}/firerpa-driver-patched.zip
      {{ firerpa_install_dir }}/overrides/aab.zip.patched
  delegate_to: localhost
  changed_when: true
  when: _firerpa_install_required | bool

- name: Install Python FIRERPA lifecycle wrapper
  ansible.builtin.command:
    cmd: >-
      adb -s {{ _firerpa_adb_target }} push
      {{ role_path }}/files/firerpa_lifecycle.py
      {{ firerpa_install_dir }}/firerpa_lifecycle.py
  delegate_to: localhost
  changed_when: true

- name: Make Python FIRERPA lifecycle wrapper executable
  ansible.builtin.command:
    cmd: >-
      adb -s {{ _firerpa_adb_target }} shell chmod 0755
      {{ firerpa_install_dir }}/firerpa_lifecycle.py
  delegate_to: localhost
  changed_when: true

- name: Verify FIRERPA server binary exists after extract
  ansible.builtin.command:
    cmd: >-
      adb -s {{ _firerpa_adb_target }}
      shell test -x {{ firerpa_install_dir }}/server/bin/python3.12 && echo OK || echo MISSING
  delegate_to: localhost
  changed_when: false
  register: _firerpa_verify
  when: _firerpa_install_required | bool

# Two conditions, both about not asserting on something that did not run:
#   not ansible_check_mode -- every adb step here is a command/shell task, which
#     Ansible skips under --check, so the verify task registers no stdout and
#     `'OK' not in ''` is true. ansible.builtin.fail DOES execute in check mode,
#     so without this a dry run fails on every host that opts into FIRERPA
#     (#311 put this role in the plain-deploy path).
#   _firerpa_install_required -- when the device is already converged the extract
#     and its verify are both skipped, for the same reason.
- name: Fail if FIRERPA binary missing after extract
  ansible.builtin.fail:
    msg: "FIRERPA server binary not found at {{ firerpa_install_dir }}/server/bin/python3.12 on {{ inventory_hostname }}"
  when:
    - not ansible_check_mode
    - _firerpa_install_required | bool
    - "'OK' not in (_firerpa_verify.stdout | default(''))"

# Written last, so it only ever records a build that installed and verified
# cleanly. A partial install leaves the old stamp (or none), which means the next
# run redoes the whole thing rather than trusting a half-finished tree.
- name: Record the installed FIRERPA build on the device
  ansible.builtin.shell: |
    adb -s {{ _firerpa_adb_target }} shell 'printf "%s\n" "{{ firerpa_version_stamp }}" \
      > {{ firerpa_install_dir }}/.stayturgid-firerpa-version'
  args:
    executable: /bin/bash
  delegate_to: localhost
  changed_when: true
  when: _firerpa_install_required | bool

# Covers the happy path only — this file isn't wrapped in a block/always
# (unlike serverapp_openobserve/blackbox_exporter/olivetin) because doing so
# would mean restructuring a long chain of adb push/shell steps I can't
# fully exercise against a live device from here; a failure partway through
# will still leave the temp dir behind. Better than the previous "never
# cleaned up at all," not as strong a guarantee as the serverapp_* roles.
- name: Clean up temporary FIRERPA directory
  ansible.builtin.file:
    path: "{{ _firerpa_tmp.path }}"
    state: absent
  delegate_to: localhost
  when: _firerpa_tmp.path is defined
