---
# FIRERPA/lamda server role — optional on-device failsafe daemon.
# v10.9 is the first obtainable build supporting Android 17 / API 37 and a
# 16KB page size (firerpa/lamda#147); it also moved the embedded runtime to
# Python 3.12 and replaced the driver JAR of earlier releases with lamda/aab.zip.
# Deployed via Ansible; no APK required.  Default: disabled.
firerpa_enabled: false
firerpa_version: "10.9"
firerpa_port: 65000
firerpa_install_dir: /data/local/tmp/firerpa
firerpa_server_archive_arm64: "lamda-server-arm64-v8a.tar.gz"
firerpa_server_archive_sha256_arm64: "88957c04f6cae2e2cc56aaece92cec4074ad72092bc05f1e26e4095de7dedeca"
firerpa_server_archive_url_arm64: >-
  https://github.com/djbclark/lamda/releases/download/v{{ firerpa_version }}-binaries/{{ firerpa_server_archive_arm64 }}
# expanduser is load-bearing: the tracked secretspec default for
# FIRERPA_CERTIFICATE is a literal "~/..." path. ansible.builtin.stat expands a
# tilde, but `adb push` does not, so the certificate has to be absolute before it
# reaches a command task or the push fails with "cannot stat '~/...'".
# Identifies the exact build installed on a device. install.yml writes this to
# {{ firerpa_install_dir }}/.stayturgid-firerpa-version after a successful install
# and compares it on the next run, so an already-converged device skips a ~204 MiB
# download, push and extract. Version alone is not enough: the archive checksum is
# what actually pins the bytes.
firerpa_version_stamp: "{{ firerpa_version }} {{ firerpa_server_archive_sha256_arm64 }}"

firerpa_certificate_path: >-
  {{
    (
      lookup('env', 'FIRERPA_CERTIFICATE')
      | default(lookup('env', 'HOME') ~ '/.config/stayturgid/firerpa.pem', true)
    ) | expanduser
  }}
firerpa_certificate_device_path: "{{ firerpa_install_dir }}/server/lamda.pem"
firerpa_certificate_required: true

# Minimal failsafe config — only sshd + gRPC.  All other services off by default.
# Enable additional services per-device via host_vars.
firerpa_sshd_enabled: true
firerpa_adb_enabled: false
firerpa_cron_enabled: false
firerpa_webui_enabled: false
firerpa_webrtc_enabled: false
firerpa_h264_enabled: false
firerpa_fwd_enabled: false
firerpa_tunnel2_enabled: false
firerpa_mdns_enabled: false

# The service certificate supplies both gRPC mutual TLS credentials and the
# SSH authorized key. Non-root devices authenticate as Android user "shell".
firerpa_ssh_user: shell

# Paths (must match termux_userland role)
termux_home: /data/data/com.termux/files/home
_firerpa_adb_target: "{{ ansible_host }}:5555"
