---
# Deploys the AutoJs6 watchdog project over SSH (Termux writes /sdcard
# directly — no Mac-side adb needed). Fire OS uses autojs6_project_deploy
# over Mac adb (Termux cannot write /sdcard reliably).
# Device profile is DATA generated from the inventory taxonomy — the code
# contains no device-specific names or coordinates.
- name: Ensure shared-storage state dir for the device profile  # noqa: command-instead-of-shell
  ansible.builtin.shell: mkdir -p {{ stayturgid_sd_root }}/state
  changed_when: false
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))

- name: Render device profile from inventory layers
  ansible.builtin.template:
    src: device.json.j2
    dest: "{{ stayturgid_sd_root }}/state/device.json"
  notify: nudge autojs6 watchdog
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))

- name: Deploy AutoJs6 project files (SSH path)
  ansible.builtin.copy:
    src: "{{ autojs6_repo_root }}/device/autojs6/{{ item }}"
    dest: "{{ autojs6_target }}/"
  loop:
    - project.json
    - main.js
    - lib
    - scripts
    - fleet_profile.json
  notify: nudge autojs6 watchdog
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))

- name: Compute local AutoJs6 fleet profile checksum
  ansible.builtin.stat:
    path: "{{ autojs6_target }}/fleet_profile.json"
    checksum_algorithm: sha256
  register: _autojs_fp_local
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))

- name: Compute remote AutoJs6 fleet profile checksum
  ansible.builtin.shell: |
    sha256sum /sdcard/Download/autojs6-fleet.json 2>/dev/null | cut -d' ' -f1 || echo MISSING
  register: _autojs_fp_remote
  changed_when: false
  failed_when: false
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))

- name: Copy fleet profile to Download location (SSH path)
  ansible.builtin.shell: |
    cp "{{ autojs6_target }}/fleet_profile.json" /sdcard/Download/autojs6-fleet.json
  when:
    - not (stayturgid_autojs6_deploy_via_adb | default(false))
    - >-
      _autojs_fp_remote.stdout is not defined
      or 'MISSING' in (_autojs_fp_remote.stdout | default(''))
      or _autojs_fp_local.stat.checksum != (_autojs_fp_remote.stdout | default('')).strip()
  changed_when: true

# Canonical Ansible equivalent of Python's tempfile.mkstemp (unpredictable
# name under the system temp dir, not fixed /tmp/stayturgid-<host>-*.json —
# see tmpfile security audit, 2026-07-21). Never cleaned up before; added
# below.
- name: Create temporary file for device profile staging (Fire OS)
  ansible.builtin.tempfile:
    state: file
    prefix: "stayturgid-{{ inventory_hostname }}-device-"
    suffix: .json
  register: _autojs6_device_json_tmp
  delegate_to: localhost
  when: stayturgid_autojs6_deploy_via_adb | default(false)

- name: Stage device profile for adb push (Fire OS)
  ansible.builtin.template:
    src: device.json.j2
    dest: "{{ _autojs6_device_json_tmp.path }}"
  delegate_to: localhost
  when: stayturgid_autojs6_deploy_via_adb | default(false)

- name: Deploy AutoJs6 project and device profile via adb (Fire OS)
  stayturgid.android_common.autojs6_project_deploy:
    device: "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
    repo_root: "{{ autojs6_repo_root }}"
    target: "{{ autojs6_target }}"
    device_json: "{{ _autojs6_device_json_tmp.path }}"
  delegate_to: localhost
  notify: nudge autojs6 watchdog
  when: stayturgid_autojs6_deploy_via_adb | default(false)

- name: Clean up temporary device profile file (Fire OS)
  ansible.builtin.file:
    path: "{{ _autojs6_device_json_tmp.path }}"
    state: absent
  delegate_to: localhost
  when:
    - stayturgid_autojs6_deploy_via_adb | default(false)
    - _autojs6_device_json_tmp.path is defined

- name: Copy fleet profile to Download location (Fire OS adb)
  ansible.builtin.command:
    argv:
      - adb
      - -s
      - "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
      - shell
      - cp
      - "{{ autojs6_target }}/fleet_profile.json"
      - /sdcard/Download/autojs6-fleet.json
  changed_when: false
  when: stayturgid_autojs6_deploy_via_adb | default(false)

- name: Apply AutoJs6 fleet profile via intent (Fire OS adb)
  stayturgid.android_common.android_intent:
    device: "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
    connect: true
    action: org.autojs.autojs6.action.APPLY_FLEET_PROFILE
    component: org.autojs.autojs6/org.autojs.autojs.core.pref.fleet.FleetProfileActivity
    extras:
      profile_path: /sdcard/Download/autojs6-fleet.json
      silent: "true"
  changed_when: false
  when: stayturgid_autojs6_deploy_via_adb | default(false)

- name: Ensure AutoJs6 watchdog is running (boot-launcher no-ops when alive)
  stayturgid.android_common.android_intent:
    device: localhost:5555
    connect: true
    data: "file://{{ autojs6_target }}/scripts/boot-launcher.js"
    mime_type: text/javascript
    component: org.autojs.autojs6/org.autojs.autojs.external.open.RunIntentActivity
  changed_when: false
  failed_when: false
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))

- name: Apply AutoJs6 fleet profile via intent (SSH path)
  stayturgid.android_common.android_intent:
    device: localhost:5555
    connect: true
    action: org.autojs.autojs6.action.APPLY_FLEET_PROFILE
    component: org.autojs.autojs6/org.autojs.autojs.core.pref.fleet.FleetProfileActivity
    extras:
      profile_path: /sdcard/Download/autojs6-fleet.json
      silent: "true"
  changed_when: false
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))

# ─────────────────────────────────────────────────────────────────
# Shizuku headless configuration (operator fork)
# ─────────────────────────────────────────────────────────────────
- name: Whitelist Shizuku from device idle / battery optimization
  ansible.builtin.shell: |
    {{ stayturgid_adb_bin | default('adb') }} -s \
      "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}" \
      shell dumpsys deviceidle whitelist +moe.shizuku.privileged.api
  changed_when: false
  failed_when: false
  delegate_to: localhost
  when: not (stayturgid_no_local_adb | default(false) | bool)

# Canonical Ansible equivalent of Python's tempfile.mkstemp (unpredictable
# name, not fixed /tmp/shizuku-fleet-<host>.json — see tmpfile security
# audit, 2026-07-21). Never cleaned up before; added below.
- name: Create temporary file for Shizuku fleet profile staging
  ansible.builtin.tempfile:
    state: file
    prefix: "shizuku-fleet-{{ inventory_hostname }}-"
    suffix: .json
  register: _shizuku_fleet_tmp
  delegate_to: localhost
  when: not (stayturgid_no_local_adb | default(false) | bool)

- name: Push Shizuku fleet profile to Download
  ansible.builtin.copy:
    dest: "{{ _shizuku_fleet_tmp.path }}"
    content: |
      {"mode":"adb","start_on_boot":true,"tcp_mode":true,"tcp_port":5555,"watchdog":true}
    mode: "0644"
  delegate_to: localhost
  when: not (stayturgid_no_local_adb | default(false) | bool)

- name: Compute local Shizuku fleet profile checksum
  ansible.builtin.shell: |
    md5 -q "{{ _shizuku_fleet_tmp.path }}" 2>/dev/null || md5sum "{{ _shizuku_fleet_tmp.path }}" | cut -d' ' -f1
  register: _shizuku_fp_local
  changed_when: false
  delegate_to: localhost
  when: not (stayturgid_no_local_adb | default(false) | bool)

- name: Compute remote Shizuku fleet profile checksum
  ansible.builtin.shell: |
    {{ stayturgid_adb_bin | default('adb') }} -s \
      "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}" \
      shell "md5sum /data/local/tmp/shizuku-fleet.json 2>/dev/null | cut -d' ' -f1 || echo MISSING"
  register: _shizuku_fp_remote
  changed_when: false
  failed_when: false
  delegate_to: localhost
  when: not (stayturgid_no_local_adb | default(false) | bool)

- name: Push Shizuku fleet profile to device
  ansible.builtin.shell: |
    {{ stayturgid_adb_bin | default('adb') }} -s \
      "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}" \
      push "{{ _shizuku_fleet_tmp.path }}" /data/local/tmp/shizuku-fleet.json
  when:
    - not (stayturgid_no_local_adb | default(false) | bool)
    - >-
      _shizuku_fp_remote.stdout is not defined
      or 'MISSING' in (_shizuku_fp_remote.stdout | default(''))
      or _shizuku_fp_remote.stdout.strip() != (_shizuku_fp_local.stdout | default('')).strip()
  changed_when: true
  delegate_to: localhost

- name: Clean up temporary Shizuku fleet profile file
  ansible.builtin.file:
    path: "{{ _shizuku_fleet_tmp.path }}"
    state: absent
  delegate_to: localhost
  when:
    - not (stayturgid_no_local_adb | default(false) | bool)
    - _shizuku_fleet_tmp.path is defined

- name: Apply Shizuku fleet profile via intent
  stayturgid.android_common.android_intent:
    device: "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
    connect: true
    action: moe.shizuku.privileged.api.APPLY_FLEET_PROFILE
    component: moe.shizuku.privileged.api/moe.shizuku.manager.fleet.FleetProfileActivity
    extras:
      profile_path: /data/local/tmp/shizuku-fleet.json
      silent: "true"
  changed_when: false
  delegate_to: localhost
  when: not (stayturgid_no_local_adb | default(false) | bool)

# HEADLESS_START may fail on Samsung (process freezer blocks the Java
# broadcast receiver).  Shizuku's internal watchdog restarts the daemon;
# this is a best-effort deploy-time nudge.
- name: Send HEADLESS_START to Shizuku
  stayturgid.android_common.android_intent:
    device: "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
    connect: true
    action: moe.shizuku.privileged.api.HEADLESS_START
  changed_when: false
  failed_when: false
  delegate_to: localhost
  when: not (stayturgid_no_local_adb | default(false) | bool)

- name: Remove retired AutoJs6 project files from device
  ansible.builtin.file:
    path: "{{ autojs6_target }}/{{ item }}"
    state: absent
  loop: "{{ autojs6_retired_files | default([]) }}"
  when: autojs6_retired_files | default([]) | length > 0
