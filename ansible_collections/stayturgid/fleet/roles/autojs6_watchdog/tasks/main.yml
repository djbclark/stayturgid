---
# Deploys the AutoJs6 watchdog project over SSH (Termux writes /sdcard
# directly — no Mac-side adb needed). Replaces autojs6/mac/deploy.py +
# start_watchdog.py in the fleet path; those scripts remain for USB/adb-only
# situations.
# Device profile is DATA generated from the inventory taxonomy — the code
# contains no device-specific names or coordinates.
- name: Ensure shared-storage state dir for the device profile  # noqa: command-instead-of-shell
  ansible.builtin.shell: mkdir -p {{ stayturgid_sd_root }}/state
  changed_when: false

- name: Render device profile from inventory layers
  ansible.builtin.template:
    src: device.json.j2
    dest: "{{ stayturgid_sd_root }}/state/device.json"
  notify: nudge autojs6 watchdog

- name: Deploy AutoJs6 project files
  ansible.builtin.copy:
    src: "{{ autojs6_repo_root }}/autojs6/{{ item }}"
    dest: "{{ autojs6_target }}/"
  loop:
    - project.json
    - main.js
    - lib
    - scripts
  notify: nudge autojs6 watchdog
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))

- name: Note AutoJs6 deploy via Mac adb (Fire OS SSH cannot write sdcard)
  ansible.builtin.debug:
    msg: >-
      Skipping SSH deploy of AutoJs6 to {{ autojs6_target }} —
      run ./autojs6/mac/deploy.py {{ inventory_hostname }} over USB/adb.
  when: stayturgid_autojs6_deploy_via_adb | default(false)

- name: Stage device profile for adb push (Fire OS)
  ansible.builtin.template:
    src: device.json.j2
    dest: "/tmp/stayturgid-{{ inventory_hostname }}-device.json"
  delegate_to: localhost
  when: stayturgid_autojs6_deploy_via_adb | default(false)

- name: Mirror device profile to AutoJs6-readable sdcard path (Fire OS)
  ansible.builtin.shell: |
    set -euo pipefail
    src="/tmp/stayturgid-{{ inventory_hostname }}-device.json"
    dst="/sdcard/stayturgid/state/device.json"
    adb -s "{{ device_usb_serial }}" shell mkdir -p /sdcard/stayturgid/state
    adb -s "{{ device_usb_serial }}" push "$src" "$dst"
  args:
    executable: /bin/bash
  delegate_to: localhost
  when: stayturgid_autojs6_deploy_via_adb | default(false)

- name: Ensure AutoJs6 watchdog is running (boot-launcher no-ops when alive)
  stayturgid.android_common.android_intent:
    device: localhost:5555
    connect: true
    data: "file://{{ autojs6_target }}/scripts/boot-launcher.js"
    mime_type: text/javascript
    component: org.autojs.autojs6/org.autojs.autojs.external.open.RunIntentActivity
  changed_when: false
  failed_when: false
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))
