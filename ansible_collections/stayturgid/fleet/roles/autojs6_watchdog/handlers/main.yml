---
# Note: an already-running main.js engine keeps executing the old code until
# AutoJs6 restarts it (stale-loop detection will flag a dead one); the nudge
# only guarantees the watchdog is running at all.
# Via localhost:5555 (uid 2000): Samsung rejects `am start` from the Termux
# app uid. Fire OS has no Termux loopback — nudge via Mac USB adb instead.
- name: nudge autojs6 watchdog
  stayturgid.android_common.android_intent:
    device: localhost:5555
    connect: true
    data: "file://{{ autojs6_target }}/scripts/boot-launcher.js"
    mime_type: text/javascript
    component: org.autojs.autojs6/org.autojs.autojs.external.open.RunIntentActivity
  when: not (stayturgid_autojs6_deploy_via_adb | default(false))

- name: nudge autojs6 watchdog via Mac adb (Fire OS)
  stayturgid.android_common.android_intent:
    device: "{{ device_usb_serial | default('localhost:5555') }}"
    data: "file://{{ autojs6_target }}/scripts/boot-launcher.js"
    mime_type: text/javascript
    component: org.autojs.autojs6/org.autojs.autojs.external.open.RunIntentActivity
  delegate_to: localhost
  when: stayturgid_autojs6_deploy_via_adb | default(false)
