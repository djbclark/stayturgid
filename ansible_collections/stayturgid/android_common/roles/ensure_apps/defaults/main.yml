---
# Unified app ensure specs — each entry picks a source backend.
#
# Supported sources (control-node, delegate_to: localhost):
#   play — stayturgid.play.play_apps (apkeep/gplaycli + adb)
#   apk  — stayturgid.android_common.android_apk (local/url/gh)
#
# Example:
# stayturgid_ensure_apps:
#   - id: com.google.android.apps.authenticator2
#     source: play
#   - id: com.example.app
#     source: apk
#     gh_repo: example/app
#     gh_tag: v1.2.3          # ensure_apps GitHub entries stay release-locked; the rolling
#     gh_pattern: app.apk     # agent-r* releases are followed by bootstrap_apks (gh_latest)
#     version_name: 1.2.3
#     checksum: "sha256:..."

stayturgid_ensure_apps: []
stayturgid_ensure_apps_device: "{{ target_device | default(inventory_hostname) }}"
stayturgid_repo_root: "{{ ansible_config_file | dirname | dirname }}"
