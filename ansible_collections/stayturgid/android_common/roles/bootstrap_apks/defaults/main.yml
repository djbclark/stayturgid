---
# Bootstrap APK list — installed over ADB from the Mac before Termux SSH exists.
# These are the minimum set needed for the stayturgid fleet to bootstrap itself.
#
# Release-locked: every APK names an immutable GitHub release tag, exact asset,
# expected installed versionName, and SHA-256 digest (except entries with
# gh_latest, which follow the newest upstream release; see Termux:X11 below). A coordinated ops release
# therefore keeps deploying the same desired state even when a repository
# publishes another release or has several independent release streams.
# Set stayturgid_bootstrap_apks_force=true to skip version check and always reinstall.
#
# Obtainium may notify about newer versions, but a normal fleet deploy remains
# authoritative and restores these locked versions.
#
# Each entry:
#   id          — Android package name (required)
#   gh_repo     — GitHub owner/repo (required)
#   gh_tag      — exact immutable release tag (required unless gh_latest)
#   gh_latest   — follow the newest release instead; verified against GitHub's
#                 published asset digest. Excludes gh_tag/version_name/checksum
#   gh_pattern  — Asset glob for `gh release download --pattern` (required)
#   version_name — exact Android versionName expected after install (required unless gh_latest)
#   checksum    — SHA-256 of the release asset before optional resigning (required unless gh_latest)
#   resign      — Resign with debug keystore before install (fork debug builds)
#   monkey      — Launch app via monkey after install (Termux:Boot)
#   start_broadcast_* — headless application-context trigger after install
#   service_component — foreground service to verify after the trigger
#   remove_packages — mutually exclusive package variants to remove
#   detached_install — install through a detached on-device script (default false);
#                 for an APK that carries the adb transport itself (Tailscale)
#   install_timeout — seconds before `adb install` is killed (module default 180);
#                 raise it for a very large APK
#   download_timeout — seconds for the one download (default
#                 stayturgid_download_timeout_seconds, the deploy window).
#                 A partial is kept and continued. Verified APKs are cached
#                 once in ~/.cache/stayturgid/apks
#
# Override via inventory group_vars only to replace the complete lock:
#   stayturgid_bootstrap_apks

stayturgid_bootstrap_apks_force: false

# Deploy's download window. deploy_fleet.py passes this as an extra var from
# STAYTURGID_DOWNLOAD_TIMEOUT_SECONDS, else STAYTURGID_DEPLOY_TIMEOUT_SECONDS.
stayturgid_download_timeout_seconds: 1800

# Package ids a host keeps at whatever it has installed, skipping the lock: a
# device running a newer test build than the fleet pin (the install would fail
# with INSTALL_FAILED_VERSION_DOWNGRADE, and uninstalling loses its data). Set
# per host in inventory with the reason; remove once the pin catches up.
# Deliberately not defined here: verify-bootstrap-apks.yml loads this file with
# include_vars, which would override the inventory value. Read it with
# `| default([])`.
# stayturgid_bootstrap_apks_hold: [moe.shizuku.privileged.api]
stayturgid_native_agent_package: org.stayturgid.agent
stayturgid_native_agent_peer_targets: null
stayturgid_native_agent_shizuku_package: moe.shizuku.privileged.api

# Debug signing defaults (shared with obtainium_apps role).
stayturgid_apksigner_bin: "{{ lookup('env', 'HOME') }}/Library/Android/sdk/build-tools/36.0.0/apksigner"
stayturgid_debug_keystore: "{{ lookup('env', 'HOME') }}/.android/debug.keystore"
stayturgid_debug_keystore_pass: "android"
stayturgid_debug_key_alias: "androiddebugkey"

stayturgid_bootstrap_apks:
  - id: org.stayturgid.agent
    gh_repo: djbclark/stayturgid
    gh_tag: agent-v0.9.19
    gh_pattern: app-release.apk
    version_name: 0.9.19
    checksum: "sha256:a7a4f56f710e0c8a8fde0f4cc488eb147e69258ac00db5521d76168d704034a6"
    resign: false
    start_broadcast_action: org.stayturgid.agent.action.PEER_START_NOW
    start_broadcast_component: org.stayturgid.agent/org.stayturgid.agent.PeerStartReceiver
    service_component: org.stayturgid.agent/.HostService
    remove_packages:
      - org.stayturgid.agent.debug
    shizuku_grant: true
    battery_unrestricted: true
  - id: com.termux
    gh_repo: termux/termux-app
    gh_tag: v0.118.3
    gh_pattern: "termux-app_v0.118.3+github-debug_arm64-v8a.apk"
    version_name: 0.118.3
    checksum: "sha256:72fdb596045116bf5ba1b5bdf5b26fddb9acc0bd074ad9f2da9eb0ae85e83a4e"
  - id: com.termux.boot
    gh_repo: termux/termux-boot
    gh_tag: v0.8.1
    gh_pattern: "termux-boot-app_v0.8.1+github.debug.apk"
    version_name: 0.8.1
    checksum: "sha256:97e6d336f05b59f7cb25e8efa7173e0a6e665f3022b75c6d55a69b6399ecacc8"
    monkey: true
  - id: com.termux.api
    gh_repo: termux/termux-api
    gh_tag: v0.53.0
    gh_pattern: "termux-api-app_v0.53.0+github.debug.apk"
    version_name: 0.53.0
    checksum: "sha256:ecf916ff80ae751e65c092f51c055cce4de417ebeea8e449cd0f294afdbde39a"
  # Tasker plugin: lets Tasker run commands under Termux's UID (sshd recovery
  # trigger that works behind a locked keyguard, where no Termux GUI session
  # can spawn). GitHub-debug build, same signing lineage as the sideloaded
  # copy verified byte-identical on the fleet 2026-10-03.
  - id: com.termux.tasker
    gh_repo: termux/termux-tasker
    gh_tag: v0.9.0
    gh_pattern: "termux-tasker-app_v0.9.0+github.debug.apk"
    version_name: 0.9.0
    checksum: "sha256:4dd14de5f18791b3594256a9ead6bfddafa0434f11e0d39c3b551dda53db2fff"
  # Tracks the newest upstream release (operator decision 2026-10-24: latest
  # over stability). Each deploy resolves the newest release (the republished
  # `nightly` prerelease), verifies the APK against the sha256 digest GitHub
  # publishes for the asset (installs unverified if none), and reinstalls
  # whenever the installed base.apk differs.
  - id: com.termux.x11
    gh_repo: termux/termux-x11
    gh_latest: true
    gh_pattern: termux-x11-universal-debug.apk
  # ShizukuTendCF Drop-In flavor: package id stays moe.shizuku.privileged.api
  # (a true drop-in for stock Shizuku), manager namespace is af.shizuku.manager.
  # resign is FALSE here, unlike every other fork entry: the release is signed
  # with the project's own release key (SHA-256 18a40a45…1ce431), which is the
  # key the fleet's installed r2772 already carries, so this is an in-place
  # upgrade that preserves Shizuku's per-app authorizations. Resigning with the
  # Mac debug key would force a signature-mismatch clean reinstall and lose
  # every grant. Asset name + checksum from the release's SHA256SUMS.
  - id: moe.shizuku.privileged.api
    gh_repo: frdminc/ShizukuTendCF
    gh_tag: "13.7.0.r2895"
    gh_pattern: "ShizukuTendCF-Drop-In-13.7.0.r2895.apk"
    version_name: "ShizukuTendCF 13.7.0.r2895"
    checksum: "sha256:b945ac3fbe0421a4f873b3a329fe7495a8350978fe1dd522a8176c006b499824"
    resign: false
    monkey: true
    battery_unrestricted: true
    # Fire OS 8 does not re-extract native libs on an in-place upgrade, which
    # leaves shizuku_server unable to load librish.so. Clean-reinstall on
    # devices that set stayturgid_shizuku_clean_reinstall (Fire OS group_vars).
    clean: "{{ stayturgid_shizuku_clean_reinstall | default(false) }}"

  - id: com.tailscale.ipn
    gh_repo: tailscale/tailscale-android
    gh_tag: "1.104.2-tc3430f0d2-gb01fa89d5"
    gh_pattern: tailscale-android-universal-1.104.2.apk
    # version_name is what aapt/dumpsys report. 1.104.2 matches the release tag.
    # Signer is the Google Play cert (SHA-256 5cdb2955...), same lineage as 1.104.1.
    version_name: "1.104.2-tc3430f0d2-gb01fa89d5"
    checksum: "sha256:270b3e6e54c99103ed98fa967de7bbf6053e1066250ea35d2b9f450947fd0a78"
    # The adb target is a Tailscale address, so replacing this app cuts the adb
    # connection mid-install (t2e, 2026-10-17: a plain `adb install -r` died with
    # "failed to install" and left the phone off the tailnet). Push the APK and
    # let an on-device script run the install and restore Play Protect, then
    # reconnect and read its log.
    detached_install: true
  # sh.paseo is installed and updated by Google Play
  # (https://play.google.com/store/apps/details?id=sh.paseo). A fleet pin would
  # restore a locked build over Play's update, so it is not in this list.
