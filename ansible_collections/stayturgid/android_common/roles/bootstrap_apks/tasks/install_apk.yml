---
# Install a single bootstrap APK with version-aware idempotency.
# Expected vars: _apk (dict with id, gh_repo, gh_pattern, resign?, monkey?), _bootstrap_adb

- name: Resolve latest GitHub release version — {{ _apk.id }}
  delegate_to: localhost
  block:
    - name: Fetch latest GitHub release tag — {{ _apk.id }}
      ansible.builtin.command:
        argv:
          - gh
          - release
          - view
          - --repo
          - "{{ _apk.gh_repo }}"
          - --json
          - tagName
        # gh release view hits GitHub API; quiet flag suppresses interactive prompts
      register: _gh_release
      # This lookup is read-only; preserve it in --check so later facts do not
      # parse skipped-command output as JSON.
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Read latest release tag — {{ _apk.id }}
      ansible.builtin.set_fact:
        _latest_release_tag: >-
          {{ ((_gh_release.stdout | default('{}') | from_json).tagName | default(''))
             if ((_gh_release.rc | default(1)) == 0 and (_gh_release.stdout | default('') | trim))
             else '' }}

    - name: Parse latest version from tag — {{ _apk.id }}
      ansible.builtin.set_fact:
        _latest_version: "{{ _latest_release_tag | regex_replace('^v', '') if _latest_release_tag else omit }}"

    - name: Query installed version on device — {{ _apk.id }}
      ansible.builtin.shell: >
        adb -s {{ _bootstrap_adb }} shell
        "dumpsys package {{ _apk.id }} 2>/dev/null | grep versionName | head -1"
      register: _installed_version_info
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Parse installed versionName — {{ _apk.id }}
      ansible.builtin.set_fact:
        _installed_version: >-
          {{ (_installed_version_info.stdout | default('') | regex_replace('.*versionName=', '')).strip() }}

    - name: Check if version is current — {{ _apk.id }}
      ansible.builtin.set_fact:
        _version_current: >-
          {{ not stayturgid_bootstrap_apks_force
             and _latest_version != omit
             and _installed_version == _latest_version }}
        _version_unknown: >-
          {{ _latest_version == omit or _installed_version == '' }}

    - name: Install over ADB — {{ _apk.id }}
      stayturgid.android_common.android_apk:
        device: "{{ _bootstrap_adb }}"
        package: "{{ _apk.id }}"
        gh_repo: "{{ _apk.gh_repo }}"
        gh_pattern: "{{ _apk.gh_pattern }}"
        resign: "{{ _apk.resign | default(false) }}"
        force: "{{ (stayturgid_bootstrap_apks_force | default(false)) or _version_unknown }}"
        version_name: "{{ _latest_version if _latest_version != omit else omit }}"
        apksigner_bin: "{{ stayturgid_apksigner_bin | default(omit) }}"
        keystore: "{{ stayturgid_debug_keystore | default(omit) }}"
        keystore_pass: "{{ stayturgid_debug_keystore_pass | default('android') }}"
        key_alias: "{{ stayturgid_debug_key_alias | default('androiddebugkey') }}"
      when: not _version_current | default(false)
      delegate_to: localhost

- name: Launch via monkey (un-stop package) — {{ _apk.id }}
  delegate_to: localhost
  ansible.builtin.command:
    argv:
      - adb
      - -s
      - "{{ _bootstrap_adb }}"
      - shell
      - monkey -p {{ _apk.id }} -c android.intent.category.LAUNCHER 1 2>/dev/null
  changed_when: false
  failed_when: false
  when: _apk.monkey | default(false)
