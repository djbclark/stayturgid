---
# Fleet app catalog for Obtainium (terse specs; the obtainium_app module
# expands them into Obtainium's verbose export format on-device).
# AUTHORITATIVE list — catalogs/obtainium/stayturgid-apps.json is the adb-fallback
# rendering; a pytest sync-guard keeps the two aligned.
stayturgid_obtainium_import_ui: false   # true = pop Obtainium import UI on change
stayturgid_obtainium_catalog: "{{ stayturgid_sd_root }}/import/stayturgid-obtainium-apps.json"

stayturgid_obtainium_apps:
  - id: org.autojs.autojs6
    url: https://github.com/djbclark/AutoJs6
    name: AutoJs6
    author: djbclark
    categories: [Automation]
    settings:
      includePrereleases: true
      filterReleaseTitlesByRegEx: fleet-profile
      apkFilterRegEx: arm64-v8a
      autoApkFilterByArch: true
      about: stayturgid fleet-profile AutoJs6 (djbclark fork)
  - id: moe.shizuku.privileged.api
    url: https://github.com/djbclark/Shizuku
    name: Shizuku (stayturgid fork)
    author: djbclark
    categories: [stayturgid]
    settings:
      includePrereleases: true
      apkFilterRegEx: universal
      autoApkFilterByArch: false
      about: djbclark fork with fleet/headless features (HEADLESS_START)
  - id: dev.imranr.obtainium
    url: https://github.com/djbclark/Obtainium
    name: Obtainium (stayturgid fork)
    author: djbclark
    categories: [stayturgid]
    settings:
      includePrereleases: true
      apkFilterRegEx: universal
      autoApkFilterByArch: false
      about: djbclark fork with fleet/headless features
  - id: com.tailscale.ipn
    url: https://github.com/tailscale/tailscale-android
    name: Tailscale
    author: tailscale
    categories: [stayturgid]
    settings:
      apkFilterRegEx: universal
      autoApkFilterByArch: false
      about: Stable Tailscale IP for ADB/SSH
  - id: com.termux
    url: https://github.com/termux/termux-app
    name: Termux
    author: termux
    categories: [stayturgid]
    settings:
      apkFilterRegEx: github-debug.*arm64-v8a
      autoApkFilterByArch: false
      about: GitHub-debug main app (arm64)
  - id: com.termux.api
    url: https://github.com/termux/termux-api
    name: Termux:API
    author: termux
    categories: [stayturgid]
    settings:
      apkFilterRegEx: github\.debug
      autoApkFilterByArch: false
      about: GitHub-debug addon
  - id: com.termux.boot
    url: https://github.com/termux/termux-boot
    name: Termux:Boot
    author: termux
    categories: [stayturgid]
    settings:
      apkFilterRegEx: github\.debug
      autoApkFilterByArch: false
      about: GitHub-debug addon
  - id: com.termux.styling
    url: https://github.com/termux/termux-styling
    name: Termux:Styling
    author: termux
    categories: [stayturgid]
    settings:
      apkFilterRegEx: github\.debug
      autoApkFilterByArch: false
      about: GitHub-debug addon
  - id: com.termux.widget
    url: https://github.com/termux/termux-widget
    name: Termux:Widget
    author: termux
    categories: [stayturgid]
    settings:
      apkFilterRegEx: github\.debug
      autoApkFilterByArch: false
      about: GitHub-debug addon
  - id: com.termux.window
    url: https://github.com/termux/termux-float
    name: Termux:Float
    author: termux
    categories: [stayturgid]
    settings:
      apkFilterRegEx: github\.debug
      autoApkFilterByArch: false
      about: GitHub-debug addon (window/float)
