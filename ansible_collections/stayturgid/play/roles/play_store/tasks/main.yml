---
# play_store role
# Ensures Aurora Store (FOSS Google Play client) with Shizuku + background updates.

- name: Resolve fleet alias to adb target (USB serial preferred)
  ansible.builtin.set_fact:
    _play_target_device: "{{ lookup('stayturgid.android_common.adb_device', target_device | default(inventory_hostname)) }}"

- name: Detect Aurora Store on device
  ansible.builtin.set_fact:
    _aurora_installed: "{{ aurora_store_package in lookup('stayturgid.android_common.android_packages', _play_target_device) }}"
  delegate_to: localhost

- name: Warn when Aurora Store is missing but required
  ansible.builtin.debug:
    msg: >-
      Aurora Store ({{ aurora_store_package }}) not installed on {{ _play_target_device }}.
      Run ./mac/deploy_fleet.py (or set stayturgid_install_aurora_store: true) to install Aurora via apkeep before this role grants Shizuku.
  when:
    - stayturgid_ensure_aurora_store | bool
    - not (stayturgid_install_aurora_store | default(false) | bool)
    - not _aurora_installed

- name: Download Aurora Store APK via apkeep (when missing)
  when:
    - stayturgid_install_aurora_store | default(false) | bool
    - not _aurora_installed
  ansible.builtin.command:
    argv:
      - apkeep
      - -a
      - "{{ aurora_store_package }}"
      - -d
      - f-droid
      - /tmp
    creates: "/tmp/{{ aurora_store_package }}.apk"
  delegate_to: localhost

- name: Install Aurora Store APK (when missing)
  when:
    - stayturgid_install_aurora_store | default(false) | bool
    - not _aurora_installed
  stayturgid.android_common.android_apk:
    device: "{{ _play_target_device }}"
    package: "{{ aurora_store_package }}"
    apk_path: "/tmp/{{ aurora_store_package }}.apk"
  delegate_to: localhost

- name: Refresh Aurora install fact after optional install
  ansible.builtin.set_fact:
    _aurora_installed: "{{ aurora_store_package in lookup('stayturgid.android_common.android_packages', _play_target_device) }}"
  delegate_to: localhost
  when: stayturgid_install_aurora_store | default(false) | bool

- name: Grant Shizuku to Aurora Store
  when:
    - stayturgid_ensure_aurora_store | bool
    - _aurora_installed
  stayturgid.android_common.shizuku_grant:
    device: "{{ _play_target_device }}"
    package: "{{ aurora_store_package }}"
  delegate_to: localhost
  register: aurora_grant

- name: Ensure Play apps (apkeep/gplaycli + adb install)
  when: stayturgid_play_apps | length > 0
  stayturgid.play.play_apps:
    apps: "{{ stayturgid_play_apps }}"
    device: "{{ _play_target_device }}"
    download_backend: "{{ stayturgid_play_download_backend }}"
    apkeep_source: "{{ stayturgid_play_apkeep_source }}"
    apkeep_options: "{{ stayturgid_play_apkeep_options }}"
    apkeep_accept_tos: "{{ stayturgid_play_apkeep_accept_tos | default(false) | bool }}"
    spoof_play_installer: "{{ stayturgid_play_spoof_installer | bool }}"
    repo_root: "{{ stayturgid_repo_root | default(playbook_dir ~ '/../..', true) }}"
  delegate_to: localhost

- name: Open Aurora Store details for Play apps (manual fallback)
  when:
    - stayturgid_play_open_aurora | bool
    - stayturgid_play_apps | length > 0
    - _aurora_installed
  stayturgid.android_common.android_intent:
    device: "{{ _play_target_device }}"
    data: "market://details?id={{ item.id }}"
    component: "{{ aurora_store_package }}/.MainActivity"
  loop: "{{ stayturgid_play_apps }}"
  loop_control:
    label: "{{ item.id }}"
  delegate_to: localhost
  changed_when: false
