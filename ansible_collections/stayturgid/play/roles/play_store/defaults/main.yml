---
# play_store role defaults
# For managing Google Play apps side, using Aurora Store as GUI client (FOSS Play client).
# Analogous to fdroid_repos / Neo Store.

stayturgid_repo_root: "{{ playbook_dir }}/../.."

stayturgid_play_apps: []
# Example (requires apkeep/gplaycli creds for Play download, or apk_path):
# - id: com.google.android.apps.authenticator2

stayturgid_play_download_backend: apkeep
stayturgid_play_apkeep_source: apk-pure
stayturgid_play_apkeep_options: arch=arm64-v8a
stayturgid_play_spoof_installer: true
# When true, open market://details in Aurora for each app (manual install fallback).
stayturgid_play_open_aurora: false

# Ensure Aurora Store (FOSS Play client) with Shizuku.
stayturgid_ensure_aurora_store: true
# Auto-install Aurora via apkeep + android_apk when missing (first-run UI setup runs in deploy-fleet.sh).
stayturgid_install_aurora_store: false

aurora_store_package: com.aurora.store

# target_device for adb and grant
# target_device: p7a
