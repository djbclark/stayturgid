---
# @heals: A11Y-PROFILE-MATCH TAILSCALE-ALWAYSON
# Post-deploy validation over SSH (complements verify (see `just verify`) / device_tier TAP).

- name: Run stayturgid-repair and parse STATUS
  stayturgid.termux.stayturgid_repair_check:
    repair_script: "{{ termux_home }}/.stayturgid/bin/stayturgid_repair.py"
    termux_prefix: "{{ termux_prefix }}"
    fail_on_unhealthy: false
  register: _repair

- name: Assert repair layer healthy
  ansible.builtin.assert:
    that:
      - _repair.healthy | default(false)
    fail_msg: >-
      Repair unhealthy on {{ inventory_hostname }}:
      {{ _repair.status_line | default('no STATUS') }}
    quiet: true
  when: not ansible_check_mode

- name: Assert Shizuku not FAILED when repair layer is up
  ansible.builtin.assert:
    that:
      - _repair.shizuku | default('') != 'FAILED'
    fail_msg: >-
      Shizuku FAILED on {{ inventory_hostname }}:
      {{ _repair.status_line | default('no STATUS') }}
    quiet: true
  when:
    - not ansible_check_mode
    - _repair.healthy | default(false)

- name: Assert sshd not FAILED when repair layer is up
  ansible.builtin.assert:
    that:
      - _repair.sshd | default('') != 'FAILED'
    fail_msg: >-
      sshd FAILED on {{ inventory_hostname }}:
      {{ _repair.status_line | default('no STATUS') }}
    quiet: true
  when:
    - not ansible_check_mode
    - _repair.healthy | default(false)

- name: Assert a11y not FAILED when repair reports it
  ansible.builtin.assert:
    that:
      - _repair.a11y | default('') != 'FAILED'
    fail_msg: >-
      Accessibility FAILED on {{ inventory_hostname }}:
      {{ _repair.status_line | default('no STATUS') }}
    quiet: true
  when:
    - not ansible_check_mode
    - _repair.healthy | default(false)
    - _repair.a11y is defined
    - _repair.a11y | default('') not in ['', 'skip']

- name: Check whether AutoJs6 is still installed (retired fleet-wide, K1 cutover)
  ansible.builtin.set_fact:
    _autojs6_installed: >-
      {{ 'org.autojs.autojs6' in lookup(
        'stayturgid.android_common.android_packages',
        lookup('stayturgid.android_common.adb_device', inventory_hostname)
      ) }}
  when:
    - not ansible_check_mode
    - stayturgid_validate_a11y_profile | default(true) | bool

- name: Probe accessibility state (detection only)
  stayturgid.android_common.android_a11y_services:
    device: "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
  delegate_to: localhost
  register: _a11y_probe
  when:
    - not ansible_check_mode
    - stayturgid_validate_a11y_profile | default(true) | bool
    - _autojs6_installed | default(false)

- name: Warn when AutoJs6 accessibility is not enabled
  ansible.builtin.debug:
    msg: >-
      WARNING: AutoJs6 accessibility is NOT enabled on {{ inventory_hostname }}.
      Re-enable in Settings > Accessibility > AutoJs6.
  when:
    - not ansible_check_mode
    - stayturgid_validate_a11y_profile | default(true) | bool
    - _autojs6_installed | default(false)
    - not (_a11y_probe.autojs6_present | default(false) | bool)

- name: SSH echo probe
  ansible.builtin.command:
    argv: [echo, termux_ssh_ok]
  changed_when: false
  when: not ansible_check_mode
