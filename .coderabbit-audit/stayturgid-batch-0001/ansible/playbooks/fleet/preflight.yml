---
# SSH preflight — probe Termux SSH and adb-bootstrap hosts that are down.
# Runs at the start of site.yml so ansible-playbook works without deploy_fleet.py.
#
#   ansible-playbook ansible/playbooks/fleet/preflight.yml --limit oneui-device
- name: stayturgid SSH preflight probe
  hosts: stayturgid
  gather_facts: false
  tags: [always, preflight]
  tasks:
    - name: Probe Termux SSH
      ansible.builtin.command:
        argv: [echo, termux_ssh_ok]
      register: _preflight_ssh_probe
      changed_when: false
      ignore_unreachable: true
      failed_when: false
      when: not ansible_check_mode

    - name: Record SSH probe result
      ansible.builtin.set_fact:
        _ssh_preflight_ok: >-
          {{
            not (_preflight_ssh_probe.unreachable | default(false))
            and (_preflight_ssh_probe.rc | default(1)) == 0
            and ('termux_ssh_ok' in (_preflight_ssh_probe.stdout | default('')))
          }}
      when: not ansible_check_mode

- name: stayturgid SSH preflight bootstrap
  hosts: stayturgid
  gather_facts: false
  tags: [always, preflight]
  vars:
    stayturgid_ssh_keys_dir: "{{ lookup('env', 'HOME') }}/.ssh"
  tasks:
    # Best-effort (#103): a fully backgrounded/killed Termux can leave `pkg`
    # and other userland commands unusable via plain `run-as` until the app's
    # own activity has run at least once since it was last killed — matching
    # control/bin/firerpa_heal.py's restart_sshd() technique. Foreground it
    # before the real bootstrap attempt below; ignore failures here, since
    # the bootstrap task's own re-probe/assert is still the source of truth.
    - name: Wake a possibly-backgrounded Termux before SSH bootstrap
      ansible.builtin.command:
        argv:
          - adb
          - -s
          - "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
          - shell
          - am
          - start
          - -n
          - com.termux/.app.TermuxActivity
      delegate_to: localhost
      changed_when: false
      failed_when: false
      when:
        - not ansible_check_mode
        - not (_ssh_preflight_ok | default(false) | bool)

    - name: Pause for Termux to come to foreground
      ansible.builtin.pause:
        seconds: 3
      when:
        - not ansible_check_mode
        - not (_ssh_preflight_ok | default(false) | bool)

    - name: Bootstrap Termux authorized_keys and sshd over adb
      stayturgid.termux.termux_ssh_bootstrap:
        device: "{{ lookup('stayturgid.android_common.adb_device', inventory_hostname) }}"
        keys_dir: "{{ stayturgid_ssh_keys_dir }}"
        public_key_files: "{{ stayturgid_ssh_public_key_files | default([]) }}"
      delegate_to: localhost
      # A module failure here (#103: e.g. `pkg: inaccessible` on a Termux that
      # was fully backgrounded) must not end the play with that raw error —
      # "Re-probe"/"Assert" below are the real source of truth and already
      # have a clearer fail_msg pointing at bootstrap_ssh.py.
      ignore_errors: true
      when:
        - not ansible_check_mode
        - not (_ssh_preflight_ok | default(false) | bool)

    - name: Re-probe Termux SSH after bootstrap
      ansible.builtin.command:
        argv: [echo, termux_ssh_ok]
      register: _preflight_ssh_reprobe
      changed_when: false
      ignore_unreachable: true
      failed_when: false
      when:
        - not ansible_check_mode
        - not (_ssh_preflight_ok | default(false) | bool)

    - name: Assert Termux SSH is reachable
      ansible.builtin.assert:
        that:
          - (_ssh_preflight_ok | default(false) | bool)
            or (
              not (_preflight_ssh_reprobe.unreachable | default(false))
              and (_preflight_ssh_reprobe.rc | default(1)) == 0
              and ('termux_ssh_ok' in (_preflight_ssh_reprobe.stdout | default('')))
            )
        fail_msg: >-
          Termux SSH unavailable on {{ inventory_hostname }} after adb bootstrap.
          Try: ./control/bin/bootstrap_ssh.py {{ inventory_hostname }}
        quiet: true
      when: not ansible_check_mode
