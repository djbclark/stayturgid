[default]
# Ignore git SHA-like hex tokens (e.g. release/handoff docs reference commits
# such as "9ba37de"); a 7+ hex-char identifier is never an English typo.
extend-ignore-identifiers-re = [
  "\\b[0-9a-f]{7,40}\\b",
  # Tailscale Android version strings embed t/g-prefixed commit hashes
  # (e.g. 1.102.4-t3caf7d9e7-g8fbef364a) whose hex tail typos would
  # otherwise "correct" (caf -> calf).
  "\\b[tg][0-9a-f]{7,40}\\b",
]

[default.extend-words]
AAS = "AAS"
WRTE = "WRTE"
OT = "OT"
PN = "PN"
PNG = "PNG"
SER = "SER"
aas = "aas"
als = "als"
laf = "laf"
lamda = "lamda"
mis = "mis"
monitord = "monitord"
unparseable = "unparseable"
