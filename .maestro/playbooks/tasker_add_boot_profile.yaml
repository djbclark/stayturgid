appId: net.dinglisch.android.taskerm
---
- launchApp:
    appId: net.dinglisch.android.taskerm
    clearState: false
- waitForAnimationToEnd:
    timeout: 3000

# Dismiss "Tip" dialog if present
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn:
          text: "OK"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: /tmp/maestro_b0_clean

# Tap the + FAB (bottom right, below sparkle icon ~88%,92%)
- tapOn:
    point: "88%,92%"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/maestro_b1_after_plus

# Tasker shows optional profile name field.
# First tap keyboard ✓ (bottom-right of keyboard) to hide keyboard,
# then tap title-bar ✓ to confirm and open type picker.
- tapOn:
    point: "93%,92%"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    point: "93%,8%"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/maestro_b2_type_picker

# Pick Event
- tapOn:
    text: "Event"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/maestro_b3_event_cats

# Pick System
- tapOn:
    text: "System"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/maestro_b4_system_list

# Pick Device Boot
- tapOn:
    text: "Device Boot"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/maestro_b5_boot_config

# Tap back arrow at top left to confirm event and go to task selection
- tapOn:
    point: "5%,5%"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/maestro_b6_task_select

# Select ADB_Core_Watchdog
- tapOn:
    text: "ADB_Core_Watchdog"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: /tmp/maestro_b7_final
