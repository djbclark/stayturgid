name: test
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install host-side JavaScript quality tools
        run: npm ci
      - name: Install ansible + linters
        run: pipx install ansible-core && pipx install ansible-lint && pipx install yamllint
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
      - name: Set up Python test venv (pytest + ansible-core)
        run: python3 -m venv .venv-test && .venv-test/bin/pip install -q -r tests/python/requirements.txt
      - name: configure
        run: ./configure
      - name: make check (tier a — syntax/lint under CI interpreters)
        run: make check
      - name: make test (tier b shell suite + pytest twins + ansible-test units)
        run: make test
