name: test
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v3
      - name: Install JavaScript quality tools (Biome)
        run: npm install -g @biomejs/biome
      - name: Install shfmt
        run: |
          curl -sSLO https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x shfmt_v3.13.1_linux_amd64
          sudo mv shfmt_v3.13.1_linux_amd64 /usr/local/bin/shfmt
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Install prettier
        run: npm install -g prettier
      - name: Install lychee (link checker)
        run: |
          curl -sSLO https://github.com/lycheeverse/lychee/releases/download/v0.24.2/lychee-v0.24.2-x86_64-unknown-linux-gnu.tar.gz
          tar xzf lychee-v0.24.2-x86_64-unknown-linux-gnu.tar.gz
          sudo mv lychee /usr/local/bin/
          rm lychee-v0.24.2-x86_64-unknown-linux-gnu.tar.gz
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install JS dev dependencies
        run: bun install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - name: Install ansible + linters
        run: >
          uv tool install ansible-core &&
          uv tool install ansible-lint &&
          uv tool install yamllint &&
          uv tool install pyinilint &&
          uv tool install dotenv-linter
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
      - name: Set up Python test venv (pytest + ansible-core)
        run: uv venv .venv-test && uv pip install -q -r tests/python/requirements.txt
      - name: configure
        run: ./configure
      - name: just check (tier a — syntax/lint under CI interpreters)
        run: just check
      - name: just test (tier b shell suite + pytest twins + ansible-test units)
        run: just test
      - name: just lint (tier c — full lint suite)
        run: just lint
      - name: just --fmt --check
        run: just --fmt --check
