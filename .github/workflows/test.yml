name: test
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v3
      - name: Install JavaScript quality tools (Biome)
        run: npm install -g @biomejs/biome
      - name: Install shfmt
        run: |
          curl -sSLO https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x shfmt_v3.13.1_linux_amd64
          sudo mv shfmt_v3.13.1_linux_amd64 /usr/local/bin/shfmt
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Install prettier
        run: npm install -g prettier
      - name: Install npm dev dependencies (prettier-plugin-toml, etc.)
        run: npm install
      - name: Install ansible + linters
        run: uv tool install ansible-core && uv tool install ansible-lint && uv tool install yamllint && uv tool install pyinilint
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
      - name: Set up Python test venv (pytest + ansible-core)
        run: uv venv .venv-test && uv pip install -q -r tests/python/requirements.txt
      - name: configure
        run: ./configure
      - name: just check (tier a — syntax/lint under CI interpreters)
        run: just check
      - name: just test (tier b shell suite + pytest twins + ansible-test units)
        run: just test
      - name: just --fmt --check
        run: just --fmt --check
