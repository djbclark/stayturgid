name: test
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Site resolution has no silent default: CI explicitly selects the
    # upstream generic config for every check and test subprocess.
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      SECRETSPEC_FILE: ${{ github.workspace }}/.github/ci-secretspec.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v3
      - name: Install JavaScript quality tools (Biome)
        run: npm install -g @biomejs/biome
      - name: Install shfmt
        run: |
          curl -sSLO https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x shfmt_v3.13.1_linux_amd64
          sudo mv shfmt_v3.13.1_linux_amd64 /usr/local/bin/shfmt
      - name: Install shellcheck
        # Pinned to match local dev exactly (brew) -- previously relied on
        # whatever version ubuntu-latest's image happened to bundle, which
        # drifts independently of local dev and isn't guaranteed to match.
        run: |
          curl -sSL -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck.tar.xz
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz shellcheck-v0.11.0
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Install prettier
        run: npm install -g prettier
      - name: Install secretspec
        run: |
          curl -fsSLO https://github.com/cachix/secretspec/releases/download/v0.18.0/secretspec-x86_64-unknown-linux-gnu.tar.xz
          tar -xJf secretspec-x86_64-unknown-linux-gnu.tar.xz
          sudo mv secretspec /usr/local/bin/
          rm secretspec-x86_64-unknown-linux-gnu.tar.xz
      - name: Install lychee (link checker)
        run: |
          curl -fsSLO https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          tar xzf lychee-x86_64-unknown-linux-gnu.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          sudo mv lychee /usr/local/bin/
          rm lychee-x86_64-unknown-linux-gnu.tar.gz
      - name: Install dotenv-linter
        run: |
          curl -fsSLO https://github.com/dotenv-linter/dotenv-linter/releases/download/v4.0.0/dotenv-linter-linux-x86_64.tar.gz
          tar xzf dotenv-linter-linux-x86_64.tar.gz
          sudo mv dotenv-linter /usr/local/bin/
          rm dotenv-linter-linux-x86_64.tar.gz
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install JS dev dependencies
        run: bun install
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - name: Install ansible + linters
        run: >
          uv tool install ansible-core &&
          uv tool install ansible-lint &&
          uv tool install yamllint &&
          uv tool install pyinilint
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
      - name: Prepare generic inventory for checks
        run: cp ansible/inventory/hosts.yml.example ansible/inventory/hosts.yml
      - name: Set up Python test venv (pytest + ansible-core)
        run: uv venv .venv-test && uv pip install --python .venv-test/bin/python -q -r tests/python/requirements.txt
      - name: configure
        run: ./configure
      - name: just syntax (generic inventory)
        run: just syntax
      - name: just check (tier a — syntax/lint under CI interpreters)
        run: just check
      - name: just test (tier b shell suite + pytest twins + ansible-test units)
        run: just test
      - name: just lint (tier c — full lint suite)
        run: just lint
      - name: just --fmt --check
        run: just --fmt --check
