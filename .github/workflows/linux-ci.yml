name: Linux CI

# Overlay-only on ci/base. Runs `just test` (shell TAP unit tests, pytest twins,
# ansible-test units, ruff/typos/biome/shfmt/justfile/markdown/prettier/
# html-validate/stylelint/identity checks) on a free GitHub runner.
#
# Triggered by `scripts/github-ci-run` (mode tests or all) pushing
# ci/run/tests-<slug>-<sha8> or ci/run/all-<slug>-<sha8>.
#
# NOT here, by design (they stay on the Mac control node):
#   1. Device tier: `tests/run.sh device`, `just verify` (ADB/SSH/FireRPA live tests).
#   2. Release signing (`just agent-ci-fetch` signs the APK with the release key).
#   3. The Mac control_node apply (launchd, Keychain).
#   4. Dashboard-dependent web checks (lychee, pa11y, puppeteer, lighthouse, vnu).
# The Android agent build is agent-ci.yml, a separate workflow.

on:
  push:
    branches: ['ci/run/tests-*', 'ci/run/all-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  STAYTURGID_CI: "1"
  # Tool versions pinned to the control node's, so format checks (ruff format,
  # prettier, shfmt, biome) judge the same bytes the same way.
  RUFF_VERSION: "0.17.1"
  SHFMT_VERSION: "3.14.1"
  TYPOS_VERSION: "1.51.1"
  BIOME_VERSION: "2.5.15"
  MARKDOWNLINT_VERSION: "0.49.1"
  PRETTIER_VERSION: "3.9.10"
  JUST_VERSION: "1.59.0"

jobs:
  test:
    name: just test (unit TAP, pytest, ansible-test, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v3
        with:
          just-version: ${{ env.JUST_VERSION }}
      - name: Install lint tools (versions match the control node)
        run: |
          set -euo pipefail
          uv tool install "ruff==${RUFF_VERSION}"
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          curl -fsSL "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /tmp ./typos
          sudo install -m 0755 /tmp/typos /usr/local/bin/typos
          sudo npm install -g "@biomejs/biome@${BIOME_VERSION}" "markdownlint-cli@${MARKDOWNLINT_VERSION}" "prettier@${PRETTIER_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Provide what the control node has and a Linux runner lacks
        run: |
          set -euo pipefail
          # 1. adb (the Termux bootstrap tests run it).
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb gawk
          # 2. The Homebrew GNU tools the Mac-targeted role scripts call by their
          #    g* names (gsort, gawk, gfind, gxargs, ...): on Linux the same tools
          #    carry the bare names, so alias them.
          mkdir -p "$HOME/gnu-bin"
          for t in awk find xargs sort sed grep tr date stat cut head tail wc readlink realpath mktemp; do
            if p=$(command -v "$t"); then ln -sf "$p" "$HOME/gnu-bin/g$t"; fi
          done
          echo "$HOME/gnu-bin" >> "$GITHUB_PATH"
          # 3. A site overlay: the tests resolve one the way the control node does
          #    (OPS_ROOT/site-*), and the operator's real site is private. Use the
          #    generic example inventory.
          ops="$RUNNER_TEMP/ops"
          mkdir -p "$ops/site-ci/inventory"
          cp ansible/ansible.cfg "$ops/site-ci/ansible.cfg"
          cp ansible/inventory/hosts.yml.example "$ops/site-ci/inventory/hosts.yml"
          echo "OPS_ROOT=$ops" >> "$GITHUB_ENV"
      - name: Install test environment (.venv-test, node_modules, ansible collections)
        run: |
          set -euo pipefail
          just test-venv
          # `just test` reaches ansible-galaxy and ansible-test through PATH.
          echo "$GITHUB_WORKSPACE/.venv-test/bin" >> "$GITHUB_PATH"
          PUPPETEER_SKIP_DOWNLOAD=1 bun install --frozen-lockfile
      - name: just test
        run: |
          set -euo pipefail
          just test
      - name: Diagnose (each remaining recipe separately)
        if: failure()
        run: |
          for r in ansible-test check-ts ruff typos biome shfmt just-check markdownlint prettier html-validate stylelint validate-identity; do
            echo "::group::$r"
            if just "$r"; then echo "RECIPE-OK $r"; else echo "RECIPE-FAILED $r"; fi
            echo "::endgroup::"
          done
