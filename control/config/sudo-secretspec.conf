# Root-owned sudo-secretspec deployment contract for this Mac.
# No secret values belong here.
SUDO_SECRETSPEC_ENGINE=/usr/local/libexec/sudo-secretspec-engine
SUDO_SECRETSPEC_AUDIT=/usr/local/libexec/sudo-secretspec-audit
SUDO_SECRETSPEC_VAULT=/var/db/stayturgid-secrets
SUDO_SECRETSPEC_VAULT_REALPATH=/private/var/db/stayturgid-secrets
SUDO_SECRETSPEC_DECLARATIONS=/usr/local/share/sudo-secretspec/secretspec.toml.example
SUDO_SECRETSPEC_SERVICE_USER=_secretspec
SUDO_SECRETSPEC_SERVICE_GROUP=staff
