<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stayturgid fleet</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>stayturgid fleet</h1>
  <span class="header-sub">{{ now }}</span>
  <span style="display:flex;gap:8px;">
    <a href="/stats" style="color:var(--link);text-decoration:none;font-size:11px;">stats</a>
    <a href="http://localhost:8088" style="color:var(--link);text-decoration:none;font-size:11px;">network</a>
    <a href="{{ oc_web_url }}" target="_blank" style="color:var(--link);text-decoration:none;font-size:11px;">OpenCode</a>
  </span>
</header>

<main>
  <div id="device-grid"
       hx-get="/api/devices"
       hx-trigger="every 60s, load"
       hx-swap="innerHTML"
       hx-indicator="#spinner">
    {{ cards }}
  </div>
  <div id="spinner" class="htmx-indicator" style="display:none;">
    <div class="spinner"></div>
  </div>
</main>

<footer>
  <span>stayturgid :4097</span>
  <a href="{{ oc_web_url }}" target="_blank">{{ oc_web_url }}</a>
</footer>

</body>
</html>
