# Product sync manifest (Site Contract v1).
# Single source of truth for files site-sync maintains under generated/<product>/.
# Paths are relative to the site dir root. site-sync never writes outside that tree
# in Phase C3 (no serverapp inject-mode writes — Phase D).
#
# contract_version must match the site contract major version.
# template paths are relative to control/site_contract/sync_templates/.

contract_version: 1
product: stayturgid
files:
  - path: generated/stayturgid/README.md
    template: README.md.j2
  - path: generated/stayturgid/fragments/.keep
    template: fragments/.keep.j2
  - path: generated/stayturgid/fragments/caddy/stayturgid.caddy
    template: fragments/caddy/stayturgid.caddy.j2
  - path: generated/stayturgid/fragments/vector/stayturgid_sources.yaml
    template: fragments/vector/stayturgid_sources.yaml.j2
  - path: generated/stayturgid/fragments/vector/stayturgid_sinks.yaml
    template: fragments/vector/stayturgid_sinks.yaml.j2
  - path: generated/stayturgid/fragments/grafana/datasources/stayturgid.yaml
    template: fragments/grafana/datasources/stayturgid.yaml.j2
  - path: generated/stayturgid/fragments/grafana/dashboards/provider.yaml
    template: fragments/grafana/dashboards/provider.yaml.j2
  - path: generated/stayturgid/fragments/grafana/dashboards/json/stayturgid-fleet.json
    template: fragments/grafana/dashboards/json/stayturgid-fleet.json.j2
  - path: generated/stayturgid/fragments/olivetin/stayturgid_actions.yaml
    template: fragments/olivetin/stayturgid_actions.yaml.j2
