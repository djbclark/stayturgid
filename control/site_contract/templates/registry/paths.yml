---
# Product-owned path defaults for a new site registry.
# Generated by control/site_contract/generate_registry_seeds.py; do not hand-copy values.
# Site inventory may override these defaults and remains authoritative.
contract_version: 1
product: stayturgid
prefixes:
  stayturgid:
    - ~/.config/stayturgid/**
    - ~/Library/LaunchAgents/com.stayturgid.*
    - ~/.ssh/config.d/stayturgid
    - ~/.ssh/authorized_keys
    - ~/.hermes/**
    - ~/.local/share/ui-tars/models/1.5-7b/**
    - ~/.local/share/ui-tars/server/**
    - ~/.local/share/openobserve/data/**
    - ~/.local/bin/openobserve
    - /data/local/tmp/firerpa/**
    - /sdcard/stayturgid/**
claim_sources:
  ~/.config/stayturgid/**:
    source: ansible/roles/control_node/defaults/main.yml#conf_dir
  ~/Library/LaunchAgents/com.stayturgid.*:
    source: ansible/roles/control_node/defaults/main.yml#agents_dir
  ~/.ssh/config.d/stayturgid:
    source: ansible/roles/control_node/defaults/main.yml#ssh_config_fragment
  ~/.ssh/authorized_keys:
    source: ansible/roles/control_node/defaults/main.yml#ssh_config_dir
    access: marked-block-only
  ~/.hermes/**:
    source: ansible/roles/control_node/defaults/main.yml#stayturgid_hermes_home
  ~/.local/share/ui-tars/models/1.5-7b/**:
    source: ansible/roles/control_node/defaults/main.yml#ui_tars_model_dir
  ~/.local/share/ui-tars/server/**:
    source: ansible/roles/control_node/defaults/main.yml#ui_tars_working_dir
  ~/.local/share/openobserve/data/**:
    source: ansible/roles/control_node/defaults/main.yml#openobserve_data_dir
  ~/.local/bin/openobserve:
    source: ansible/roles/control_node/defaults/main.yml#openobserve_bin_path
  /data/local/tmp/firerpa/**:
    source: ansible_collections/stayturgid/firerpa/roles/firerpa/defaults/main.yml#firerpa_install_dir
  /sdcard/stayturgid/**:
    source: ansible/inventory/group_vars/all.yml#stayturgid_sd_root
