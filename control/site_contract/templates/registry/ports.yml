---
# Product-owned port defaults for a new site registry.
# Generated by control/site_contract/generate_registry_seeds.py; do not hand-copy values.
# Site inventory may override these defaults and remains authoritative.
contract_version: 1
product: stayturgid
hosts: {}
product_defaults:
  control_node:
    - port: 1337
      bind: 127.0.0.1
      owner: stayturgid
      service: olivetin
      status: default-claim
      source: ansible/roles/serverapp_olivetin/defaults/main.yml#serverapp_olivetin_http_port
    - port: 2022
      bind: '*'
      owner: stayturgid
      service: eternal-terminal
      status: default-claim
      source: ansible/roles/control_node/defaults/main.yml#stayturgid_control_et_port
    - port: 3000
      bind: 127.0.0.1
      owner: stayturgid
      service: grafana
      status: default-claim
      source: ansible/roles/serverapp_grafana/defaults/main.yml#serverapp_grafana_http_port
    - port: 4096
      bind: 127.0.0.1
      owner: stayturgid
      service: opencode-web
      status: default-claim
      source: ansible/roles/control_node/defaults/main.yml#stayturgid_opencode_web_port
    - port: 4097
      bind: 127.0.0.1
      owner: stayturgid
      service: fleet-dashboard
      status: default-claim
      source: ansible/roles/control_node/defaults/main.yml#stayturgid_dashboard_port
    - port: 4317
      bind: 127.0.0.1
      owner: stayturgid
      service: vector-otlp-grpc
      status: default-claim
      source: ansible/roles/control_node/templates/vector.yaml.j2#regex
    - port: 4318
      bind: 0.0.0.0
      owner: stayturgid
      service: vector-otlp-http
      status: default-claim
      source: ansible/roles/control_node/defaults/main.yml#vector_otlp_port
    - port: 5080
      bind: 127.0.0.1
      owner: stayturgid
      service: openobserve-http
      status: default-claim
      source: ansible/roles/control_node/defaults/main.yml#openobserve_port
    - port: 8080
      bind: 127.0.0.1
      owner: stayturgid
      service: caddy-health
      status: default-claim
      source: control/landing/services.json#Caddy Health
    - port: 8081
      bind: 127.0.0.1
      owner: stayturgid
      service: ui-tars-vlm
      status: default-claim
      source: ansible/roles/control_node/defaults/main.yml#ui_tars_port
    - port: 8088
      bind: 127.0.0.1
      owner: stayturgid
      service: landing
      status: default-claim
      source: control/landing/services.json#Network Landing (localhost)
    - port: 8428
      bind: 127.0.0.1
      owner: stayturgid
      service: victoriametrics
      status: default-claim
      source: ansible/roles/serverapp_victoriametrics/defaults/main.yml#serverapp_victoriametrics_http_port
    - port: 8686
      bind: 127.0.0.1
      owner: stayturgid
      service: vector-api
      status: default-claim
      source: ansible/roles/serverapp_vector/defaults/main.yml#serverapp_vector_api_port
  fleet_device:
    - port: 5555
      bind: '*'
      owner: stayturgid
      service: adb-wireless
      status: default-claim
      source: README.md#regex
    - port: 8022
      bind: '*'
      owner: stayturgid
      service: termux-sshd
      status: default-claim
      source: ansible/inventory/hosts.yml.example#all.children.stayturgid.vars.ansible_port
    - port: 9012
      bind: '*'
      owner: stayturgid
      service: handsets-fireos
      status: default-claim
      source: ansible_collections/stayturgid/termux/roles/termux_userland/defaults/main.yml#stayturgid_handsets_port
    - port: 9013
      bind: '*'
      owner: stayturgid
      service: handsets-oneui
      status: default-claim
      source: ansible/inventory/group_vars/model_galaxy_s24.yml#stayturgid_handsets_port
    - port: 9014
      bind: '*'
      owner: stayturgid
      service: handsets-stock-android
      status: default-claim
      source: ansible/inventory/group_vars/model_pixel_7a.yml#stayturgid_handsets_port
    - port: 65000
      bind: '*'
      owner: stayturgid
      service: firerpa
      status: default-claim
      source: ansible_collections/stayturgid/firerpa/roles/firerpa/defaults/main.yml#firerpa_port
